      abaixo do nome — todo evento novo precisa de "goal" · área de contagem (Prepare-se → 3 → 2 → 1 → GO! → segundos restantes) ·
      MÉTRICA PRINCIPAL do evento (def.met: rótulo, unidade, valor ao vivo, referência e good() que pinta verde/laranja; no On Fire! é a
      VELOCIDADE; fica VERDE quando acima da base e VERMELHA quando não atende) · BARRA DE PROGRESSO do tempo do evento (def.dur) com "x / dur s" · linha de recompensa.
   PALETA do card: AZUL (neon/brand do app) e BRANCO. Verde/vermelho só para o carimbo de resultado e para a cor da velocidade; não use laranja.
   4. RESULTADO: animação de CARIMBO sobre o card (evStamp): "CONCLUÍDO" em VERDE (#34d399) se venceu, "FRACASSOU" em VERMELHO (#ff4d4d) se
      perdeu. Vitória = +ECO.coinEvt moedas e +ECO.xpEvt XP (addGain), som/vibração 'evwin'; derrota = sem prêmio, vibração 'evlost'.
   5. LINHA DO TEMPO (evTick roda 1x por segundo; k = segundos desde o disparo): k=0 disparo (sfx/haptic 'event') · k=1 "Prepare-se" ·
      k=2..4 contagem 3-2-1 (haptic 'count') · k=5 "GO!" (haptic 'go') · k>=6 uma amostra por segundo em e.s (velocidade) e e.c (cadência);
      ao juntar def.dur amostras, avalia com def.ok(e). A barra anda de 0 a 100% ao longo das def.dur amostras.
   6. QUANDO DISPARA: treino rodando (não pausado), pelo menos 5 min de treino, no ponto da rota sorteado, velocidade >= 10 km/h e sem outro
      evento ativo. Quantidade: ~1 a cada 3 km (mín. 2, máx. 8), posições espaçadas (planEvents). Nunca na Fuga da Horda.
   7. CRIAR UM NOVO EVENTO = acrescentar um objeto em EVENTS: {id, t (nome), dur (s), goal (objetivo, texto curto), met:{l,u,dec,val(L),ref(e),good(v,e)},

      cadência → val:L=>L.cad, u:'rpm'). Use SEMPRE este mesmo card; não crie outro layout. Atualize esta lista se as regras mudarem.
   8. O aviso do sensor cardíaco (#hrwarn, centro da tela) desce para o rodapé enquanto o card do evento está visível (hrWarnUpd).
   9. Para testar, o perfil oculto Admin (digite "admin" na escolha de perfil) tem o botão "Ativar evento" (adminEvent → evBegin), que força um evento durante um treino rodando.

const EV_BASE_N=5;   /* On Fire!: a base é a média da velocidade dos EV_BASE_N segundos anteriores; acompanha a média até o GO e fica fixa a partir dele */
const EVENTS=[
 {id:'fire',t:'On Fire!',dur:10,goal:'Nos próximos 10 segundos, fique acima da velocidade média atual',
  met:{l:'Velocidade',u:'km/h',dec:1,val:L=>L.spd,ref:e=>({l:'Média atual a superar',v:e.base.toFixed(1)+' km/h'}),good:(v,e)=>v>e.base},
  ok:e=>e.s.filter(v=>v>e.base).length>=6}
];
const evDef=id=>EVENTS.find(x=>x.id===id)||EVENTS[0];   /* id desconhecido (treino salvo antigo) = On Fire! */
/* Quantidade de eventos proporcional ao circuito (~1 a cada 3 km, entre 2 e 8), espaçados ao longo do percurso */
function planEvents(r){const n=Math.min(8,Math.max(2,Math.round(r.dist/3))),out=[];
  for(let t=0;out.length<n&&t<500;t++){const f=.1+Math.random()*.8;
    if(out.every(x=>Math.abs(x.f-f)>=.06))out.push({f,ev:EVENTS[Math.floor(Math.random()*EVENTS.length)].id,st:'todo'})}
  return out.sort((a,b)=>a.f-b.f)}
function ensureEvs(){const w=S.wo,r=route();if(r&&!w.evs.length)w.evs=planEvents(r)}
function evShow(h){const el=$('#evt');if(!el)return;el.innerHTML=h||'';el.style.display=h?'flex':'none';hrWarnUpd()}
/* dispara o evento nx (de w.evs): base = média dos últimos 5 s de velocidade (ou a velocidade atual se ainda não há histórico) */
function evBegin(nx){const w=S.wo,def=evDef(nx.ev),h=w.spdH.slice(-EV_BASE_N),base=h.length?h.reduce((a,b)=>a+b,0)/h.length:live().spd;
  nx.st='on';w.evCur={id:def.id,idx:w.evs.indexOf(nx),k:0,base,s:[],c:[]};sfx('event');
  evShow(evCardHtml(def,w.evCur));evSync()}
/* progresso da barra: 0 até o GO; depois sobe 1/dur a cada segundo (já "antecipando" o próximo segundo, para chegar a 100% junto com o resultado) */
const evPct=(e,def)=>e.k<5?0:Math.round(Math.min(e.s.length+1,def.dur)/def.dur*100);
function evCardHtml(def,e){const m=def.met;
  return `<div id="ev-card" class="bodyin relative w-[min(92vw,420px)] rounded-3xl border-2 border-neon/60 bg-panel p-5 text-center shadow-[0_20px_70px_rgba(0,0,0,.75),0_0_40px_rgba(106,195,255,.28)]">
   <div id="ev-in" style="transition:opacity .25s">
    <div class="text-[11px] uppercase tracking-[.3em] text-neon">Evento</div>

    <div class="text-sm text-zinc-300 mt-2">${def.goal}</div>

    <div class="rounded-2xl bg-ink border border-line px-3 py-2">
     <div class="text-[11px] uppercase tracking-wide text-zinc-400">${m.l}</div>
     <div class="font-display text-6xl font-extrabold tabular-nums leading-none"><span id="ev-m">--</span><span class="text-base font-sans font-normal text-zinc-500 ml-1">${m.u}</span></div>
     <div id="ev-ref" class="text-xs text-zinc-400 mt-1"></div>
    </div>
    <div class="mt-4"><div class="flex justify-between text-[11px] text-zinc-400 mb-1"><span>Tempo do evento</span><span id="ev-t" class="tabular-nums"></span></div>
     <div class="h-3 rounded-full bg-line overflow-hidden"><div id="ev-bar" class="h-full rounded-full bg-gradient-to-r from-brand to-neon" style="width:${evPct(e,def)}%;transition:width 1s linear"></div></div></div>
   </div>

  </div>`}
/* valor ao vivo da métrica principal (chamado a cada segundo e a cada leitura do sensor) */
function evMetric(){const e=S.wo.evCur;if(!e)return;const el=document.getElementById('ev-m');if(!el)return;
  const m=evDef(e.id).met,v=m.val(live());el.textContent=v.toFixed(m.dec);el.style.color=e.k>=5?(m.good(v,e)?'#34d399':'#ff4d4d'):'#fff';
  const rf=document.getElementById('ev-ref');if(rf&&m.ref){const r=m.ref(e);rf.textContent=r.l+': '+r.v}}
/* atualiza contagem, tempo e barra do card conforme o segundo (k) e as amostras já coletadas */
function evSync(){const e=S.wo.evCur;if(!e)return;const def=evDef(e.id),cd=document.getElementById('ev-cd');
  const key=e.k<=1?'prep':e.k<=4?'c'+e.k:e.k===5?'go':'run';
  if(cd&&cd.dataset.k!==key){cd.dataset.k=key;
    cd.innerHTML=key==='prep'?'<div class="bodyin text-lg font-semibold text-zinc-200">Prepare-se</div>'
      :key==='go'?'<div class="bodyin font-display text-7xl font-extrabold text-neon leading-none" style="text-shadow:0 0 24px rgba(106,195,255,.55)">GO!</div>'
      :key==='run'?'<div class="font-display text-7xl font-extrabold text-white tabular-nums leading-none"><span id="ev-left"></span><span class="text-lg font-sans font-normal text-zinc-400 ml-1">s</span></div>'
      :`<div class="bodyin font-display text-7xl font-extrabold text-white leading-none">${5-e.k}</div>`}
  const l=document.getElementById('ev-left');if(l)l.textContent=Math.max(0,def.dur-e.s.length);
  const t=document.getElementById('ev-t');if(t)t.textContent=Math.min(e.s.length,def.dur)+' / '+def.dur+' s';
  const b=document.getElementById('ev-bar');if(b)b.style.width=evPct(e,def)+'%';
  evMetric()}
/* resultado: carimbo "CONCLUÍDO" (verde) ou "FRACASSOU" (vermelho) sobre o card */
function evStamp(won){const c=document.getElementById('ev-card');if(!c)return;
  const b=document.getElementById('ev-bar');if(b)b.style.width='100%';
  const inn=document.getElementById('ev-in');if(inn)inn.style.opacity='.3';
  const rw=document.getElementById('ev-rw');if(rw){rw.className='mt-3 min-h-[1.25rem] text-sm font-semibold bodyin '+(won?'text-white':'text-zinc-400');rw.textContent=won?'+'+ECO.coinEvt+' engrenagens · +'+ECO.xpEvt+' XP':'Não dessa vez'}
  const st=document.createElement('div'),col=won?'#34d399':'#ff4d4d';st.className='ev-stamp font-display';st.textContent=won?'Concluído':'Fracassou';st.style.color=col;st.style.borderColor=col;
  c.classList.add('ev-hit');c.appendChild(st)}
/* soma moedas e XP do treino (no modo Horda valem ×ECO.hordaMul); o saldo do perfil só é creditado ao encerrar (finish) */
let sfxHold=false;   /* ao finalizar, o som de fim substitui os sons de moeda */
function addGain(c,x,kind){const w=S.wo,p=profile(),fx=petFx(p),m=w.mode==='horda'?ECO.hordaMul:1;
  /* bônus do mascote equipado: % geral (xp/coin) + o específico do tipo de ganho (km, evento, conclusão, velocidade) */
  let cm=1+(fx.coin||0)/100,xm=1+(fx.xp||0)/100;
  if(kind==='km'){c+=fx.kmcoin||0;x+=fx.kmxp||0}
  else if(kind==='evt'&&fx.evento){cm+=fx.evento/100;xm+=fx.evento/100}
  else if(kind==='conc'&&fx.conc){cm+=fx.conc/100;xm+=fx.conc/100}
  else if(kind==='vel'&&fx.vel)cm+=fx.vel/100;
  c=Math.round(c*m*cm);x=Math.round(x*m*xm);if(c<=0&&x<=0)return;w.coins+=c;w.xp+=x;
  /* o mascote equipado recebe o mesmo XP do corredor (mais o bônus "Aprendiz rápido") */
  let px=0;if(p&&MASCOTS[p.mascot]){px=Math.round(x*(1+(fx.pxp||0)/100));w.pet=p.mascot;w.pxp=(+w.pxp||0)+px}
  if(c>0&&!sfxHold)sfx('coin');else if(!sfxHold)haptic('coin');
  set('m-pts',w.coins.toLocaleString('pt-BR'));const f=$('#m-ptsfl');if(f){f.textContent='+'+c+(x?' · +'+x+' XP'+(px?' · '+MASCOTS[p.mascot].icon+' +'+px+' XP':''):'');f.style.opacity=1;clearTimeout(f._t);f._t=setTimeout(()=>f.style.opacity=0,1400)}}
/* ganho de altimetria (m) do km k da rota, a partir do perfil de elevação */
function gainKm(r,k){const e=r.elev,n=e.length-1;if(n<1)return 0;const i0=Math.round((k-1)/r.dist*n),i1=Math.min(n,Math.round(k/r.dist*n));let g=0;for(let i=i0+1;i<=i1;i++)if(e[i]>e[i-1])g+=e[i]-e[i-1];return g}
function kmSync(){const w=S.wo,r=route();while(w.kmAw<Math.floor(w.dist+1e-9)){w.kmAw++;const g=r?gainKm(r,w.kmAw):0;w.elev=(+w.elev||0)+g;addGain(ECO.coinKm+g*ECO.coinGain,ECO.xpKm+g*ECO.xpGain,'km')}}
/* Chamado a cada segundo com o treino em andamento */
function evTick(){const w=S.wo,r=route();if(!r||!w.running||w.arming)return;
  const L=live();w.spdH.push(L.spd);if(w.spdH.length>8)w.spdH.shift();
  kmSync();
  if(w.secs-(w.trLast||0)>=5){w.trace.push([Math.round(w.secs),+w.dist.toFixed(3)]);w.trLast=w.secs}   /* rastro (tempo, distância) para o ghost */
  if(w.mode==='horda'||w.mode==='maratona')return;                                                                              /* sem eventos aleatórios na Fuga da Horda */
  if(!w.evCur){
    /* só dispara após 5 min, com o ciclista pedalando e no ponto sorteado */
    const nx=w.evs.find(x=>x.st==='todo');
    if(!nx||w.secs<300||w.dist/r.dist<nx.f||L.spd<10)return;
    evBegin(nx);return}
  const e=w.evCur,def=evDef(e.id);e.k++;
  if(e.k<=5){const h=w.spdH.slice(-EV_BASE_N);if(h.length)e.base=h.reduce((a,b)=>a+b,0)/h.length}   /* média móvel dos segundos anteriores até o GO; depois fica congelada */
  if(!document.getElementById('ev-card'))evShow(evCardHtml(def,e));   /* recria o card depois de uma pausa */
  if(e.k>=2&&e.k<=4)haptic('count');else if(e.k===5)haptic('go');
  if(e.k>=6){e.s.push(def.met.val(L));e.c.push(L.cad);                /* uma amostra por segundo depois do GO */
    if(e.s.length>=def.dur){
      const won=def.ok(e);w.evs[e.idx].st=won?'won':'lost';w.evTot++;
      if(won){w.evOk++;addGain(ECO.coinEvt,ECO.xpEvt,'evt')}
      w.evCur=null;haptic(won?'evwin':'evlost');
      evStamp(won);setTimeout(()=>{if(!S.wo.evCur)evShow('')},2600);return}}
  evSync()}

/* ---------- Sensores ---------- */
function live(){if(S.sim.on)return{spd:S.sim.spd,cad:S.sim.cad,hr:S.sim.hr};
  const s=S.sensor,now=Date.now(),okC=now-s.ts<4000,okH=now-s.th<5000;return{spd:okC?s.spd:0,cad:okC?s.cad:0,hr:okH?s.hr:0}}
function parseHR(v){const f=v.getUint8(0);S.sensor.hr=f&1?v.getUint16(1,true):v.getUint8(1);S.sensor.th=Date.now();fastUpd('hr')}
/* FTMS - Indoor Bike Data (0x2AD2): velocidade, cadência, potência e FC numa característica só */
function parseFTMS(v){
  const f=v.getUint16(0,true);let o=2;
  const u16=()=>{const x=v.getUint16(o,true);o+=2;return x},s16=()=>{const x=v.getInt16(o,true);o+=2;return x};
  if(!(f&1)){S.sensor.spd=u16()*0.01}        /* bit0=0: velocidade instantânea (0,01 km/h) */
  if(f&2)o+=2;                                /* velocidade média */
  if(f&4){S.sensor.cad=u16()*0.5}             /* cadência instantânea (0,5 rpm) */
  if(f&8)o+=2;                                /* cadência média */
  if(f&16)o+=3;                               /* distância total (uint24) */
  if(f&32)o+=2;                               /* nível de resistência */
  if(f&64){S.sensor.pw=s16()}                 /* potência instantânea (W) */
  if(f&128)o+=2;                              /* potência média */
  if(f&256)o+=5;                              /* energia gasta (2+2+1) */
  if(f&512){const hr=v.getUint8(o);o+=1;if(hr>0){S.sensor.hr=hr;S.sensor.th=Date.now()}}
  S.sensor.ts=Date.now();fastUpd('ftms')}
let prevCsc=null;
function parseCSC(v){const f=v.getUint8(0);let o=1,cur={};
  if(f&1){cur.wr=v.getUint32(o,true);cur.wt=v.getUint16(o+4,true);o+=6}
  if(f&2){cur.cr=v.getUint16(o,true);cur.ct=v.getUint16(o+2,true)}
  if(prevCsc){
    if(cur.wr!=null&&prevCsc.wr!=null){const dr=cur.wr-prevCsc.wr,dt=((cur.wt-prevCsc.wt+65536)%65536)/1024;
      if(dt>0)S.sensor.spd=dr*2.096/dt*3.6;else if(Date.now()-S.sensor.ts>2000)S.sensor.spd=0}
    if(cur.cr!=null&&prevCsc.cr!=null){const dr=(cur.cr-prevCsc.cr+65536)%65536,dt=((cur.ct-prevCsc.ct+65536)%65536)/1024;
      if(dt>0)S.sensor.cad=dr/dt*60}}
  prevCsc=cur;S.sensor.ts=Date.now();fastUpd('csc')}
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

/* Tela ligada durante o treino (Wake Lock; no iOS exige 16.4+) */
let wake=null;

/* Tela sempre acesa enquanto houver treino iniciado (rodando, pausado ou em contagem): a trava só é liberada ao finalizar/zerar.

/* ---------- Vibração (háptico) ----------
   Android (Chrome/Edge/Firefox): navigator.vibrate(padrão em ms) — exige que o usuário já tenha tocado na página (o 3-2-1 nasce de um toque).
   iOS (Safari/PWA 17.4+): o Safari NÃO tem navigator.vibrate; o truque é alternar um <input type="checkbox" switch> escondido via label.click(),
   que dispara o "tique" do Taptic Engine. Cada "tique" é um pulso fixo, então os padrões viram tiques no início de cada pulso.
   No iPhone também precisam estar ligados: Ajustes › Sons e Tato › Tato do Sistema, e o Modo de Pouca Energia desligado. */
const HAP={   /* padrão Android: [vibra, pausa, vibra, ...] em ms (nomes iguais aos do sfx) */
  count:[35],                                       /* 3, 2, 1 */
  go:[70,50,70,50,170],                             /* largada / GO! */
  coin:[18],                                        /* ganho de moedas/XP: toque leve */
  event:[90,70,90,70,190],                          /* evento aleatório começou */
  evwin:[60,40,60,40,160],                          /* evento conquistado */
  evlost:[130],                                     /* evento perdido */
  win:[70,50,70,50,70,50,280],                      /* treino concluído */
  end:[170,70,90],                                  /* treino encerrado antes do fim */
  work:[40],rest:[55,40,55],                        /* começo da série / início do descanso (academia) */
  pause:[45,60,45],resume:[45],                     /* pausa / retomada */
  level:[60,40,60,40,60,40,60,40,320]};             /* subiu de nível */
const HAP_AND=typeof navigator.vibrate==='function';
const HAP_IOS=(()=>{if(HAP_AND||!IOS)return false;const m=navigator.userAgent.match(/OS (\d+)[_.](\d+)/);return !m||+m[1]>17||(+m[1]===17&&+m[2]>=4)})();
const HAP_OK=HAP_AND||HAP_IOS;
let HAP_ON=true,hapLbl=null,hapT=[],hapCoin=-1e9;
function hapEl(){if(hapLbl&&hapLbl.isConnected)return hapLbl;

  i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;l.appendChild(i);document.body.appendChild(l);return hapLbl=l}
function haptic(name,force){
  if((!(HAP_ON||!isAdmin())&&!force)||document.hidden)return;const p=HAP[name];if(!p)return;
  if(name==='coin'){const n=performance.now();if(n-hapCoin<250)return;hapCoin=n}   /* vários ganhos de uma vez = um só toque */
  if(isAdmin())hapPopup(name,p);                                                    /* Admin no PC: mostra o comando em pop-up */
  if(!HAP_OK)return;

    if(HAP_AND){if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;navigator.vibrate(p);return}

const SFXB={};let _sfxLd=0;
function sfxLoad(ac){if(_sfxLd||!ac)return;_sfxLd=1;
  Object.entries(SFXD).forEach(([k,[g,b]])=>{try{const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const p=ac.decodeAudioData(u.buffer,buf=>{SFXB[k]=[buf,g]},()=>{});if(p&&p.catch)p.catch(()=>{})}catch(e){}})}
let _sfxT={};
function sfx(name){haptic(name);const ac=audioCtx();if(!ac)return;
  if(ac.state!=='running'){const r=ac.resume();if(r&&r.then)r.then(()=>{if(ac.state==='running')sfx(name)}).catch(()=>{});return}
  const n=performance.now();if(name==='coin'){if(n-(_sfxT.coin||-1e9)<250)return;_sfxT.coin=n}   /* vários ganhos de uma vez = um só som */
  sfxLoad(ac);const sb=SFXB[name];
  if(sb){try{const s=ac.createBufferSource(),gn=ac.createGain();s.buffer=sb[0];gn.gain.value=sb[1];s.connect(gn);gn.connect(ac.destination);s.start();return}catch(e){}}
  try{const t=ac.currentTime+.01;(SFX[name]||[]).forEach(([f,d,l,ty,to,v])=>{const o=ac.createOscillator(),g=ac.createGain(),t0=t+d;o.type=ty||'sine';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+l);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v||.2,t0+.012);g.gain.exponentialRampToValueAtTime(.001,t0+l);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+l+.03)})}catch(e){}}

/* rótulo do botão Iniciar/Pausar/Retomar (atualizado sem redesenhar a tela, para não atrapalhar sliders etc.) */
function playLbl(){const w=S.wo,started=w.dist>0||w.running||w.auto;return `<i data-lucide="${w.running?'pause':'play'}" class="w-5 h-5"></i>${w.running?'Pausar':started&&!w.arming?'Retomar':'Iniciar Pedal'}`}
function refreshPlay(){hrWarnUpd();document.querySelectorAll('.js-play').forEach(b=>{b.innerHTML=playLbl()});if(window.lucide)lucide.createIcons()}
/* Pausa automática: depois que o treino começa de fato (3-2-1 e velocidade > 0), velocidade 0 pausa na hora; voltar a pedalar retoma sozinho.
   Só retoma pausas automáticas (uma pausa manual espera o botão). Na Fuga da Horda não há pausa automática: parar é justamente o perigo. */
function autoCheck(){const w=S.wo;if(w.arming||cdBusy||w.mode==='horda'||w.mode==='maratona'||!route())return;const spd=live().spd;
  if(w.running){if(spd>0)w.armed=true;
    else if(w.armed){w.running=false;w.auto=true;evShow('');beep('pause');refreshPlay();toast('Treino pausado: velocidade 0')}}
  else if(w.auto&&spd>0){w.running=true;w.auto=false;w.last=Date.now();beep('resume');refreshPlay();toast('Treino retomado')}}

    const old=devs[kind];devs[kind]=dev;if(old&&old!==dev){try{old.gatt.disconnect()}catch(_){}}
    dev.addEventListener('gattserverdisconnected',()=>{if(devs[kind]!==dev)return;S.bt[kind]=null;if(kind==='csc')prevCsc=null;render();setTimeout(()=>reconnect(kind),1500)});
    toast('Conectando a '+(dev.name||'sensor')+'...');

  catch(e){
    if(e.name==='NotFoundError')toast('Nenhum sensor selecionado. Acorde o sensor (gire a pedivela / ponha a cinta) e tente de novo, ou use "Mostrar todos".');

/* ---------- Ghost Run ----------
   O ghost corre o melhor tempo prévio (seu ou do líder do ranking) na mesma pista e no mesmo modo de inclinação. Usa o rastro
   (tempo, distância) gravado no treino; treinos antigos, sem rastro, caem num ritmo constante com o tempo total. */
S.ghost=load('cad_ghost','me');
function bestRun(r,p,m=S.inten){const l=((p&&p.history)||[]).filter(h=>h.routeId===r.id&&h.done&&(h.mode||'normal')==='normal'&&(h.inten||'off')===m);return l.length?l.reduce((a,b)=>b.time<a.time?b:a):null}

  if(S.ghost==='leader'&&lvInfo(G().xp).l>=FEAT.ghostLider){const b=board(r)[0],lp=b&&S.profiles.find(x=>x.id===b.pid);if(lp){p=lp;src='leader'}}
  const run=bestRun(r,p);if(!run)return null;
  return{src,name:p.name,me:p.id===S.cur,total:run.time,tr:run.trace&&run.trace.length>1?run.trace:null}}

function ghDist(gh,t,r){if(!gh)return 0;if(t>=gh.total)return r.dist;const tr=gh.tr;if(!tr)return r.dist*t/gh.total;
  for(let i=1;i<tr.length;i++)if(t<=tr[i][0]){const a=tr[i-1],b=tr[i],f=b[0]>a[0]?(t-a[0])/(b[0]-a[0]):1;return a[1]+(b[1]-a[1])*f}return tr[tr.length-1][1]}
function ghTime(gh,d,r){if(!gh)return 0;const tr=gh.tr;if(!tr)return gh.total*Math.min(1,d/r.dist);
  for(let i=1;i<tr.length;i++)if(d<=tr[i][1]){const a=tr[i-1],b=tr[i],f=b[1]>a[1]?(d-a[1])/(b[1]-a[1]):1;return a[0]+(b[0]-a[0])*f}return gh.total}

/* Aviso central "Coloque as mãos sobre o sensor cardíaco": visível enquanto o treino está rodando (fora da contagem 3-2-1) e sem batimento (live().hr = 0);
   some assim que o BPM volta. Em modo simulado o BPM nunca é 0, então não aparece. */
function hrWarnUpd(){const e=document.getElementById('hrwarn');if(!e)return;
  const lift=!!document.getElementById('ev-card');   /* card do evento no centro: o aviso desce para o rodapé */
  e.style.top=lift?'auto':'';e.style.bottom=lift?'5.5rem':'';e.style.transform=lift?'translateX(-50%)':'';
  const show=!!(S.cur&&S.wo.running&&!S.wo.arming&&!cdBusy&&!(live().hr>0));
  e.style.opacity=show?'.82':'0';e.style.visibility=show?'visible':'hidden'}
/* Atualização rápida: a cada leitura recebida do sensor (no máximo 1 por frame), só os números.
   A taxa é a da própria bike; nada é interpolado nem inventado. O mapa/gráfico continuam a 1 s. */
let fastRaf=0,rateT={};
function fastUpd(k){autoCheck();hrWarnUpd();const n=performance.now(),a=rateT[k]||(rateT[k]=[]);a.push(n);if(a.length>10)a.shift();
  if(a.length>2){const dt=(a[a.length-1]-a[0])/(a.length-1)/1000;if(dt>0)S.sensor.rate[k]=1/dt}
  if(fastRaf)return;
  fastRaf=requestAnimationFrame(()=>{fastRaf=0;evMetric();
    if(S.cur&&S.tab==='home'){updHome();return}
    if(!(S.cur&&(S.tab==='treino'||S.tab==='maratona')&&S.wo.running)||S.sim.on)return;
    if(!advance())return;
    const L=live(),w=S.wo,r=route();if(!r)return;const fc=factor(grade(r,Math.min(1,w.dist/r.dist)));
    set('m-spd',L.spd.toFixed(1));set('m-cad',Math.round(L.cad));set('m-hr',L.hr?Math.round(L.hr):'--');
    set('m-dist',w.dist.toFixed(2));set('m-time',fmt(w.secs));set('m-vspd',(L.spd*fc).toFixed(1));updMode();mrSend()})}

/* Sequência de dias: dias seguidos com treino (pedal ou academia). Conta os treinos que ainda estão nas listas. */
function streakCard(p){
  const num=k=>{const a=k.split('-');return Math.round(Date.UTC(+a[0],+a[1],+a[2])/864e5)},
   set=new Set([...(p.history||[]).map(h=>gyDay(h.date)),...gyD(p).log.map(x=>gyDay(x.d))].map(num)),nums=[...set].sort((a,b)=>a-b),tn=num(gyDay(Date.now())),doneToday=set.has(tn);
  let best=0,run=0;nums.forEach((n,i)=>{run=(i&&n===nums[i-1]+1)?run+1:1;if(run>best)best=run});
  let cur=0,d=doneToday?tn:tn-1;while(set.has(d)){cur++;d--}
  best=Math.max(best,cur);
  const dots=[];for(let i=13;i>=0;i--){const n=tn-i,on=set.has(n);dots.push(`<div class="flex-1 h-5 rounded-md ${on?'bg-neon':'bg-ink border border-line'}" ${n===tn?'style="box-shadow:0 0 0 2px #fff"':''} title="${new Date(n*864e5+432e5).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'UTC'})}${on?' · treinou':''}"></div>`)}
  const tile=(l,v)=>`<div class="rounded-xl bg-ink border border-line p-3"><div class="text-xs text-zinc-400">${l}</div><div class="font-display text-3xl font-bold text-neon tabular-nums">${v}</div></div>`;
  return `<section class="rounded-2xl bg-panel border border-line p-4"><h3 class="font-display text-2xl font-bold mb-0.5 flex items-center gap-2"><i data-lucide="zap" class="w-5 h-5 text-neon"></i>Sequência de dias</h3><p class="text-xs text-zinc-500 mb-3">Dias seguidos com treino de pedal ou academia.</p>
   <div class="flex items-end gap-2"><div class="font-display text-6xl font-bold text-neon leading-none tabular-nums">${cur}</div><div class="text-sm text-zinc-400 pb-1">${cur===1?'dia seguido':'dias seguidos'}</div></div>
   ${cur>0&&!doneToday?'<p class="text-xs text-ember mt-1">Treine hoje para manter a sequência.</p>':''}
   <div class="grid grid-cols-2 gap-2 mt-3">${tile('Maior sequência',best+(best===1?' dia':' dias'))}${tile('Dias de treino',nums.length)}</div>
   <div class="mt-3"><div class="text-[11px] text-zinc-500 mb-1">Últimos 14 dias</div><div class="flex gap-1" aria-label="Últimos 14 dias de treino">${dots.join('')}</div></div></section>`}
function perfil(){const p=profile(),h=p.history,hl=[...h.map(x=>({r:x,d:x.date})),...gyD(p).log.map(x=>({g:x,d:x.d}))].sort((a,b)=>b.d-a.d),km=h.reduce((a,x)=>a+x.dist,0)+G(p).del.km,t=h.reduce((a,x)=>a+x.time,0)+G(p).del.t,bmi=p.weight/Math.pow(p.height/100,2);

   ${pinRow(p)}<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mt-5">${stat('Quilometragem total',km.toFixed(1)+' km')}${stat('Tempo total',fmt(t))}${stat('Treinos',h.length+G(p).del.n)}${stat('Rotas com recorde',bests.length)}${stat('Nível',lvInfo(G(p).xp).l)}${stat('Engrenagens',G(p).coins.toLocaleString('pt-BR'),'text-white')}</div><div class="mt-3">${calBox(p,'bg-ink')}</div></section>${bmiCard(p)}${remCard(p)}

   Ordem pedida: começa com 5 níveis de diferença de uma para outra e a distância vai aumentando até o LED RGB, no nível 100. */

const FRAMES=Object.fromEntries(FRAME_LIST.map(f=>[f.id,f]));
const NEON_COLORS=['#00e5ff','#39ff14','#ff2bd6','#ffe600','#ff7a00','#ff2a2a','#3d7bff','#b44dff','#ffffff'];
const okColor=c=>/^#[0-9a-fA-F]{6}$/.test(c||'');

function saveCosm(p){if(!isAdmin()){saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)})}}

function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
/* molduras que saíram do catálogo: Aço Escovado virou Prata, Neon Ciano/Magenta viraram o Neon (com a cor guardada); Titânio, Ouro Reluzente, Neon e Papel foram removidas e o preço volta em engrenagens */
function cosmMigrate(p){if(!p)return{ch:false,ref:0};let ch=false,ref=0;if(!Array.isArray(p.owned))p.owned=[];
  const swap=(old,nw,col)=>{const k='frame:'+old,i=p.owned.indexOf(k);
    if(i>=0){p.owned.splice(i,1);if(nw&&!p.owned.includes('frame:'+nw))p.owned.push('frame:'+nw);if(col&&!p.frameColor)p.frameColor=col;ch=true}
    if(p.frame===old){p.frame=nw||'';if(col&&!p.frameColor)p.frameColor=col;ch=true}};
  swap('aco','prata');swap('neon-ciano','neon','#00e5ff');swap('neon-magenta','neon','#ff2bd6');
  [['titanio',700],['ouro-brilho',6000],['neon',62000],['papel',100]].forEach(([old,pr])=>{if(p.owned.includes('frame:'+old)){G(p).coins+=pr;ref+=pr}swap(old,'')});
  if(p.frame&&!FRAMES[p.frame]){p.frame='';ch=true}
  return{ch:ch||ref>0,ref}}

function buyFrame(id){const p=profile(),f=FRAMES[id],g=G(p);if(!p||!f||ownsItem(p,'frame:'+id))return;

  if(!confirm('Comprar a moldura "'+f.name+'" por '+f.price.toLocaleString('pt-BR')+' engrenagens?'))return;

/* ---------- Importação GPX ---------- */
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);
  const q=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function parseGPX(txt,fallbackName){

  if(pts.length<2)throw new Error('Nenhum ponto de trilha (trkpt) encontrado no arquivo.');
  let dist=0,prev=null;const cum=[],ele=[],xy=[];
  const lat0=+pts[0].getAttribute('lat'),lon0=+pts[0].getAttribute('lon'),kx=Math.cos(lat0*Math.PI/180)*111.32;
  pts.forEach(p=>{const c=[+p.getAttribute('lat'),+p.getAttribute('lon')];if(prev)dist+=hav(prev,c);prev=c;cum.push(dist);
    xy.push([(c[1]-lon0)*kx,-(c[0]-lat0)*110.57]);
    const e=p.getElementsByTagName('ele')[0];ele.push(e?parseFloat(e.textContent):NaN)});
  const rs=[];{let j=0;for(let i=0;i<240;i++){const tg=dist*i/239;while(j<cum.length-1&&cum[j]<tg)j++;
    const a=Math.max(j-1,0),sp=cum[j]-cum[a],t=sp>0?Math.min(1,Math.max(0,(tg-cum[a])/sp)):0;
    rs.push([xy[a][0]+(xy[j][0]-xy[a][0])*t,xy[a][1]+(xy[j][1]-xy[a][1])*t])}}
  const track=normTrack(rs);
  const valid=ele.filter(v=>!isNaN(v)).length;let elev,simElevated=false;
  if(valid>=pts.length*.5&&dist>0){elev=[];let j=0,last=ele.find(v=>!isNaN(v));

/* =====================================================================================================================
   MODO MARATONA — corrida online 1 x 1 na mesma pista (2 aparelhos, 2 bikes)
   · Transporte: Supabase Realtime BROADCAST no canal "maratona:CÓDIGO" (sem tabelas; só as rotas exclusivas usam maratona_routes).
   · Cada aparelho mede e integra a PRÓPRIA distância (a bike de cada um é a fonte da verdade) e envia ao outro: distância virtual (já com
     inclinação), velocidade, cadência, FC, kcal e tempo. Envio: a cada leitura nova do sensor, no máx. 1 pacote a cada 400 ms, mais um
     "batimento" a cada 1 s mesmo parado. Pacotes têm número de sequência (atrasados/fora de ordem são descartados).
   · Quem recebe não "pula": estima a posição do adversário entre pacotes (distância + velocidade × tempo, no máx. 2,5 s) e suaviza o movimento.
   · Largada sincronizada: o anfitrião é a referência de relógio. O convidado mede o desvio (ping/pong, usa a menor latência) e todos
     largam no mesmo instante; o tempo da prova é o relógio compartilhado (não depende de pausas locais; não existe pausa na Maratona).
   · A sala leva um "snapshot" da rota (traçado + altimetria + distância): o convidado não precisa ter a rota. Inclinação da prova = a do anfitrião.
   · Rotas exclusivas: S.mrRoutes (localStorage cad_mr_routes + tabela maratona_routes), nunca aparecem na biblioteca clássica.
   ===================================================================================================================== */

function mrOpen(code,host){
  if(!sb){toast('A Maratona precisa do Supabase configurado');return false}
  const m=S.mr;
  m.ch=sb.channel('maratona:'+code,{config:{broadcast:{self:false,ack:false},presence:{key:m.cid}}});
  ['room','join','full','rdy','go','pos','fin','ping','pong','bye'].forEach(ev=>m.ch.on('broadcast',{event:ev},({payload})=>mrRecv(ev,payload||{})));
  m.ch.on('presence',{event:'leave'},({key})=>{if(m.op&&m.op.cid===key)mrPeerGone()});
  m.ch.subscribe(st=>{
    if(st==='SUBSCRIBED'){m.ch.track({cid:m.cid});if(!host)mrSendEv('join',{who:mrWho()})}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){toast('Sem conexão em tempo real. Verifique a internet e o Realtime do Supabase')}});
  return true}
function mrSync(){const m=S.mr;let n=0;const t=setInterval(()=>{if(!m.ch||++n>6){clearInterval(t);return}mrSendEv('ping',{t0:Date.now()})},350)}
function mrRecv(ev,d){const m=S.mr,o=m.op;
  if(d.to&&d.to!==m.cid)return;
  switch(ev){
   case 'join':{if(!m.host)return;if(m.ph!=='room'||(o&&o.cid!==d.from)){mrSendEv('full',{to:d.from});return}
     m.op={...d.who,rdy:false};m.rdy=false;mrSendEv('room',{to:d.from,route:m.route,inten:m.inten,who:mrWho()});toast(d.who.name+' entrou na sala');if(S.tab==='maratona')render();break}
   case 'room':{if(m.host)return;m.route=d.route;m.inten=d.inten;m.op={...d.who,rdy:false};clearTimeout(m.jt);mrSync();if(S.tab==='maratona')render();break}
   case 'full':if(!m.host){toast('Esta sala já tem dois ciclistas');mrLeave()}break;
   case 'ping':if(m.host)mrSendEv('pong',{to:d.from,t0:d.t0,th:Date.now()});break;
   case 'pong':{const t1=Date.now(),rtt=t1-d.t0;if(rtt<m.rtt){m.rtt=rtt;m.off=d.th+rtt/2-t1}if(S.tab==='maratona'&&m.ph==='room')render();break}
   case 'rdy':if(o&&d.from===o.cid){o.rdy=!!d.rdy;if(S.tab==='maratona')render();mrCheckGo()}break;
   case 'go':if(!m.host&&m.ph==='room'&&m.route)mrBegin(d.startAt);break;
   case 'pos':{if(!o||d.from!==o.cid||!(d.q>(o.q||0)))return;
     Object.assign(o,{q:d.q,d:d.d,v:d.v,s:d.s,c:d.c,h:d.h,k:d.k,t:d.t,rx:performance.now()});if(!o.ab)o.left=false;if(o.disp==null)o.disp=d.d;break}
   case 'fin':{if(!o||d.from!==o.cid)return;if(d.done)o.fin=d.t;else{o.ab=true;o.left=true}document.querySelectorAll('.mr-res').forEach(e=>e.innerHTML=mrResHtml());break}
   case 'bye':if(o&&d.from===o.cid)mrPeerGone();break}}
function mrCheckGo(){const m=S.mr;if(m.host&&m.ph==='room'&&m.rdy&&m.op&&m.op.rdy){const t=Date.now()+6000;mrSendEv('go',{startAt:t});mrBegin(t)}}
function mrBegin(t){const m=S.mr;m.startAt=t;m.ph='cd';m.cdN=0;m.my=null;

/* envio das métricas (ver cabeçalho): chamado a cada leitura do sensor e a cada 1 s */
function mrSend(){const m=S.mr,w=S.wo;if(m.ph!=='race'||!mrOn()||!w.running)return;

function gyTlPaint(g){const tl=$('#gy-tl');if(!tl)return;const it=g.w.it[g.i],cs=Math.max(0,Math.min(it[1],g.ph==='rest'?g.s:g.s-1));

const gyCur=()=>{const g=S.gy,it=g.w.it[g.i];return{it,x:GY_BY[it[0]]}};

function gyGo(ph){const g=S.gy,{it,x}=gyCur(),n=Date.now();g.ph=ph;g.cn=0;
  g.end=ph==='prep'?n+(g.first?5000:3000):ph==='rest'?n+(it[3]!=null?it[3]:g.w.r)*1000:(x.t==='t'?n+it[2]*1000:null);g.first=false;
  if(ph==='work')sfx('work');else if(ph==='rest')sfx('rest');gyPre()}

  if(g.paused){g._e=!!g.end;g.rem=g.end?Math.max(0,g.end-Date.now()):0;g.end=null}else{if(g._e)g.end=Date.now()+g.rem;g._e=false;g.last=Date.now()}

  if(!g.paused){if(g.ph==='work'){g.work+=dt;g.kc+=gyCur().x.m*W*dt/3.6e6}else{g.rest+=dt;g.kc+=GY_REST*W*dt/3.6e6}

  if(k!==g.vk){g.vk=k;const b=$('#gyb');if(b){b.innerHTML=gyBody();b.scrollTop=0}const pb=$('#gy-pb');if(pb)pb.innerHTML=`<i data-lucide="${g.paused?'play':'pause'}" class="w-5 h-5"></i>`;lucide.createIcons()}

  else main=`<div class="text-center py-2"><div class="text-emerald-300 text-sm font-semibold uppercase tracking-wider">Série ${g.s}/${it[1]}</div><div class="font-display text-8xl font-extrabold text-white tabular-nums leading-none">${it[2]}</div><div class="text-sm text-zinc-400 mt-1">repetições</div></div><div class="flex gap-2">${btn('gyNext()','Série concluída','check','bg-brand text-white')}</div>`;

function gyQuit(){const g=S.gy;if(!g)return;const ok=g.sets>0&&(g.work+g.rest)/1000>=30;

/* Rolagem do fundo travada enquanto houver janela em primeiro plano (pop-ups em #modal, treino guiado da academia #gyp, contagem 3-2-1).
   Só a própria janela pode rolar; os ouvintes de wheel/touchmove existem apenas enquanto a trava está ativa. */
(function(){
  const FG='#modal>*,#gyp,body>div[style*="z-index:9998"]',root=document.documentElement;
  let on=false,y0=0,x0=0;
  const inFg=t=>!!(t&&t.closest&&t.closest(FG));
  const canScroll=(t,d)=>{for(let n=t;n&&n!==document.body&&n!==document.documentElement;n=n.parentElement){
    const o=getComputedStyle(n).overflowY;
    if((o==='auto'||o==='scroll')&&n.scrollHeight>n.clientHeight+1&&(d<0?n.scrollTop>0:n.scrollTop+n.clientHeight<n.scrollHeight-1))return true}
    return false};
  const onWheel=e=>{if(e.ctrlKey)return;if(!inFg(e.target)||!canScroll(e.target,e.deltaY))e.preventDefault()};
  const onStart=e=>{if(e.touches.length){y0=e.touches[0].clientY;x0=e.touches[0].clientX}};
  const onMove=e=>{if(e.touches.length>1)return;const t=e.touches[0],dy=y0-t.clientY,dx=x0-t.clientX;
    if(inFg(e.target)&&Math.abs(dx)>Math.abs(dy))return;   /* gesto horizontal dentro da janela (carrosséis) */
    if(!inFg(e.target)||!canScroll(e.target,dy))e.preventDefault()};
  const set=v=>{if(v===on)return;on=v;root.classList.toggle('sl',v);
    const f=v?'addEventListener':'removeEventListener';
    window[f]('wheel',onWheel,{passive:false});window[f]('touchstart',onStart,{passive:true});window[f]('touchmove',onMove,{passive:false})};
  const sync=()=>set(!!document.querySelector(FG));
  const mo=new MutationObserver(sync);mo.observe(document.body,{childList:true});
  const m=document.getElementById('modal');if(m)mo.observe(m,{childList:true});
  sync()})();
let bootRemote;
async function boot(){
  if(!sb){bootRemote=null;applyInten();render();return}
  $('#app').innerHTML='<main class="min-h-screen grid place-items-center text-zinc-400">Carregando dados…</main>';
  S.cur=S.lastCur;let remote=null;
  try{await flush();if(outbox.length)throw new Error('pendente');remote=await pull();await mrPull();setSync('ok')}
  catch(e){console.error(e);setSync('err');toast('Sem conexão com o Supabase: usando os dados salvos neste aparelho')}
  S.cur=null;bootRemote=remote;applyInten();render()}
/* Academia: baixa e decodifica todos os quadros em segundo plano logo ao abrir o app; quando a aba abre, as imagens já estão prontas (sem "pop in") */
function gyPreloadAll(){if(window._gyPl)return;window._gyPl=1;
  const ids=[...new Set(GY_PRE.flatMap(w=>w.it.map(a=>a[0])))].filter(id=>GY_BY[id]),jobs=[];
  [0,1,2].forEach(k=>ids.forEach(id=>{if(gyFr(id).includes(k))jobs.push([id,k])}));
  let i=0;const next=()=>{if(i>=jobs.length)return;const[id,k]=jobs[i++],u=gyImg(id,k),im=new Image();im.crossOrigin='anonymous';
    const fin=()=>setTimeout(next,0);
    im.onload=()=>{const done=()=>{GY_LOADED.add(u);fin()};if(im.decode)im.decode().then(done,done);else done()};
    im.onerror=fin;im.src=u};
  for(let n=0;n<6;n++)next()}
setTimeout(gyPreloadAll,200);
boot();
