<style>
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;overscroll-behavior-x:none;overscroll-behavior-y:none;color-scheme:dark;background:#000}
body{background:#000;color:#e6f1fb;font-family:Figtree,system-ui,sans-serif;overscroll-behavior-y:none;

button,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* iOS dá zoom ao focar campos com fonte < 16px */
@supports(-webkit-touch-callout:none){input:not([type=range]),select,textarea{font-size:16px!important}}
/* altura dinâmica (barra do Safari/Bluefy); ignorado onde dvh não existe */

/* rolagem interna da Home/Treino sem barra visível (a barra ocupava largura e descentralizava o conteúdo) */
.hm-scroll{scrollbar-width:none;-ms-overflow-style:none}.hm-scroll::-webkit-scrollbar{display:none}
@supports not (scrollbar-gutter:stable){html{overflow-y:scroll}}
/* janela/pop-up/tela cheia em primeiro plano: o fundo não rola */
html.sl,html.sl body{overflow:hidden!important}
#modal>div>div,#gyb{overscroll-behavior:contain}
/* mobile vertical: colunas viram "contents" para reordenar os blocos da aba Treino numa única coluna */
@media(max-width:1023px){.tr-cols{display:contents!important}}
@media(max-width:639px){.tabbtn{flex:1 1 0;justify-content:center;padding-left:.25rem!important;padding-right:.25rem!important}.tabbtn:not(.on) .lbl{display:none}.tabbtn.on{flex:2.2 1 0}}
.tabbtn{transition:color .18s,border-color .18s}
/* campos de hora/data no iOS têm largura própria e vazavam do card: forçam a largura do container */
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;text-align:left;min-height:2.6rem}
input[type=time]::-webkit-date-and-time-value,input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
#modal form{max-width:100%}#modal form>*{min-width:0}
.hz-alert{box-shadow:0 0 0 2px #ff4d4d,0 0 20px rgba(255,77,77,.55)!important;animation:hzp .8s ease-in-out infinite alternate}@keyframes hzp{to{box-shadow:0 0 0 2px #ff4d4d,0 0 4px rgba(255,77,77,.2)}}
/* eventos: fundo escurecido, carimbo (CONCLUÍDO/FRACASSOU) e impacto do card */
@keyframes evfade{from{opacity:0}to{opacity:1}}.ev-dim{animation:evfade .3s ease-out}
.ev-stamp{position:absolute;left:50%;top:44%;white-space:nowrap;font-weight:800;font-size:2.7rem;line-height:1;letter-spacing:.06em;text-transform:uppercase;padding:.16em .45em;border:.2em solid currentColor;border-radius:.35em;background:rgba(0,0,0,.4);text-shadow:0 0 16px currentColor;box-shadow:0 0 26px currentColor,inset 0 0 10px rgba(255,255,255,.08);animation:evstamp .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes evstamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(3.2)}55%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(.88)}78%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
@keyframes evhit{0%,100%{transform:none}35%{transform:translateY(6px) scale(.985)}65%{transform:translateY(-2px)}}.ev-hit{animation:evhit .3s .28s ease-out}
@media(prefers-reduced-motion:reduce){.ev-stamp,.ev-hit,.ev-dim{animation-duration:.01s!important;animation-delay:0s!important}}
/* pop-up de vibração (Admin) */
.hap-pop{display:flex;gap:.6rem;align-items:center;background:#080f17;border:1px solid rgba(255,161,61,.6);border-radius:.9rem;padding:.55rem .75rem;box-shadow:0 8px 28px rgba(0,0,0,.6);transition:opacity .3s,transform .3s;animation:happin .25s ease-out}
.hap-ic{font-size:1.5rem;display:inline-block;animation:hapshake .45s ease-in-out 2}
@keyframes happin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes hapshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
@keyframes recfill{to{stroke-dashoffset:0}}
@keyframes recTxtR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes recTxtL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes bodyin{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}.bodyin{animation:bodyin .5s ease-out}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
main{touch-action:pan-y pinch-zoom}
/* molduras de perfil: .fr = aro (clipado em círculo) · .frb = camada de fundo · .fri = miolo com o avatar */
.fr{position:relative;display:inline-block;flex-shrink:0;border-radius:50%;overflow:hidden;isolation:isolate;vertical-align:middle}
.frb{position:absolute;inset:0;z-index:0}
.fri{position:absolute;z-index:1;border-radius:50%;overflow:hidden;background:#000}
.fr-madeira .frb{background:repeating-linear-gradient(95deg,rgba(0,0,0,.35) 0 2px,transparent 2px 7px),repeating-linear-gradient(88deg,rgba(255,170,120,.10) 0 1px,transparent 1px 11px),linear-gradient(135deg,#5a2418,#3b160f 40%,#6b2f1f 70%,#33120c)}
.fr-bronze .frb{background:linear-gradient(135deg,#6b3f17,#cd7f32 25%,#f0b070 42%,#a8642a 62%,#5e3512 82%,#cd7f32)}
.fr-prata .frb{background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(135deg,#8a9096,#6c7278 45%,#979da3 70%,#767c82)}
.fr-fibra .frb{background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%,rgba(255,255,255,.08) 70%,transparent),repeating-linear-gradient(45deg,#0c0c0c 0 2px,#2a2a2a 2px 4px),repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 2px,transparent 2px 4px);background-color:#111}
.fr-ouro .frb{background:linear-gradient(135deg,#7a5200,#ffd95a 25%,#fff3b0 40%,#d89b12 60%,#8a5a00 80%,#ffd95a)}
.fr-platina .frb{background:linear-gradient(135deg,#dfe8f0,#a9bccd 22%,#f8fbff 44%,#93a8bd 66%,#d3e0ec 86%,#f4f8fc)}
.fr-diamante{animation:frdiam 2.2s ease-in-out infinite alternate}
.fr-diamante .frb{background:conic-gradient(from 20deg,#3aa6ff,#8ccdff,#1f86f0,#8ccdff,#2f9bff,#a9d8ff,#1479e6,#8ccdff,#3aa6ff)}
.fr-diamante .frb::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 36%,rgba(170,220,255,.8) 50%,transparent 64%);background-size:260% 100%;animation:frshine 2.2s ease-in-out infinite}
.fr-led-rgb{--gc:rgba(255,255,255,.7)}
.fr-led-rgb .frb{inset:-50%;background:conic-gradient(#ff2a2a,#ffd02a,#2aff5c,#2af0ff,#2a5cff,#d02aff,#ff2a2a);animation:frspin 1.1s linear infinite}
.fr-led-chase{--gc:rgba(0,255,157,.9)}
.fr-led-chase .frb{inset:-50%;background:repeating-conic-gradient(#00ff9d 0 9deg,#04241a 9deg 30deg);animation:frspin 1.3s steps(48) infinite}
.fr-chamas{color:#ff6a00;animation:frflame 1.3s ease-in-out infinite alternate}
.fr-chamas .frb{inset:-50%;background:conic-gradient(#ff2d00,#ffb300,#ff5a00,#ffe066,#ff2d00,#ff8800,#ffe066,#ff2d00);animation:frspin .9s linear infinite,frflick .25s steps(2) infinite alternate}
@keyframes frdiam{from{box-shadow:0 0 4px rgba(50,150,255,.6)}to{box-shadow:0 0 8px rgba(70,165,255,.8),0 0 14px rgba(40,140,255,.45)}}
@keyframes frspin{to{transform:rotate(360deg)}}
@keyframes frshine{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes frflame{from{box-shadow:0 0 5px rgba(255,106,0,.55),0 -2px 10px rgba(255,61,0,.35)}to{box-shadow:0 0 9px rgba(255,160,0,.65),0 -5px 15px rgba(255,90,0,.4)}}
@keyframes frflick{from{filter:brightness(1) saturate(1)}to{filter:brightness(1.25) saturate(1.15)}}
/* glow fixo de base (aparece mesmo se o aparelho estiver com 'reduzir movimento'); a animação abaixo só o faz pulsar */
.fr{box-shadow:0 0 6px var(--gc,rgba(255,255,255,.45))}
.fr-diamante{box-shadow:0 0 6px rgba(50,150,255,.65)}
.fr-chamas{box-shadow:0 0 6px rgba(255,106,0,.55),0 -2px 11px rgba(255,61,0,.35)}
.mas:not(.mas-vazio){box-shadow:0 0 6px color-mix(in srgb,var(--rc) 50%,transparent)}
/* glow pulsante (cor própria de cada moldura em --gc) */
.fr-madeira,.fr-bronze,.fr-prata,.fr-fibra,.fr-ouro,.fr-platina,.fr-led-rgb,.fr-led-chase{animation:frpulse 2.2s ease-in-out infinite alternate}
@keyframes frpulse{from{box-shadow:0 0 5px var(--gc)}to{box-shadow:0 0 8px var(--gc),0 0 14px color-mix(in srgb,var(--gc) 45%,transparent)}}
/* brilho giratório que percorre o aro de TODAS as molduras (o miolo .fri fica por cima, então só o aro brilha) */
.fr::after{content:"";position:absolute;inset:-50%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 32%,var(--sc,rgba(255,255,255,1)) 78%,var(--sc,rgba(255,255,255,1)) 88%,transparent 96% 100%);animation:frspin var(--sd,3.4s) linear infinite}
.fr-madeira{--sc:rgba(255,200,140,.55);--sd:1.4s;--gc:rgba(130,55,30,.6)}.fr-bronze{--sc:rgba(255,235,190,.9);--sd:1.2s;--gc:rgba(240,150,70,.9)}.fr-prata{--sc:rgba(205,210,215,.5);--sd:1.1s;--gc:rgba(140,146,152,.45)}
.fr-fibra{--sc:rgba(255,255,255,.8);--sd:1.3s;--gc:rgba(190,200,210,.65)}.fr-ouro{--sc:rgba(255,252,210,1);--sd:1s;--gc:rgba(255,205,60,.95)}.fr-platina{--sc:rgba(255,255,255,1);--sd:1.05s;--gc:rgba(190,225,255,.95)}.fr-diamante{--sc:rgba(190,230,255,.9);--sd:.75s}
.fr-led-rgb::after,.fr-led-chase::after,.fr-chamas::after{display:none}
/* ciclista no mapa do treino: camada HTML fixa (não é recriada a cada segundo, então a moldura e o aro do mascote não reiniciam) */
.rdr{position:absolute;left:0;top:0;width:0;height:0;z-index:2;pointer-events:none;will-change:transform}
.rdr-in{position:absolute;left:0;top:0;width:40px;height:40px;transform:translate(-50%,-50%)}
.rdr-av{position:absolute;inset:0;border-radius:50%;background:#080f17;box-shadow:0 0 0 2px #fff,0 0 0 9px rgba(255,255,255,.25)}
.map-in{inset:26px 38px 38px 26px}
.rdr-in{transform:translate(-50%,-50%) scale(.8)}
@media(min-width:1024px){.map-in{inset:0}.rdr-in{transform:translate(-50%,-50%)}}
.rdr-gh .rdr-in{width:34px;height:34px}.rdr-gh .rdr-av{box-shadow:0 0 0 2px #9fd9ff,0 0 0 7px rgba(159,217,255,.16)}
.rdr-pet{position:absolute;right:-24px;bottom:-22px;z-index:3;border-radius:50%;box-shadow:0 0 0 2px #06101a}
.rdr-pet .mas{box-shadow:none}
.mat{display:flex;align-items:center;gap:5px;font:600 12px/1.15 Archivo,sans-serif;color:#e8f6ff;white-space:nowrap}
.mat.off{opacity:.38}.mat.off .val{color:#9ca3af}.mat-lg{margin-top:4px;font:500 9px/1 Archivo,sans-serif;color:#9ca3af}
.mat .val{margin-left:auto;padding-left:8px;font-weight:800;color:#6ee7b7}
.mat-box{background:rgba(6,16,26,.88);border:1px solid rgba(52,211,153,.65);border-radius:10px;padding:5px 8px 6px;box-shadow:0 0 12px rgba(52,211,153,.28);max-width:min(54%,210px)}
.fit4{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-right:4px;scrollbar-width:thin;scrollbar-color:#2f6396 transparent}
.fit4::-webkit-scrollbar{width:5px}.fit4::-webkit-scrollbar-thumb{background:#2f6396;border-radius:4px}
.mat-box.mat-flow{position:static;max-width:none;width:100%;margin-top:2px;flex-shrink:0}
.mat-flow .mat{white-space:normal;min-width:0;font-size:11px}.mat-flow .mat span:nth-of-type(1){min-width:0}
.mat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 12px}
@media(min-width:640px){.mat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mat-h{font:700 10px/1 Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6ee7b7;margin-bottom:4px;display:flex;align-items:center;gap:4px}

/* mascote (subperfil): avatar redondo com aro da cor da raridade; o emoji ocupa quase todo o círculo, sem cortar o animal */
.mas{position:relative;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1d3d5e,#06101a);line-height:1;flex-shrink:0;user-select:none}
.mas .mem{display:block;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mas-vazio{border:2px dashed #2d4e73;color:#4a6d92;background:transparent}
.mas .mem-img{display:block;pointer-events:none;-webkit-user-drag:none;object-fit:contain}
/* aro do mascote: faixa de brilho que gira ao redor da borda (cor da raridade; mais raro = mais rápido) */
.mas:not(.mas-vazio)::after{content:"";position:absolute;inset:-2px;border-radius:50%;padding:2px;pointer-events:none;z-index:1;background:conic-gradient(transparent 0 48%,var(--rc,#6ac3ff) 74%,#fff 90%,transparent 97% 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:frspin var(--sd,3.6s) linear infinite}
.mas-comum{--sd:2.2s}.mas-incomum{--sd:1.9s}.mas-raro{--sd:1.6s}.mas-epico{--sd:1.3s}.mas-lendario{--sd:1.05s}.mas-mitico{--sd:.8s}
.mas-comum,.mas-incomum,.mas-raro,.mas-epico{animation:maspulse 2.4s ease-in-out infinite alternate}
@keyframes maspulse{from{box-shadow:0 0 5px color-mix(in srgb,var(--rc) 50%,transparent)}to{box-shadow:0 0 8px color-mix(in srgb,var(--rc) 70%,transparent),0 0 13px color-mix(in srgb,var(--rc) 35%,transparent)}}
.pet-card{cursor:pointer;position:relative;transition:transform .15s,border-color .15s}.pet-card:hover{transform:translateY(-2px)}.pet-card:focus-visible{outline:2px solid #6ac3ff}
@keyframes petpop{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}.pet-pop{animation:petpop .22s ease-out}
.mas-lv{z-index:2;position:absolute;left:-3px;bottom:-3px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:#0b1a2a;border:1.5px solid;font:700 11px/16px Archivo,sans-serif;text-align:center;color:#fff}
.mas-lendario{animation:masglow 2.2s ease-in-out infinite alternate}
.mas-mitico{animation:masmit 2s ease-in-out infinite alternate}
@keyframes masglow{from{box-shadow:0 0 5px rgba(255,176,32,.55)}to{box-shadow:0 0 9px rgba(255,176,32,.75),0 0 15px rgba(255,176,32,.35)}}
@keyframes masmit{from{box-shadow:0 0 5px rgba(255,77,141,.55)}to{box-shadow:0 0 10px rgba(255,77,141,.75),0 0 16px rgba(255,77,141,.35)}}

/* medalhas (conquistas) */
.medal{border-radius:50%;display:grid;place-items:center;color:#0b1a2a;flex-shrink:0;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.8),rgba(255,255,255,0) 42%),linear-gradient(145deg,var(--m1),var(--m2));box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 0 10px var(--m2)}
.medal-off{filter:grayscale(1) brightness(.42);box-shadow:none;opacity:.75}
@keyframes cdpop{0%{opacity:0;transform:scale(1.7)}30%{opacity:1}100%{opacity:1;transform:scale(1)}}
/* o deslize entre abas move o <main> para fora da tela; sem este corte o iOS enxerga a página mais larga que a tela e dá "zoom out" (tudo pequeno, menu descentralizado) */
#app{overflow-x:clip}
/* botão Maratona (tela Pedalar): direita, abaixo do box do tempo */
.selic select{padding-left:2rem;padding-right:1.6rem;-webkit-appearance:none;appearance:none}.selic option{color:#e6f1fb;background:#080f17}
@media(max-width:639px){.selic{flex:0 0 auto!important;width:3.4rem}.selic select{color:transparent;padding-left:0;padding-right:0}.rt-title{flex-basis:30%!important}}   /* celular: só ícone + seta (o texto não cabia) */
.js-play-lg svg{display:none}   /* botão Iniciar do celular: só o texto */
.text-emerald-400{color:#34d399}.hm-msg{min-height:0}@media(min-width:1024px){.hm-msg{min-height:10.5rem!important}}
.rt-cov{height:6rem}@media(min-width:640px){.rt-cov{height:9rem}}
.border-red-500\/60{border-color:rgba(239,68,68,.6)}.hover\:bg-red-500\/10:hover{background-color:rgba(239,68,68,.1)}.hover\:text-red-300:hover{color:#fca5a5}.hover\:text-red-400:hover{color:#f87171}
.gy-clip{position:relative;overflow:hidden;transition:max-height .45s ease}
.gy-cut{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 90px),transparent)}
@keyframes gypulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}50%{box-shadow:0 0 0 5px rgba(255,255,255,0)}}
.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.mr-btn{grid-column:3/7;min-height:6.25rem}@media(min-width:1024px){.mr-btn{grid-column:1/-1;min-height:8rem}}
/* ===== Otimização mobile (celular, < 640px) =====
   - campos com 16 px: o iOS dá zoom automático ao focar campos menores que isso (e a tela fica "ampliada" depois)
   - alvos de toque ≥ 44 px nas abas e nos campos (padrão Apple/Google)
   - barra de abas sem barra de rolagem visível; rótulos de 10 px sobem para 11 px (legibilidade)
   - sem menu de "segurar" nem seleção de texto acidental em botões */
@media(max-width:639px){
 input,select,textarea{font-size:16px!important}
 input:not([type=checkbox]):not([type=radio]):not([type=range]),select{min-height:44px}
 .tabbtn{min-height:44px}
 header nav{scrollbar-width:none;-ms-overflow-style:none}header nav::-webkit-scrollbar{display:none}
 .text-\[10px\]{font-size:11px}
 button,[role=button]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
}
/* Academia: o 1º e o último quadro de cada exercício (workout-guide, SVG de traço branco transparente; o quadro do meio só entra nos exercícios em que o traço dele é normal, ver GY_F3) viram um vai-e-vem com fade cruzado longo (só opacidade, barato para a GPU).
   Cada <img> recebe um transform inline (GY_FIT) que centraliza o desenho do quadro e usa a mesma escala nos quadros: sem "pulo" na troca.
   A animação só começa quando os 2 quadros já carregaram (.rdy); antes disso aparece só o 1º quadro, parado. Animação: apenas na Biblioteca, no detalhe do exercício e na execução guiada (.an);
   nas demais listas o exercício aparece como imagem parada (.st). Velocidade: --gy-d (duração do ciclo). */
.gyan{--gy-d:2.2s;position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:1rem;background:radial-gradient(ellipse at 50% 40%,#0f2d4d 0%,#0a1f36 70%)}
.gyan.sq{aspect-ratio:1/1}
.gyan img{position:absolute;inset:0;margin:auto;height:100%;width:auto;max-width:none;aspect-ratio:1/1;object-fit:contain;opacity:0;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.gyan.st img[data-ok],.gyan.an:not(.rdy) img.f1[data-ok]{opacity:1;transition:opacity .25s ease-out}
.gyan.an.rdy img{will-change:opacity;animation-duration:var(--gy-d);animation-timing-function:ease-in-out;animation-iteration-count:infinite}

/* Fila de gravações (outbox): persiste no localStorage e reenvia quando a conexão voltar */
let outbox=load('cad_outbox',[]),flushing=false;
const pkOf=o=>o.row?(o.row.id!=null?o.row.id:o.row.profile_id):null;
function q(op){if(!sb||isAdminOp(op))return;
  if(op.t==='up')outbox=outbox.filter(x=>!(x.t==='up'&&x.tb===op.tb&&pkOf(x)===pkOf(op)));
  outbox.push(op);store('cad_outbox',outbox);flush()}
async function flush(){if(!sb||flushing||!outbox.length)return;flushing=true;
  try{while(outbox.length){const o=outbox[0];
      let r=o.t==='up'?await sb.from(o.tb).upsert(o.row):await sb.from(o.tb).delete().eq(o.col,o.val);
      /* banco ainda sem colunas novas (sex, game; pts/coins/xp/trace/mode/ev_*): regrava sem elas, uma por vez, conforme o erro aponta */
      if(r.error&&o.t==='up'&&(o.tb==='profiles'||o.tb==='workouts')){const row={...o.row},cols=o.tb==='profiles'?['sex','game','profile_frame_id','profile_mascot_id','owned_items','profile_frame_color','mascot_data','achievements','pw_hash','pw_salt','bike_name','weigh_int','reminders']:['coins','xp','trace','mode','pts','ev_ok','ev_tot','pet_id','pet_xp','kcal','avg_cad'];
        for(let i=0;i<12&&r.error;i++){const m=r.error.message||'';const c=cols.find(k=>k in row&&new RegExp('\\b'+k+'\\b','i').test(m));if(!c)break;delete row[c];r=await sb.from(o.tb).upsert(row)}}
      if(r.error){if(r.error.code){console.error(r.error);toast('O Supabase recusou uma gravação: '+r.error.message);outbox.shift();store('cad_outbox',outbox);continue}throw r.error}
      outbox.shift();store('cad_outbox',outbox)}
    setSync('ok')}
  catch(e){console.error(e);setSync('err')}
  flushing=false}
window.addEventListener('online',flush);
setInterval(flush,30000);

/* Lê todas as linhas de uma tabela (páginas de 1000) */
async function fetchAll(tb,col,asc=true){let out=[],from=0;
  for(;;){const r=await sb.from(tb).select('*').order(col,{ascending:asc}).range(from,from+999);
    if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)return out;from+=1000}}

/* Baixa tudo do Supabase para o estado local. Se o banco estiver vazio, envia os dados locais (migração). */
async function pull(){
  let L=null;try{L=await fetchAll('weight_log','date')}catch(e){console.warn('weight_log indisponível',e)}
  const [P,R,W,A]=await Promise.all([fetchAll('profiles','created_at'),fetchAll('routes','created_at',false),fetchAll('workouts','date',false),fetchAll('active_workouts','profile_id')]);
  if(!P.length&&!R.length){
    S.profiles.forEach(p=>{q({t:'up',tb:'profiles',row:pRow(p)});wlog(p).forEach(e=>q({t:'up',tb:'weight_log',row:wlRow(p.id,e)}));(p.history||[]).forEach(h=>q({t:'up',tb:'workouts',row:wRow(p.id,h)}))});
    S.routes.forEach(r=>q({t:'up',tb:'routes',row:rRow(r)}));
    return null}
  const old={};S.profiles.forEach(p=>old[p.id]=p);
  const by={};P.forEach(x=>by[x.id]=fromP(x,old[x.id]));
  W.forEach(x=>{if(by[x.profile_id])by[x.profile_id].history.push(fromW(x))});
  if(L){P.forEach(x=>by[x.id].wlog=[]);L.forEach(x=>{if(by[x.profile_id])by[x.profile_id].wlog.push(fromWl(x))});
    /* pesagens que só existem neste aparelho (ex.: tabela criada depois) sobem para o banco */
    P.forEach(x=>{const b=by[x.id],ids=new Set(b.wlog.map(e=>e.id));((old[x.id]&&old[x.id].wlog)||[]).forEach(e=>{if(!ids.has(e.id)){b.wlog.push(e);q({t:'up',tb:'weight_log',row:wlRow(x.id,e)})}})})}
  P.forEach(x=>{if(x.game==null&&by[x.id].game)q({t:'up',tb:'profiles',row:pRow(by[x.id])})});   /* moedas/XP que só existem neste aparelho */
  P.forEach(x=>{if(Array.isArray(x.owned_items)&&by[x.id].owned.length>x.owned_items.length)q({t:'up',tb:'profiles',row:pRow(by[x.id])})});   /* cosméticos comprados só neste aparelho */
  P.forEach(x=>{const b=by[x.id];if(('mascot_data' in x&&JSON.stringify(b.pets)!==JSON.stringify(x.mascot_data||{}))||('achievements' in x&&JSON.stringify(b.ach)!==JSON.stringify(x.achievements||{}))||('profile_frame_color' in x&&(b.frameColor||'')!==(x.profile_frame_color||'')))q({t:'up',tb:'profiles',row:pRow(b)})});   /* XP de mascote, conquistas ou cor do neon só neste aparelho */
  P.forEach(x=>{if('pw_hash' in x&&!x.pw_hash&&by[x.id].pwh)q({t:'up',tb:'profiles',row:pRow(by[x.id])})});   /* senha criada só neste aparelho */
  S.profiles=P.map(x=>by[x.id]);S.routes=R.map(fromR);
  saveProfiles();saveRoutes();
  const a=A.find(x=>x.profile_id===S.cur);return a?a.data:null}
/* Perfis precisam existir no banco antes dos treinos (chave estrangeira): a fila mantém a ordem de inserção. */

/* ---------- IMC, peso e silhueta ---------- */
function wlog(p){if(!p.wlog)p.wlog=[];
  if(!p.wlog.length){const e={id:'w0_'+p.id,date:Date.now(),weight:p.weight};p.wlog.push(e);saveProfiles();q({t:'up',tb:'weight_log',row:wlRow(p.id,e)})}
  p.wlog.sort((a,b)=>a.date-b.date);return p.wlog}
/* Intervalo de pesagem por perfil (p.wint): semanal = +7 dias · quinzenal = +15 dias · mensal = +1 mês · trimestral = +3 meses,
   sempre contados a partir da pesagem anterior (mês/trimestre pelo calendário; dia 31 vira o último dia do mês menor). */
const WINT={w:{n:'Semanal',d:7,txt:'semanalmente'},q:{n:'Quinzenal',d:15,txt:'a cada 15 dias'},m:{n:'Mensal',mo:1,txt:'uma vez por mês'},t:{n:'Trimestral',mo:3,txt:'a cada 3 meses'}};
const wInt=p=>WINT[p.wint]?p.wint:'w';
function wNext(p){const l=wlog(p),last=l[l.length-1].date,c=WINT[wInt(p)];
  if(c.d)return last+c.d*864e5;
  const d=new Date(last),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+c.mo);
  d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.getTime()}
const wDue=p=>Date.now()>=wNext(p);
function setWInt(v){const p=profile();if(!p||!WINT[v])return;p.wint=v;saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)});render();toast('Pesagem '+WINT[v].n.toLowerCase())}
const wIntPick=p=>`<div class="text-xs text-zinc-400 mt-1">Intervalo de pesagem<div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 mt-1">${Object.keys(WINT).map(k=>`<button type="button" onclick="setWInt('${k}')" aria-pressed="${wInt(p)===k}" class="py-1.5 rounded-lg border text-sm ${wInt(p)===k?'border-neon text-neon bg-neon/10':'border-line text-zinc-300 hover:border-neon'}">${WINT[k].n}</button>`).join('')}</div></div>`;
const hhmm=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const bmiOf=p=>p.weight/Math.pow(p.height/100,2);
const bmiInfo=b=>b<18.5?{n:'Abaixo do peso',c:'#6ac3ff'}:b<25?{n:'Peso ideal',c:'#34d399'}:b<30?{n:'Acima do peso',c:'#facc15'}:{n:'Muito acima do peso',c:'#ef4444'};
function smooth(P){const n=P.length,f=v=>v.toFixed(1);let d=`M${f(P[0][0])},${f(P[0][1])}`;
  for(let i=0;i<n;i++){const a=P[(i-1+n)%n],b=P[i],c=P[(i+1)%n],e=P[(i+2)%n];
    d+=`C${f(b[0]+(c[0]-a[0])/6)},${f(b[1]+(c[1]-a[1])/6)} ${f(c[0]-(e[0]-b[0])/6)},${f(c[1]-(e[1]-b[1])/6)} ${f(c[0])},${f(c[1])}`}return d+'Z'}
/* Silhueta: masculina (ombros largos) ou feminina (cintura marcada, cabelo); largura cresce com o IMC e a cor indica a faixa */
function body(sex,bmi,c){const w=Math.min(1,Math.max(0,(bmi-16)/24)),s=.8+.6*w,f=sex==='f',
    sh=(f?17:23)*s,ch=(f?15:21)*s,wa=(f?11:17)*s+(f?7:9)*w,hp=(f?20:18)*s,R=[[sh,66],[ch,92],[wa,120],[hp,150],[hp*.6,166]],
    pts=[[60,56],...R.map(p=>[60+p[0],p[1]]),[60,170],...R.slice().reverse().map(p=>[60-p[0],p[1]])],
    arm=x=>`<line x1="${60+x*(sh-3)}" y1="70" x2="${60+x*(sh+8+5*w)}" y2="140" />`,leg=x=>`<line x1="${60+x*hp*.5}" y1="152" x2="${60+x*(hp*.5+3)}" y2="238" />`;
  return `<svg viewBox="0 0 120 250" class="bodyin h-56 sm:h-64 mx-auto" role="img" aria-label="Silhueta ${f?'feminina':'masculina'}, IMC ${bmi.toFixed(1)}" style="filter:drop-shadow(0 0 10px ${c}66)">
   <g fill="${c}" stroke="${c}" stroke-linecap="round" style="transition:fill .4s,stroke .4s">
   ${f?'<g opacity=".55"><ellipse cx="60" cy="30" rx="18" ry="17" stroke="none"/><line x1="44" y1="32" x2="43" y2="64" stroke-width="8"/><line x1="76" y1="32" x2="77" y2="64" stroke-width="8"/></g>':''}
   <circle cx="60" cy="34" r="14" stroke="none"/>
   <g stroke-width="${(9+5*w).toFixed(1)}">${arm(-1)}${arm(1)}</g>
   <g stroke-width="${((f?12:13)+9*w).toFixed(1)}">${leg(-1)}${leg(1)}</g>
   <path d="${smooth(pts)}" stroke-width="2"/></g></svg>`}
function bmiBar(b){const pos=Math.min(100,Math.max(0,(b-15)/25*100));
  return `<div class="relative pt-3"><div class="flex h-2.5 rounded-full overflow-hidden"><i style="width:14%;background:#6ac3ff"></i><i style="width:26%;background:#34d399"></i><i style="width:20%;background:#facc15"></i><i style="width:40%;background:#ef4444"></i></div><div class="absolute top-0 w-0.5 h-6 bg-white rounded" style="left:${pos}%"></div></div>`}
function wChart(p){const l=wlog(p);if(l.length<2)return '<p class="text-sm text-zinc-400 mb-2">O gráfico aparece a partir da segunda pesagem.</p>';
  const W=600,H=170,pl=38,pr=10,pt=10,pb=22,ws=l.map(e=>e.weight),hm=p.height/100,lo=18.5*hm*hm,hi=24.9*hm*hm;
  let mn=Math.min(...ws),mx=Math.max(...ws);const pad=Math.max(1,(mx-mn)*.15);mn-=pad;mx+=pad;
  const t0=l[0].date,t1=l[l.length-1].date,X=d=>pl+(t1===t0?.5:(d-t0)/(t1-t0))*(W-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb),
    b1=Math.max(mn,lo),b2=Math.min(mx,hi),dt=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full mb-2" role="img" aria-label="Evolução do peso">
   ${b2>b1?`<rect x="${pl}" y="${Y(b2)}" width="${W-pl-pr}" height="${Y(b1)-Y(b2)}" fill="#34d399" fill-opacity=".13"/>`:''}
   <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="#17314a"/>
   <polyline points="${l.map(e=>X(e.date).toFixed(1)+','+Y(e.weight).toFixed(1)).join(' ')}" fill="none" stroke="#6ac3ff" stroke-width="2.5" stroke-linejoin="round"/>
   ${l.map(e=>`<circle cx="${X(e.date).toFixed(1)}" cy="${Y(e.weight).toFixed(1)}" r="4.5" fill="${bmiInfo(e.weight/(hm*hm)).c}" stroke="#000" stroke-width="1.5"/>`).join('')}
   <g fill="#7a9dc0" font-size="11"><text x="${pl-6}" y="${Y(mx)+8}" text-anchor="end">${mx.toFixed(0)}</text><text x="${pl-6}" y="${Y(mn)}" text-anchor="end">${mn.toFixed(0)}</text>
   <text x="${pl}" y="${H-5}">${dt(t0)}</text><text x="${W-pr}" y="${H-5}" text-anchor="end">${dt(t1)}</text></g></svg>
   <div class="text-[11px] text-zinc-500 mb-2">Faixa verde = peso ideal para ${p.height} cm (${lo.toFixed(1)}–${hi.toFixed(1)} kg)</div>`}
function bmiCard(p){const bmi=bmiOf(p),I=bmiInfo(bmi),hm=p.height/100,l=wlog(p),last=l[l.length-1],d=Math.floor((Date.now()-last.date)/864e5),due=wDue(p),nx=wNext(p),left=Math.max(1,Math.ceil((nx-Date.now())/864e5)),
    sx=p.sex?'':`<div class="text-xs text-zinc-400">Defina o sexo para ajustar a silhueta:<div class="flex gap-2 mt-1"><button onclick="setSex('m')" class="flex-1 py-1.5 rounded-lg border border-line hover:border-neon">Homem</button><button onclick="setSex('f')" class="flex-1 py-1.5 rounded-lg border border-line hover:border-neon">Mulher</button></div></div>`;
  return `<section class="rounded-2xl bg-panel border border-line p-4"><h3 class="font-display text-2xl font-bold mb-2">IMC e peso</h3>
   <div class="grid sm:grid-cols-[210px_1fr] gap-4 items-center"><div>${body(p.sex,bmi,I.c)}</div>
   <div class="space-y-3 min-w-0"><div><div class="text-xs text-zinc-400">Seu IMC</div><div class="flex items-baseline gap-3 flex-wrap"><span class="font-display text-6xl font-bold leading-none" style="color:${I.c}">${bmi.toFixed(1)}</span><span class="font-semibold" style="color:${I.c}">${I.n}</span></div></div>
    ${bmiBar(bmi)}
    <div class="text-sm text-zinc-400">${p.weight} kg · ${p.height} cm · peso ideal: ${(18.5*hm*hm).toFixed(1)}–${(24.9*hm*hm).toFixed(1)} kg</div>
    <div class="flex items-center gap-2 flex-wrap text-xs text-zinc-400"><span class="inline-flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full" style="background:#6ac3ff"></i>Abaixo</span><span class="inline-flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full" style="background:#34d399"></i>Ideal</span><span class="inline-flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full" style="background:#facc15"></i>Acima</span><span class="inline-flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-full" style="background:#ef4444"></i>Muito acima</span></div>
    ${due?`<form onsubmit="saveWeight(event)" class="flex gap-2 w-full sm:max-w-sm"><input name="pw" type="number" inputmode="decimal" min="20" max="250" step="0.1" placeholder="Novo peso (kg)" oninput="wtChk(this)" autocomplete="off" class="${IN} flex-1 min-w-0"><button disabled class="shrink-0 px-4 py-2 rounded-lg bg-ember text-ink font-semibold flex items-center gap-2 disabled:opacity-40"><i data-lucide="scale" class="w-4 h-4"></i>Atualizar</button></form>`:`<button onclick="weightModal()" class="w-full sm:w-auto px-4 py-2.5 rounded-lg bg-brand text-white font-semibold flex items-center justify-center gap-2"><i data-lucide="scale" class="w-4 h-4"></i>Registrar peso</button>`}
    <div class="text-xs ${due?'text-ember':'text-zinc-500'}">${due?'Já faz '+d+' dia'+(d===1?'':'s')+' desde a última pesagem. Pesagem '+WINT[wInt(p)].n.toLowerCase()+' ('+WINT[wInt(p)].txt+').':'Última pesagem há '+(d?d+' dia'+(d===1?'':'s'):'menos de 1 dia')+'. Próxima pesagem em '+new Date(nx).toLocaleDateString('pt-BR')+' ('+left+' dia'+(left>1?'s':'')+').'}</div>${wIntPick(p)}${sx}</div></div>
   <div class="mt-4 border-t border-line pt-3"><h4 class="font-display text-xl font-bold mb-2">Progresso de peso</h4>${wChart(p)}
   <ul class="max-h-60 overflow-y-auto">${l.slice().reverse().map((e,i,a)=>{const pv=a[i+1],df=pv?e.weight-pv.weight:0,b=bmiInfo(e.weight/(hm*hm));
    return `<li class="flex items-center gap-3 py-1.5 border-b border-line last:border-0 text-sm"><i class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${b.c}"></i><span class="tabular-nums font-semibold">${e.weight.toFixed(1)} kg</span><span class="text-xs ${df>0?'text-ember':df<0?'text-emerald-300':'text-zinc-500'}">${pv?(df>0?'+':'')+df.toFixed(1)+' kg':'início'}</span><span class="ml-auto text-xs text-zinc-400">${new Date(e.date).toLocaleDateString('pt-BR')} · IMC ${(e.weight/(hm*hm)).toFixed(1)}</span>${a.length>1?`<button onclick="delWeight('${e.id}')" aria-label="Excluir pesagem" class="shrink-0 p-1.5 -mr-1.5 rounded-lg text-zinc-500 hover:text-ember"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}</li>`}).join('')}</ul></div></section>`}
function wtChk(el){const v=+el.value,ok=el.value!==''&&v>=20&&v<=250,b=el.form&&el.form.querySelector('button:not([type=button])');if(b)b.disabled=!ok}
function weightModal(auto){const p=profile();if(!p)return;
  if(auto){openModal(`<div class="text-center"><div class="mx-auto w-14 h-14 rounded-full grid place-items-center bg-ember/15 border border-ember/60 text-ember mb-2"><i data-lucide="scale" class="w-7 h-7"></i></div>
    <h2 class="font-display text-3xl font-bold mb-1">Atualize seu peso</h2><p class="text-sm text-zinc-400 mb-4">Chegou o dia da sua pesagem (${WINT[wInt(p)].n.toLowerCase()}). Informe seu peso atual para acompanhar seu IMC.</p></div>
    <form onsubmit="saveWeight(event)" class="space-y-3"><label class="block text-sm">Peso atual (kg)<input name="pw" type="number" inputmode="decimal" min="20" max="250" step="0.1" placeholder="Ex.: 72.5" oninput="wtChk(this)" autocomplete="off" class="${IN} mt-1"></label>
    <div class="flex flex-col gap-2 pt-1"><button disabled class="w-full py-2.5 rounded-lg bg-brand text-white font-semibold disabled:opacity-40">Confirmar</button><button type="button" onclick="closeModal()" class="w-full py-2.5 rounded-lg border border-line text-zinc-300">Atualizar mais tarde</button></div></form>`);return}
  openModal(`<h2 class="font-display text-3xl font-bold mb-1">${auto?'Hora de pesar!':'Registrar peso'}</h2><p class="text-sm text-zinc-400 mb-4">${auto?'Chegou o dia da sua pesagem ('+WINT[wInt(p)].n.toLowerCase()+'). Atualize para acompanhar seu IMC.':'O IMC e a silhueta são atualizados na hora.'}</p>
   <form onsubmit="saveWeight(event)" class="space-y-3"><label class="block text-sm">Peso atual (kg)<input name="pw" type="number" min="20" max="250" step="0.1" value="${p.weight}" required class="${IN} mt-1"></label>
   <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line">${auto?'Depois':'Cancelar'}</button><button class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">Salvar</button></div></form>`)}
function delWeight(id){const p=profile();if(!p)return;const l=wlog(p);
  if(l.length<2){toast('Mantenha ao menos uma pesagem');return}
  if(!confirm('Excluir esta pesagem?'))return;
  p.wlog=l.filter(e=>e.id!==id);p.weight=p.wlog[p.wlog.length-1].weight;saveProfiles();
  q({t:'del',tb:'weight_log',col:'id',val:id});q({t:'up',tb:'profiles',row:pRow(p)});render();toast('Pesagem excluída')}
function saveWeight(e){e.preventDefault();const p=profile(),w=Math.round(+e.target.elements.pw.value*10)/10;if(!(w>=20&&w<=250))return;
  const en={id:uid(),date:Date.now(),weight:w};wlog(p).push(en);p.weight=w;saveProfiles();
  q({t:'up',tb:'profiles',row:pRow(p)});q({t:'up',tb:'weight_log',row:wlRow(p.id,en)});closeModal();render();toast('Peso salvo · '+bmiInfo(bmiOf(p)).n);achRun(p)}
function weightPrompt(n=0){const p=profile();if(!p||S.wP===p.id||!wDue(p))return;
  if(S.wo.running||S.wo.dist>0||$('#modal').innerHTML){if(n<120)setTimeout(()=>weightPrompt(n+1),800);return}   /* espera outros pop-ups (senha, apelido) fecharem */
  S.wP=p.id;weightModal(true)}
function setSex(v){const p=profile();p.sex=v;saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)});render()}
const sexField=v=>`<div class="text-sm">Sexo<div class="grid grid-cols-2 gap-2 mt-1">${[['m','Homem'],['f','Mulher']].map(([k,l])=>`<label class="cursor-pointer"><input type="radio" name="sx" value="${k}" ${v===k?'checked':''} required class="peer sr-only"><span class="block text-center py-2 rounded-lg border border-line peer-checked:border-neon peer-checked:text-neon peer-checked:bg-neon/10 peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-neon">${l}</span></label>`).join('')}</div></div>`;
function editProfileModal(){const p=profile();openModal(`<h2 class="font-display text-3xl font-bold mb-4">Editar perfil</h2>
  <form onsubmit="saveEdit(event)" class="space-y-3"><label class="block text-sm">Nome<input name="pn" required maxlength="30" value="${esc(p.name)}" class="${IN} mt-1"></label>
  ${sexField(p.sex)}<label class="block text-sm">Altura (cm)<input name="ph" type="number" min="100" max="250" value="${p.height}" required class="${IN} mt-1"></label>

/* ---------- Ranking simulado ---------- */
function userBest(r,p=profile(),m=S.inten){const t=((p&&p.history)||[]).filter(h=>h.routeId===r.id&&h.done&&(h.mode||'normal')==='normal'&&(m==='all'||(h.inten||'off')===m)).map(h=>h.time);return t.length?Math.min(...t):null}

/* moldura equipada (se houver) envolve o avatar sem mudar o tamanho total */
function frameWrap(id,size,inner,color){const w=Math.max(3,Math.round(size*.09)),i=size-2*w;

  return f?frameWrap(f.id,size,i=>avatarRaw(p,i),f.color?frameColor(p):''):avatarRaw(p,size)}
function cover(r,cls='h-36'){const hue=198+hash(r.id)%46;
  const bg=r.photo?`background-image:url('${cssUrl(r.photo)}')`:`background-image:linear-gradient(135deg,hsl(${hue} 85% 34%),hsl(${hue+14} 80% 13%))`;

function elevStats(e){let g=0;for(let i=1;i<e.length;i++)if(e[i]>e[i-1])g+=e[i]-e[i-1];return{gain:Math.round(g),max:Math.round(Math.max(...e)),min:Math.round(Math.min(...e))}}
function elevSvg(r,p=null){const e=r.elev,mn=Math.min(...e),mx=Math.max(...e),rg=Math.max(mx-mn,1),W=600,H=110;
  const pts=e.map((v,i)=>[i/(e.length-1)*W,H-8-(v-mn)/rg*(H-24)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  let m='';if(p!=null){const x=p*W,i=Math.min(e.length-1,Math.round(p*(e.length-1))),y=pts[i][1];
    m=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="#ffa13d" stroke-width="2" stroke-dasharray="4 3"/><circle cx="${x}" cy="${y}" r="6" fill="#ffa13d" stroke="#000000" stroke-width="2"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-24" preserveAspectRatio="none"><path d="${line} L${W} ${H} L0 ${H}Z" fill="#6ac3ff" fill-opacity=".14"/><path d="${line}" fill="none" stroke="#6ac3ff" stroke-width="2.5" stroke-linejoin="round"/>${m}</svg>`;}
/* ---------- Traçado do circuito ---------- */
function normTrack(pts){let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  pts.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])});
  const s=1000/Math.max(x1-x0,y1-y0,1e-9);
  return pts.map(q=>[Math.round((q[0]-x0)*s),Math.round((q[1]-y0)*s)])}
function genTrack(seed){const h=hash(seed),n=240,k=2+h%2,m=3+(h>>3)%3,a=.18+(h%7)/50,b=.08+((h>>5)%5)/60,ph=(h%360)*Math.PI/180,ps=((h>>7)%360)*Math.PI/180;
  return normTrack(Array.from({length:n},(_,i)=>{const t=i/(n-1)*2*Math.PI,rr=1+a*Math.sin(k*t+ph)+b*Math.sin(m*t+ps);return[rr*Math.cos(t),rr*Math.sin(t)*.72]}))}
const trackCache={};
function getTrack(r){return r.track&&r.track.length>1?r.track:(trackCache[r.id]||(trackCache[r.id]=genTrack(r.id)))}
function trackPos(T,p){const n=T.length,f=Math.min(1,Math.max(0,p))*(n-1),i=Math.min(n-2,Math.floor(f)),t=f-i,a=T[i],b=T[i+1];
  return{i,pos:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}}
function trackSvg(r,p=null,mini=false,ext=false){const T=getTrack(r);let w=0,h=0;T.forEach(q=>{w=Math.max(w,q[0]);h=Math.max(h,q[1])});
  const pad=mini?50:46,sw=mini?11:16,d=a=>a.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(' '),full=d(T);
  const loop=Math.hypot(T[0][0]-T[T.length-1][0],T[0][1]-T[T.length-1][1])<45;
  let done='',rider='';
  if(p!=null){const {i,pos}=trackPos(T,p);
    if(p>0)done=`<path d="${d([...T.slice(0,i+1),pos])}" fill="none" stroke="#ffffff" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
    const pp=profile(),x=pos[0],y=pos[1],ph=pp&&pp.photo;
    rider=`<circle cx="${x}" cy="${y}" r="44" fill="#ffffff" fill-opacity=".25"/>`+(ph
      ?`<defs><clipPath id="rc"><circle cx="${x}" cy="${y}" r="32"/></clipPath></defs><circle cx="${x}" cy="${y}" r="32" fill="#080f17"/><image href="${esc(ph)}" x="${x-32}" y="${y-32}" width="64" height="64" preserveAspectRatio="xMidYMid slice" clip-path="url(#rc)"/><circle cx="${x}" cy="${y}" r="32" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="${x}" cy="${y}" r="36" fill="none" stroke="#fff" stroke-width="2"/>`
      :`<circle cx="${x}" cy="${y}" r="32" fill="#ffa13d" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y}" dy=".35em" text-anchor="middle" font-size="34" font-weight="700" fill="#000000">${esc(((pp&&pp.name)||'🚴')[0].toUpperCase())}</text>`)}
  const road=mini?`<path d="${full}" fill="none" stroke="#6ac3ff" stroke-opacity=".75" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`
   :`<path d="${full}" fill="none" stroke="#000000" stroke-width="${sw+10}" stroke-linecap="round" stroke-linejoin="round"/><path d="${full}" fill="none" stroke="#2f6396" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const s=T[0],e=T[T.length-1],mk=(q,c)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${sw*.95}" fill="${c}" stroke="#000000" stroke-width="4"/>`;
  const marks=mini?'':mk(s,'#fff')+(loop?'':mk(e,'#ffa13d'));
  /* onda de energia: segue o sentido do percurso (ordem dos pontos). O SVG é redesenhado a cada tick,
     então a fase da animação vem do relógio (delay negativo) para a onda não reiniciar a cada redesenho. */
  /* só o trecho À FRENTE do ciclista (da posição atual até a chegada); a fase vem de um laço requestAnimationFrame
     (waveLoop) que mexe no stroke-dashoffset dos .ewp, então redesenhar o SVG a cada tick não reinicia a onda */
  let wave='';
  if(!mini&&p!=null&&p<1&&!(S.wo.running||S.wo.dist>0||S.wo.arming)){const {i:wi,pos:wp}=trackPos(T,p),rem=[wp,...T.slice(wi+1)];let len=0;for(let k=1;k<rem.length;k++)len+=Math.hypot(rem[k][0]-rem[k-1][0],rem[k][1]-rem[k-1][1]);

    const ghost='';   /* o avatar do fantasma é a camada HTML #m-ghost (com a moldura), movida pelo waveLoop */
    const rd=d(rem),L=len.toFixed(1),ex=`d="${rd}" pathLength="${L}" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dashoffset="999" data-len="${L}"`,gap=(len+500).toFixed(0);
    /* cauda de camadas translúcidas (vidro) que somem para trás + avatar fantasma na frente.
       A cauda anda por stroke-dashoffset e o fantasma por getPointAtLength, ambos no waveLoop. Uma única onda, sem repetição no trecho. */
    const tl=(g,w,c,o)=>`<path class="ewp" data-g="${g}" ${ex} stroke="${c}" stroke-opacity="${o}" stroke-width="${w}" stroke-dasharray="${g} ${gap}"/>`,hh=sw/2+8;
    wave=`<g class="ew"><path class="ewr" d="${rd}" fill="none" stroke="none"/>${tl(240,sw+12,'#cfe9ff',.05)}${tl(170,sw+5,'#ffffff',.09)}${tl(100,sw*.55,'#ffffff',.2)}
     <g class="ewh" opacity="0">${ghost}</g></g>`}
  /* bandeira quadriculada no ponto onde a volta termina (em circuito fechado, é o mesmo ponto da largada) */
  let flag='';
  if(!mini){const fp=loop?s:e,fx=fp[0],fy=fp[1],H=88,FW=64,FH=44,up=fy-H-6>=-pad+2,dir=fx+FW+4<=w+pad?1:-1,y0=up?fy-H:fy+H-FH,cs=FW/8,rs=FH/4;
    let ck='';for(let ro=0;ro<4;ro++)for(let c=0;c<8;c++)ck+=`<rect x="${(dir>0?fx:fx-FW)+c*cs}" y="${y0+ro*rs}" width="${cs}" height="${rs}" fill="${(ro+c)%2?'#10161f':'#ffffff'}"/>`;
    flag=`<g aria-label="Chegada"><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${up?fy-H:fy+H}" stroke="#000" stroke-width="9" stroke-linecap="round"/><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${up?fy-H:fy+H}" stroke="#e8eef5" stroke-width="5" stroke-linecap="round"/>${ck}<rect x="${dir>0?fx:fx-FW}" y="${y0}" width="${FW}" height="${FH}" fill="none" stroke="#000" stroke-width="4"/></g>`}
  /* ghost (corredor fantasma) ou zumbi (Fuga da Horda), só com o treino iniciado */
  let hzline='',ghm='',hzm='';
  if(!mini&&p!=null&&(S.wo.running||S.wo.dist>0||S.wo.arming)){const wo=S.wo;
    if(wo.mode==='horda'&&wo.hz&&wo.hz.rel){const zp=trackPos(T,Math.min(1,Math.max(0,wo.hz.z/r.dist))),rp=trackPos(T,p);
      if(zp.i<=rp.i)hzline=`<path d="${d([zp.pos,...T.slice(zp.i+1,rp.i+1),rp.pos])}" fill="none" stroke="#ff4d4d" stroke-opacity=".85" stroke-width="${sw*.55}" stroke-linecap="round" stroke-dasharray="14 12"/>`;
      hzm=zombieG(zp.pos[0],zp.pos[1],30)}
    else if(wo.gh&&wo.mode!=='horda'){const gp=trackPos(T,Math.min(1,ghDist(wo.gh,wo.secs,r)/r.dist));ghm=ghostG(gp.pos[0],gp.pos[1],wo.gh)}}
  if(ext&&p!=null){const {pos}=trackPos(T,p);window._rp={x:pos[0],y:pos[1],vw:w+2*pad,vh:h+2*pad,pad};rider=''}   /* ext: o ciclista é uma camada HTML (#m-rider), posicionada por placeRider() */
  return `<svg viewBox="${-pad} ${-pad} ${w+2*pad} ${h+2*pad}" class="w-full h-full" role="img" aria-label="Mapa do circuito">${road}${done}${wave}${hzline}${marks}${flag}${ghm}${hzm}${rider}</svg>`}
function grade(r,p){const e=r.elev,n=e.length-1,i=Math.min(n-1,Math.floor(p*n)),seg=r.dist*1000/n,a=Math.max(0,i-1),b=Math.min(n,i+2);
  return Math.max(-15,Math.min(15,(e[b]-e[a])/(seg*(b-a))*100))}

   <p class="text-[11px] text-zinc-500 mt-3">Ao excluir, o treino sai da lista, mas seu XP, engrenagens, quilometragem, tempo total e nº de treinos continuam contabilizados.</p>
   <div class="flex gap-2 mt-4"><button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line text-zinc-300 font-semibold">Fechar</button><button onclick="histDel('${x.id}')" class="flex-1 py-2.5 rounded-lg bg-red-600 text-white font-semibold flex items-center justify-center gap-2"><i data-lucide="trash-2" class="w-4 h-4"></i>Excluir treino</button></div>`)}
function histDel(id){const p=profile(),i=p?p.history.findIndex(h=>h.id===id):-1;if(i<0)return;

/* ---------- Senha de perfil, login e perfil público (visitante) ----------
   Cada perfil guarda p.pwh (hash) e p.pws (salt) — nunca a senha em texto. Vão para o Supabase em profiles.pw_hash / pw_salt.
   Perfis antigos (sem senha) entram uma vez sem senha; ao logar, um pop-up obriga a criar a senha (selectProfile → pwSetupModal).
   Quem não tem a senha pode abrir o "perfil público" (visitorView), que NÃO mostra peso, altura, sexo, IMC, histórico de pesagens,
   calorias, engrenagens nem o histórico detalhado de treinos. Se criar novas informações no perfil, decida se entram em visitorView.
   Aviso: como o app roda 100% no navegador com o banco aberto, isto impede o uso casual do perfil alheio, mas não é segurança forte. */
const SHA=(()=>{const K=[],H0=[];
  for(let p=2,c=0;c<64;p++){let pr=true;for(let d=2;d*d<=p;d++)if(p%d===0){pr=false;break}if(!pr)continue;
    if(c<8)H0[c]=(Math.pow(p,.5)%1)*4294967296|0;K[c]=(Math.pow(p,1/3)%1)*4294967296|0;c++}
  const rr=(v,a)=>(v>>>a)|(v<<(32-a)),w=new Int32Array(64),enc=new TextEncoder();
  return s=>{const bt=enc.encode(s),l=bt.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bt);m[l]=128;
    const dv=new DataView(m.buffer);dv.setUint32(n-8,Math.floor(l*8/4294967296));dv.setUint32(n-4,(l*8)>>>0);
    const H=H0.slice();

      for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(rr(x,7)^rr(x,18)^(x>>>3))+w[i-7]+(rr(y,17)^rr(y,19)^(y>>>10)))|0}
      let [a,b,c,d,e,f,g,h]=H;
      for(let i=0;i<64;i++){
        const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
    return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}})();
const pwDerive=(pw,salt)=>{let h=SHA(salt+':'+pw);for(let i=0;i<3000;i++)h=SHA(h+salt+pw);return h};
const pwSalt=()=>{try{return Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('')}catch{return uid()+uid()+Date.now().toString(36)}};
const pwSet=(p,pw)=>{p.pws=pwSalt();p.pwh=pwDerive(pw,p.pws)};
const pwCheck=(p,pw)=>!!(p&&p.pwh&&p.pws&&pwDerive(pw,p.pws)===p.pwh);
const pwErr=(a,b)=>a.length<4?'A senha precisa ter pelo menos 4 caracteres.':a!==b?'As senhas não coincidem.':'';
const pwMsg=t=>{const e=$('#pwErr');if(e)e.textContent=t||''};
/* bloqueio de tentativas: a partir da 5ª senha errada seguida, espera 30 s (e +30 s a cada nova falha, até 4 min) */
const PWF=()=>load('cad_pwfail',{});
function pwLeft(id){const f=PWF()[id];return f&&f.until>Date.now()?Math.ceil((f.until-Date.now())/1000):0}
function pwFail(id){const m=PWF(),f=m[id]||{n:0,until:0};f.n++;if(f.n>=5)f.until=Date.now()+Math.min(f.n-4,8)*30000;m[id]=f;store('cad_pwfail',m)}
function pwOk(id){const m=PWF();if(m[id]){delete m[id];store('cad_pwfail',m)}}
const pwField=(name,label,ac='current-password')=>`<label class="block text-sm">${label}<div class="relative mt-1"><input name="${name}" type="password" required minlength="4" maxlength="40" autocomplete="${ac}" class="${IN}" style="padding-right:2.5rem"><button type="button" onclick="togglePw(this)" aria-label="Mostrar ou ocultar senha" class="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 grid place-items-center text-zinc-400 hover:text-neon"><i data-lucide="eye" class="w-4 h-4"></i></button></div></label>`;
const pwErrBox=`<p id="pwErr" class="text-sm text-red-400 min-h-[1.25rem]" role="alert" aria-live="polite"></p>`;
function togglePw(b){const i=b.parentElement.querySelector('input'),show=i.type==='password';i.type=show?'text':'password';
  b.innerHTML=`<i data-lucide="${show?'eye-off':'eye'}" class="w-4 h-4"></i>`;lucide.createIcons()}
const focusPw=n=>setTimeout(()=>{const i=document.querySelector('#modal input[name="'+n+'"]');if(i)i.focus()},60);

/* Entrada: perfil com senha → pede a senha; perfil antigo sem senha → entra e é obrigado a criar uma logo em seguida */
function loginProfile(id){const p=S.profiles.find(x=>x.id===id);if(!p)return;
  if(!p.pwh){selectProfile(id);return}
  loginModal(id)}
function loginModal(id){const p=S.profiles.find(x=>x.id===id);if(!p)return;
  openModal(`<div class="flex items-center gap-3 mb-4">${avatar(p,48)}<div class="min-w-0"><h2 class="font-display text-3xl font-bold leading-tight truncate">${esc(p.name)}</h2><div class="text-sm text-zinc-400">Digite a senha para entrar</div></div></div>
  <form onsubmit="loginSubmit(event,'${p.id}')" class="space-y-3">${pwField('pwd','Senha')}${pwErrBox}
  <button class="w-full py-2.5 rounded-lg bg-brand text-white font-semibold flex items-center justify-center gap-2"><i data-lucide="log-in" class="w-4 h-4"></i>Entrar</button>
  <div class="flex gap-3"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line">Cancelar</button>
  <button type="button" onclick="visitorView('${p.id}')" class="flex-1 py-2.5 rounded-lg border border-line text-zinc-300 hover:text-neon hover:border-neon flex items-center justify-center gap-2"><i data-lucide="eye" class="w-4 h-4"></i>Ver como visitante</button></div></form>`);
  focusPw('pwd')}
function loginSubmit(e,id){e.preventDefault();const p=S.profiles.find(x=>x.id===id);if(!p)return;
  const w=pwLeft(id);if(w){pwMsg('Muitas tentativas. Aguarde '+w+' s para tentar de novo.');return}
  const inp=e.target.elements.pwd;
  if(pwCheck(p,inp.value)){pwOk(id);closeModal();selectProfile(id);return}
  pwFail(id);const w2=pwLeft(id);pwMsg(w2?'Senha incorreta. Aguarde '+w2+' s para tentar de novo.':'Senha incorreta.');inp.value='';inp.focus()}

/* Pop-up de criação de senha (perfis antigos, logo após o primeiro login sem senha). Só fecha criando a senha ou saindo do perfil. */
function pwSetupModal(){const p=profile();if(!p||isAdmin()||p.pwh)return;
  openModal(`<div class="flex items-center gap-2 text-neon mb-1"><i data-lucide="shield-check" class="w-6 h-6"></i><h2 class="font-display text-3xl font-bold">Crie uma senha</h2></div>
  <p class="text-sm text-zinc-400 mb-4">Seu perfil ainda não tem senha. Defina uma agora: a partir do próximo login ela será exigida. Quem não souber a senha só consegue ver o seu perfil público.</p>
  <form onsubmit="pwSetupSave(event)" class="space-y-3">${pwField('pw1','Nova senha','new-password')}${pwField('pw2','Confirmar senha','new-password')}${pwErrBox}
  <div class="flex gap-3 pt-1"><button type="button" onclick="pwSetupExit()" class="flex-1 py-2.5 rounded-lg border border-line text-zinc-300">Sair do perfil</button><button class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">Salvar senha</button></div></form>`);
  modalLock=true;focusPw('pw1')}
function pwSetupSave(e){e.preventDefault();const f=e.target.elements,p=profile();if(!p||isAdmin())return;
  const er=pwErr(f.pw1.value,f.pw2.value);if(er){pwMsg(er);return}
  pwSet(p,f.pw1.value);saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)});closeModal(true);toast('Senha criada! Ela será pedida no próximo login');setTimeout(weightPrompt,400)}
function pwSetupExit(){closeModal(true);switchProfile()}

/* Alterar senha (a partir de "Editar perfil") */
function pwChangeModal(){const p=profile();if(!p||isAdmin())return;
  openModal(`<h2 class="font-display text-3xl font-bold mb-4">Alterar senha</h2>
  <form onsubmit="pwChangeSave(event)" class="space-y-3">${p.pwh?pwField('pw0','Senha atual'):''}${pwField('pw1','Nova senha','new-password')}${pwField('pw2','Confirmar nova senha','new-password')}${pwErrBox}
  <div class="flex gap-3 pt-1"><button type="button" onclick="editProfileModal()" class="flex-1 py-2.5 rounded-lg border border-line">Voltar</button><button class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">Salvar senha</button></div></form>`);
  focusPw(p.pwh?'pw0':'pw1')}
function pwChangeSave(e){e.preventDefault();const f=e.target.elements,p=profile();if(!p||isAdmin())return;
  if(p.pwh){const w=pwLeft(p.id);if(w){pwMsg('Muitas tentativas. Aguarde '+w+' s.');return}
    if(!pwCheck(p,f.pw0.value)){pwFail(p.id);pwMsg('A senha atual está incorreta.');f.pw0.select();return}pwOk(p.id)}
  const er=pwErr(f.pw1.value,f.pw2.value);if(er){pwMsg(er);return}
  if(p.pwh&&f.pw1.value===f.pw0.value){pwMsg('A nova senha deve ser diferente da atual.');return}
  pwSet(p,f.pw1.value);saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)});closeModal();toast('Senha alterada')}

/* Perfil público (modo visitante): só o que é seguro mostrar a qualquer pessoa. Sem peso, altura, sexo, IMC, pesagens, calorias,
   engrenagens ou histórico detalhado de treinos. Os melhores tempos já aparecem no ranking, então também são públicos. */

  const g=G(p),I=lvInfo(g.xp),h=p.history||[],d=g.del,km=h.reduce((a,x)=>a+x.dist,0)+d.km,tm=h.reduce((a,x)=>a+x.time,0)+d.t,n=h.length+d.n,
    m=(mode==='all'||INT[mode])?mode:'all',bests=S.routes.map(r=>({r,t:userBest(r,p,m)})).filter(x=>x.t),
    A=ACH(p),pins=A.pin.map(i=>BADGES.find(b=>b.id===i)).filter(Boolean),got=BADGES.filter(b=>A.u[b.id]).length,pet=MASCOTS[p.mascot],mob=window.matchMedia&&matchMedia("(max-width:639px)").matches,
    st=(l,v)=>`<div class="rounded-xl bg-ink border border-line p-2 sm:p-3"><div class="text-[11px] sm:text-xs text-zinc-400">${l}</div><div class="font-display text-xl sm:text-3xl font-bold text-neon">${v}</div></div>`,

      :`<div class="flex items-center gap-2 rounded-xl border border-dashed border-line px-3 py-2 text-xs text-zinc-500"><i data-lucide="pin" class="w-4 h-4"></i>Slot livre</div>`};
  openModal(`<div class="flex items-center justify-between gap-3 mb-2 sm:mb-4"><span class="inline-flex items-center gap-1.5 text-xs font-semibold text-neon bg-neon/10 border border-neon/40 rounded-full px-2.5 py-1"><i data-lucide="eye" class="w-3.5 h-3.5"></i>Modo visitante</span>
   <button onclick="closeModal()" aria-label="Fechar" class="shrink-0 w-9 h-9 grid place-items-center rounded-lg border border-line text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
   <div class="flex items-center gap-3 sm:gap-4 flex-wrap">${profBlock(p,mob?52:72)}<div class="flex-1 min-w-[140px]"><div class="font-display text-2xl sm:text-4xl font-bold break-words">${esc(p.name)}</div>
    <div class="text-xs sm:text-sm text-emerald-300 mt-0.5">Nível ${I.l} · ${I.cur.toLocaleString('pt-BR')}/${I.need.toLocaleString('pt-BR')} XP</div>
    ${pet?`<div class="text-xs sm:text-sm text-zinc-400 mt-0.5">Mascote: ${pet.icon} ${esc(pet.name)} · nível ${petInfo(petXpOf(p,pet.id)).l}</div>`:''}</div></div>
   <div class="mt-3 sm:mt-4"><div class="flex items-center justify-between mb-1"><span class="text-xs text-zinc-400 flex items-center gap-1.5"><i data-lucide="award" class="w-4 h-4 text-neon"></i>Medalhas em destaque</span><span class="text-xs text-zinc-500">${got}/${BADGES.length} desbloqueadas</span></div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-1.5 sm:gap-2">${[0,1,2].map(slot).join('')}</div></div>
   <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 mt-3 sm:mt-4">${st('Quilometragem',km.toFixed(1)+' km')}${st('Tempo total',fmt(tm))}${st('Treinos',n)}${st('Rotas com recorde',bests.length)}</div>
   <section class="mt-3 sm:mt-4"><h3 class="font-display text-xl sm:text-2xl font-bold mb-0.5">Melhores tempos</h3><div class="flex items-center gap-2 mb-2"><label for="vMode" class="text-xs text-zinc-500 shrink-0">Modo de inclinação</label>
    <select id="vMode" onchange="visitorView('${p.id}',this.value)" aria-label="Filtrar melhores tempos por modo de inclinação" class="${IN} !w-auto !py-1 flex-1 sm:flex-none">${Object.entries(INT).map(([k,v])=>`<option value="${k}" ${m===k?'selected':''}>${v.n}</option>`).join('')}<option value="all" ${m==='all'?'selected':''}>Todos os modos</option></select></div>
    ${bests.length?bests.map(x=>`<div class="flex justify-between gap-3 py-1.5 sm:py-2 text-sm sm:text-base border-b border-line last:border-0"><span class="truncate">${esc(x.r.name)}</span><span class="tabular-nums text-neon">${fmt(x.t)}</span></div>`).join(''):'<p class="text-sm text-zinc-400">Nenhum recorde neste modo ainda.</p>'}</section>
   <div class="flex gap-3 mt-3 sm:mt-4"><button onclick="closeModal()" class="flex-1 py-2 sm:py-2.5 rounded-lg border border-line text-zinc-300 font-semibold">Fechar</button>${S.cur?'':`<button onclick="closeModal();loginProfile('${p.id}')" class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold flex items-center justify-center gap-2"><i data-lucide="log-in" class="w-4 h-4"></i>Entrar neste perfil</button>`}</div>`,'max-w-2xl')}

function home(){
  const list=S.profiles.map(p=>`<div class="flex items-stretch gap-2"><button onclick="loginProfile('${p.id}')" class="flex-1 min-w-0 flex items-center gap-4 p-4 rounded-xl bg-panel border border-line hover:border-neon text-left">${avatar(p,52)}<div class="flex-1 min-w-0"><div class="font-display text-2xl font-bold truncate">${esc(p.name)}</div><div class="text-sm text-zinc-400 flex items-center gap-1.5">${p.pwh?'<i data-lucide="lock" class="w-3.5 h-3.5 shrink-0"></i>':''}Nível ${lvInfo(G(p).xp).l}</div></div><i data-lucide="chevron-right" class="text-zinc-500"></i></button><button onclick="visitorView('${p.id}')" title="Ver perfil público (visitante)" aria-label="Ver perfil público de ${esc(p.name)}" class="shrink-0 w-14 rounded-xl bg-panel border border-line hover:border-neon text-zinc-400 hover:text-neon grid place-items-center"><i data-lucide="eye" class="w-5 h-5"></i></button></div>`).join('')+(S.profiles.length?'<p class="text-xs text-zinc-500 pt-1 flex items-center gap-1.5"><i data-lucide="eye" class="w-3.5 h-3.5 shrink-0"></i>Toque no olho para ver o perfil público de alguém, sem senha.</p>':'');

  <button onclick="profileModal()" class="w-full py-3 rounded-xl bg-brand text-white font-semibold flex items-center justify-center gap-2"><i data-lucide="user-plus" class="w-5 h-5"></i>Criar novo perfil</button>
  ${STANDALONE||_installed?'':`<button onclick="instalarApp()" class="w-full mt-3 py-3 rounded-xl border border-line text-zinc-200 font-semibold flex items-center justify-center gap-2 hover:border-neon"><i data-lucide="download" class="w-5 h-5"></i>Instalar app</button>`}</div></main>`;}
const photoField=()=>`<div class="text-sm space-y-2"><div>Foto (opcional)</div>
  <div class="flex items-center gap-3"><div id="pv" class="w-14 h-14 rounded-full bg-ink border border-line bg-cover bg-center shrink-0"></div>
  <label class="flex-1 py-2 px-3 rounded-lg border border-line text-center cursor-pointer hover:border-neon">Escolher da galeria<input type="file" accept="image/*" class="hidden" onchange="pickPhoto(this)"></label></div>
  <input type="hidden" name="pd"><input name="pp" type="url" placeholder="ou cole o link direto da imagem (https://i.ibb.co/…/foto.jpg)" class="${IN}" oninput="prevPhoto(this.value)">
  <p class="text-xs text-zinc-500">Links como ibb.co/xxxx são páginas, não a imagem. Prefira escolher da galeria, ou use o "Link direto" do site de hospedagem.</p></div>`;
function prevPhoto(u){const e=$('#pv');if(e)e.style.backgroundImage=u?`url('${cssUrl(u)}')`:''}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const img=new Image(),fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{const N=160,c=document.createElement('canvas');c.width=c.height=N;const m=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,N,N);
      const d=c.toDataURL('image/jpeg',.82),form=inp.closest('form');form.elements.pd.value=d;form.elements.pp.value='';prevPhoto(d)};
    img.onerror=()=>toast('Não foi possível ler essa imagem');img.src=fr.result};
  fr.readAsDataURL(f)}
const photoOf=f=>f.pd.value||f.pp.value.trim();
function profileModal(){openModal(`<h2 class="font-display text-3xl font-bold mb-4">Novo perfil</h2>
  <form onsubmit="saveProfile(event)" class="space-y-3">
  <label class="block text-sm">Nome<input name="pn" required maxlength="30" class="${IN} mt-1"></label>
  <div class="grid grid-cols-2 gap-3"><label class="block text-sm">Peso (kg)<input name="pw" type="number" min="20" max="250" step="0.1" required class="${IN} mt-1"></label>
  <label class="block text-sm">Altura (cm)<input name="ph" type="number" min="100" max="250" required class="${IN} mt-1"></label></div>
  ${sexField('')}
  <label class="block text-sm">Apelido da bicicleta<input name="pb" required maxlength="24" autocomplete="off" placeholder="Ex.: Girassol" class="${IN} mt-1"></label>
  ${pwField('pw1','Senha (mín. 4 caracteres)','new-password')}${pwField('pw2','Confirmar senha','new-password')}${pwErrBox}
  ${photoField()}
  <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line">Cancelar</button><button class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">Salvar perfil</button></div></form>`)}
function saveProfile(e){e.preventDefault();const f=e.target.elements,er=pwErr(f.pw1.value,f.pw2.value);if(er){pwMsg(er);return}
  const p={id:uid(),name:f.pn.value.trim(),weight:+f.pw.value,height:+f.ph.value,photo:photoOf(f),inten:S.inten,sex:f.sx.value,bike:f.pb.value.trim(),history:[],wlog:[]};pwSet(p,f.pw1.value);
  S.profiles.push(p);q({t:'up',tb:'profiles',row:pRow(p)});wlog(p);saveProfiles();closeModal();selectProfile(p.id)}
/* apelido da bicicleta (por perfil): aparece nos sensores como "<apelido> (FTMS)". Perfis antigos recebem o pop-up no primeiro login. */
const bikeName=()=>{const p=profile();return(p&&p.bike)||'Minha bike'};
function bikeModal(first){const p=profile();if(!p)return;
  openModal(`<h2 class="font-display text-3xl font-bold mb-1">Apelido da bicicleta</h2><p class="text-sm text-zinc-400 mb-4">Que apelido você quer dar à sua bike? Ele aparece na área de sensores, sempre seguido de "(FTMS)".</p>
   <form onsubmit="saveBike(event)" class="space-y-3"><label class="block text-sm">Apelido<input name="bk" required maxlength="24" value="${esc(p.bike||'')}" placeholder="Ex.: Girassol" autocomplete="off" class="${IN} mt-1"></label>

function saveBike(e){e.preventDefault();const p=profile(),v=e.target.elements.bk.value.trim().slice(0,24);if(!p||!v)return;

function bikePrompt(n=0){const p=profile();if(!p||isAdmin()||p.bike)return;

function photoModal(){openModal(`<h2 class="font-display text-3xl font-bold mb-4">Alterar foto</h2>

  <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line">Cancelar</button><button class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">Salvar foto</button></div></form>`)}
function savePhoto(e){e.preventDefault();const p=profile();p.photo=photoOf(e.target.elements);saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)});closeModal();render()}

/* ---------- Lembretes (notificações) ----------
   p.rem = {on, t:'HH:MM' (horário habitual de treino), d:[0-6] (dias da semana, 0 = domingo), w:true (avisar também na pesagem), set:1, m:{dia:'r'|'g'|'b'} (ajuste manual do dia; sem o dia = automático)}
   · Com VAPID_PUBLIC preenchido e o servidor de envio publicado, o aparelho recebe push mesmo com o app fechado.
   · Sem isso, o app avisa (notificação local) enquanto estiver aberto ou em segundo plano recente. */
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],REM_K='cad_remsent',DEV_K='cad_dev';
let PUSH_ACTIVE=false;
const todayK=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function devId(){let d=load(DEV_K,null);if(!d){d=uid()+uid();store(DEV_K,d)}return d}
const vapidKey=b=>{const p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
const notifPerm=()=>('Notification' in window)?Notification.permission:'unsupported';
function remPersist(p){saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)});render()}
async function pushSub(){const p=profile();if(!p||isAdmin()||!p.rem||!p.rem.on)return;
  if(!VAPID_PUBLIC||!('serviceWorker' in navigator)||!('PushManager' in window))return;
  try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:vapidKey(VAPID_PUBLIC)});
    PUSH_ACTIVE=true;
    q({t:'up',tb:'push_subs',row:{id:p.id+':'+devId(),profile_id:p.id,sub:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Sao_Paulo',updated:Date.now()}})}
  catch(e){console.warn('push:',e)}}
const pushUnsub=p=>{PUSH_ACTIVE=false;q({t:'del',tb:'push_subs',col:'id',val:p.id+':'+devId()})};
async function notifEnable(){
  if(!('Notification' in window)){toast('Este navegador não permite notificações'+(IOS?' — instale o app na Tela de Início e abra por lá':''));return false}
  let pm=Notification.permission;if(pm==='default'){try{pm=await Notification.requestPermission()}catch(e){}}
  if(pm!=='granted'){render();return false}
  await pushSub();render();return true}
function remInit(){const p=profile();if(p&&!isAdmin()&&p.rem&&p.rem.on&&notifPerm()==='granted')pushSub()}
async function remNotify(title,body,tag){try{if(notifPerm()!=='granted')return false;
  const reg=('serviceWorker' in navigator)?await navigator.serviceWorker.getRegistration():null,o={body,tag,icon:'icon-192.png',badge:'badge-96.png?v=2',data:{url:'./'}};
  if(reg&&reg.showNotification)await reg.showNotification(title,o);else new Notification(title,o);return true}catch(e){return false}}

/* aviso local: treino (no horário, nos dias escolhidos, se ainda não treinou hoje) e pesagem (a partir das 9h do dia). Uma vez por dia. */

function admHistDel(pid,xid,gym){if(!isAdmin())return;const p=admP(pid);if(!p)return;const g=G(p),now=Date.now();
  if(gym){const y=gyD(p),i=y.log.findIndex(x=>x.id===xid);if(i<0)return;

function admPastKind(f){const g=f.elements.k.value==='g';f.querySelectorAll('[data-k]').forEach(d=>d.style.display=(d.dataset.k==='g')===g?'':'none')}

function admPastWo(f){const e=f.elements,id=e.w.value,pid=f.dataset.p,p=admP(pid),y=(p&&G(p).gym)||{},w=GY_PRE.concat(y.cus||[]).find(x=>x.id===id);if(w)e.gm.value=gyMin(gyEst(w,+(p&&p.weight)||70).secs)}
function admPastSave(e,id){e.preventDefault();if(!isAdmin())return;const p=admP(id);if(!p)return;const f=e.target.elements,g=G(p),ok=f.ok.checked,rw=f.rw.checked,
  ts=new Date(f.d.value+'T'+f.t.value).getTime();

    const r=S.routes.find(x=>x.id===f.r.value),km=+f.km.value,min=+f.m.value;
    if(!r||!(km>0)||!(min>0)){toast('Informe distância e duração');return}
    const time=Math.round(min*60),avg=km/(time/3600),coins=rw?Math.round(km*ECO.coinKm+(ok?ECO.coinConc:0)):0,xp=rw?Math.round(km*ECO.xpKm+(ok?ECO.xpConc:0)):0;

    add('n',1);add('km',h.dist);add('secs',h.time);mx('bestDist',h.dist);mx('bestSecs',h.time);
    if(ok){if(!Array.isArray(st.routes))st.routes=[];if(!st.routes.includes(h.routeId))st.routes.push(h.routeId)}

    msg='Pedal adicionado em '+new Date(ts).toLocaleDateString('pt-BR')+(rw?' · +'+admNum(coins)+' engrenagens · +'+admNum(xp)+' XP':'');
  }else{

    const secs=Math.round(min*60),est=gyEst(w,+p.weight||70),kcal=Math.round(est.kc*secs/Math.max(1,est.secs)),sets=w.it.reduce((a,it)=>a+(+it[1]||0),0),R=gyRew(secs,ok),coins=rw?R.coins:0,xp=rw?R.xp:0;

/* Pop-up de "comando de vibração" (o PC não vibra): aparece no Admin sempre que o sistema chama haptic() */
const HAP_LBL={count:'Contagem 3-2-1',go:'Largada / GO!',coin:'Ganho de engrenagens/XP',event:'Evento iniciado',evwin:'Evento conquistado',evlost:'Evento perdido',win:'Treino concluído',end:'Treino encerrado',pause:'Pausa',resume:'Retomada',level:'Subida de nível'};
function hapPopup(name,pat){let box=document.getElementById('haptoast');
  if(!box){box=document.createElement('div');box.id='haptoast';box.style.cssText='position:fixed;top:.75rem;right:.75rem;z-index:70;display:flex;flex-direction:column;gap:.5rem;pointer-events:none;width:min(86vw,300px)';document.body.appendChild(box)}
  const n=document.createElement('div');n.className='hap-pop';
  n.innerHTML=`<span class="hap-ic">📳</span><div style="min-width:0"><div style="font-weight:700;font-size:.85rem;color:#fff">Comando de vibração</div><div style="font-size:.8rem;color:#ffa13d">${HAP_LBL[name]||name}</div><div style="font-size:.7rem;color:#9dbddb;margin-top:.15rem">Padrão: ${pat.join(' – ')} ms</div></div>`;
  box.appendChild(n);while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>{n.style.opacity='0';n.style.transform='translateX(20px)';setTimeout(()=>n.remove(),300)},2600)}

 'Cada pedalada de hoje é um passo à frente do você de ontem.',
 'Constância vence talento: apareça, pedale, repita.',
 'Respire fundo, solte os ombros e encontre o seu ritmo.',
 'Subida é só uma descida que ainda não chegou.',
 'O treino mais difícil é o que você não começa. Dê o primeiro giro!',
 'Pequenos treinos somam grandes resultados.',
 'Hidrate-se e mantenha a cadência: o resto vem junto.',
 'Hoje não precisa ser perfeito, precisa ser feito.',
 'Seu recorde está esperando por você na próxima pista.',
 'Pedale pelo prazer de se mover. A performance é consequência.'];
S.msgI=0;S.msg={t0:Date.now()};
const weekKm=p=>p.history.filter(h=>h.date>=Date.now()-6048e5).reduce((a,h)=>a+h.dist,0)+G(p).del.wk.filter(a=>a[0]>=Date.now()-6048e5).reduce((a,x)=>a+x[1],0);
/* calorias: semana (7 dias), mês (30 dias) e última sessão; inclui treinos já excluídos (G().del.ck) */
const kcSum=(p,days)=>{const t=Date.now()-days*864e5;return p.history.filter(h=>h.date>=t).reduce((a,h)=>a+kcalOf(h,p),0)+gyD(p).log.filter(g=>g.d>=t).reduce((a,g)=>a+(+g.k||0),0)+(G(p).del.ck||[]).filter(a=>a[0]>=t).reduce((a,x)=>a+x[1],0)};   /* pedal + academia */
const calBox=(p,bg='bg-panel')=>{const l=p.history[0],gl=gyD(p).log[0],useG=!!gl&&(!l||gl.d>l.date),lk=useG?(+gl.k||0):(l?kcalOf(l,p):0),ld=useG?gl.d:(l?l.date:0),cell=(t,v,sub)=>`<div class="min-w-0 text-center"><div class="text-[11px] text-zinc-400 truncate">${t}</div><div class="font-display text-2xl lg:text-3xl font-bold text-neon leading-tight tabular-nums">${Math.round(v).toLocaleString('pt-BR')}<span class="text-[11px] font-sans font-normal text-zinc-500 ml-0.5">kcal</span></div>${sub?`<div class="text-[10px] text-zinc-500 truncate leading-none">${sub}</div>`:''}</div>`;
  return `<section class="rounded-xl ${bg} border border-line px-3 py-2 lg:py-3 shrink-0"><div class="flex items-center gap-1.5 text-xs text-zinc-300 font-semibold mb-1"><i data-lucide="flame" class="w-4 h-4 text-neon"></i>Calorias</div><div class="grid grid-cols-3 gap-2 divide-x divide-line">${cell('Última sessão',lk,ld?new Date(ld).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'sem treinos')}${cell('Semana',kcSum(p,7),'7 dias')}${cell('Mês',kcSum(p,30),'30 dias')}</div></section>`};
function motivMsg(p){if(!p.history.length&&!G(p).del.n&&!S.msgI)return 'Sua primeira pedalada começa com um clique. Escolha uma pista e vamos nessa!';
  return MOTIV[(Math.floor(Date.now()/864e5)+hash(p.id)+S.msgI)%MOTIV.length]}
/* mensagem do dia cíclica: troca sozinha a cada MSG_MS (o círculo mostra o tempo) e também pelo botão "Outra"; atualiza só o texto, sem redesenhar a tela */
const MSG_MS=15000;let msgT;
function msgSched(){clearTimeout(msgT);if(!S.msg||!$('#msgTxt'))return;msgT=setTimeout(msgGo,Math.max(50,MSG_MS-(Date.now()-S.msg.t0)))}
function msgGo(){const e=$('#msgTxt'),p=profile();if(!e||!p)return;S.msgI++;S.msg.t0=Date.now();
  e.textContent=motivMsg(p);e.style.animation='none';void e.offsetWidth;e.style.animation='bodyin .5s ease-out';
  const g=$('#msgRingBox');if(g)g.innerHTML=recRing(0,MSG_MS);msgSched()}
function nextMsg(){msgGo()}
/* Recomenda a pista menos concluída; empate: a que está há mais tempo sem treino; depois a mais curta */
function recommend(){const p=profile();if(!p||!S.routes.length)return null;
  const info=S.routes.map(r=>{const hs=p.history.filter(h=>h.routeId===r.id);
    return{r,dn:hs.filter(h=>h.done).length,last:hs.length?Math.max(...hs.map(h=>h.date)):0}});
  info.sort((a,b)=>a.dn-b.dn||a.last-b.last||a.r.dist-b.r.dist);
  const x=info[0];x.why=x.dn===0?(x.last?'Você começou, mas ainda não concluiu':'Pista nova para você'):'É a que está há mais tempo sem pedalar';return x}
/* ---------- Carrossel "Pistas Recomendadas" ---------- */
const REC_MS=7000;let recT;
const recShuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function recInit(){const ids=S.routes.map(r=>r.id);
  if(!S.rec||S.rec.order.length!==ids.length||!ids.every(id=>S.rec.order.includes(id)))S.rec={order:recShuffle(ids),i:0,t0:Date.now()}}
function recWhy(r){const hs=profile().history.filter(h=>h.routeId===r.id),dn=hs.filter(h=>h.done).length;
  return dn?'Concluída '+dn+'x · tente melhorar seu tempo':(hs.length?'Você começou, mas ainda não concluiu':'Pista nova para você')}
const recTxt=r=>`<div class="font-display text-2xl font-bold truncate">${esc(r.name)}</div><div class="text-xs text-zinc-400 truncate">${r.dist.toFixed(1)} km · +${elevStats(r.elev).gain} m · ${userBest(r)?'Seu recorde '+fmt(userBest(r)):'Sem recorde'}</div><div class="text-xs text-zinc-500 truncate">${recWhy(r)}</div>`;
const recRing=(off,ms=REC_MS)=>`<svg viewBox="0 0 40 40" class="w-5 h-5 sm:w-9 sm:h-9 -rotate-90" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(156,163,175,.45)" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="#fff" stroke-width="4" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:100;animation:recfill ${ms}ms linear forwards;animation-delay:-${off}ms"/></svg>`;
function recSched(){clearTimeout(recT);const R=S.rec;if(!R||R.order.length<2||!$('#recTrack'))return;recT=setTimeout(()=>recGo(1),Math.max(50,REC_MS-(Date.now()-R.t0)))}
function recGo(d){const R=S.rec,t=$('#recTrack');if(!R||!t)return;const n=R.order.length;R.i=(R.i+d+n)%n;R.t0=Date.now();
  const r=S.routes.find(x=>x.id===R.order[R.i]),vp=t.parentElement,nw=document.createElement('div');
  /* slide lateral: a pista nova entra pelo lado da navegação e a atual sai pelo lado oposto (também no fim → início) */
  nw.className='absolute inset-0';nw.innerHTML=`<div class="h-full">${cover(r,'h-full')}</div>`;nw.style.transform=`translateX(${d*100}%)`;
  t.removeAttribute('id');nw.id='recTrack';vp.appendChild(nw);void nw.offsetWidth;
  const tr='transform .55s cubic-bezier(.4,0,.2,1)';t.style.transition=nw.style.transition=tr;
  t.style.transform=`translateX(${-d*100}%)`;nw.style.transform='translateX(0)';setTimeout(()=>t.remove(),600);
  const tx=$('#recTxt');tx.innerHTML=recTxt(r);tx.style.animation='none';void tx.offsetWidth;tx.style.animation=`${d>0?'recTxtR':'recTxtL'} .55s cubic-bezier(.4,0,.2,1)`;
  const g=$('#recRingBox');if(g)g.innerHTML=recRing(0);recSched();if(window.lucide)lucide.createIcons()}  /* avançar/voltar (manual ou automático) zera o círculo */
function startNow(id){const w=S.wo;if(S.gy){toast('Encerre o treino da academia primeiro');return}
  if(w.dist>0||w.running){toast('Já há um treino em andamento');setTab('treino');return}

function weekStrip(p){const s=gyStats(p),y=gyD(p),L=['S','T','Q','Q','S','S','D'],NM=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'],

  cell=(d,i)=>{const kinds=['r','g'].filter(k=>d['p'+k]||d[k]),done=k=>!!d[k],z=kinds.length>1?'w-3.5 h-3.5':'w-5 h-5';let inner,cls,txt;
   if(!kinds.length){inner=ic('moon','text-zinc-600','w-5 h-5');cls='border-line';txt='descanso'}
   else{inner=kinds.map(k=>ic(K[k].n,done(k)?K[k].c:d.past?'text-red-400':'text-zinc-300',z)).join('');
    const all=kinds.every(done),some=kinds.some(done);

/* Por km: moedas e XP pela distância + ganho de altimetria do km; ao final: conclusão e velocidade média; por evento vencido (constantes em ECO) */
/* =====================================================================================================================

   (definidas pelo dono do app; valem para pessoas e para qualquer IA que não tenha o histórico da conversa)
   1. OBJETIVO DO On Fire!: "Nos próximos 10 segundos, fique acima da velocidade média atual". Média atual = média da velocidade nos EV_BASE_N (5) s
      anteriores (e.base): acompanha a média durante o "Prepare-se"/3-2-1 e fica CONGELADA no GO, valendo pelos 10 s do desafio. Vence quem ficou ACIMA de e.base em pelo menos 6 dos 10 segundos
      (tolerância para variações do sensor; sem margem extra de +2 km/h). O texto do subtexto (def.goal) não deve ser alterado.
   2. TODO EVENTO TEM UM CARD NO CENTRO DA TELA, como elemento principal: #evt é uma camada de tela cheia (z-55) com fundo escurecido
      levemente (rgba(0,0,0,.5)) durante todo o evento. O card aparece no disparo e fica até 2,6 s depois do resultado. Ao pausar o treino o
      card some e, ao retomar, é recriado (evTick) no mesmo ponto. A camada não bloqueia toques (pointer-events:none).
