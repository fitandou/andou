<script>
/* SQL para rodar UMA vez no Supabase (SQL Editor) — IMC / peso:
   alter table profiles add column if not exists sex text default '';
   create table if not exists weight_log(id text primary key, profile_id text not null references profiles(id) on delete cascade, date bigint not null, weight numeric not null);
   alter table weight_log enable row level security;

   -- PONTUAÇÃO (rodar uma vez; sem isso o app grava os treinos sem pontos no banco):
   alter table workouts add column if not exists pts int default 0, add column if not exists ev_ok int default 0, add column if not exists ev_tot int default 0;
   -- ECONOMIA, GARAGEM, GHOST E FUGA DA HORDA (rodar uma vez; sem isso o app funciona, mas moedas/XP/equipamentos e o ghost ficam só neste aparelho):
   alter table profiles add column if not exists game jsonb;   -- {coins, xp, inv:[ids], eq:{rodas,quadros,capacetes,sapatilhas}}
   alter table workouts add column if not exists coins int default 0, add column if not exists xp int default 0, add column if not exists trace jsonb, add column if not exists mode text default 'normal';
*/
/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Não foi possível salvar os dados')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(r).padStart(2,'0')};
const cssUrl=u=>encodeURI(u).replace(/'/g,'%27').replace(/"/g,'%22');
const IN='w-full bg-ink border border-line rounded-lg px-3 py-2 text-sm';
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,2600)}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* ---------- Estado ---------- */
function simElev(seed,n=60){const h=hash(seed),b=15+h%90,a=15+h%40,f=1+h%3;
  return Array.from({length:n},(_,i)=>Math.round(b+a*Math.sin(i/n*Math.PI*f)+a*.6*Math.sin(i/n*Math.PI*7+h)+i*.35));}
const DEMO=[
 {id:'demo1',name:'Serra do Mar – Subida',desc:'Subida contínua com trechos de até 8% de inclinação. Ideal para treino de força.',dist:18.4,photo:''},
 {id:'demo2',name:'Orla da Barra',desc:'Percurso plano à beira-mar, ótimo para ritmo constante e recuperação.',dist:24.2,photo:''},
 {id:'demo3',name:'Circuito do Aterro',desc:'Volta rápida com pequenas ondulações. Boa para tentar recordes.',dist:9.6,photo:''}
].map(r=>({...r,elev:simElev(r.id),demo:true}));
const S={
  profiles:load('cad_profiles',[]),
  routes:load('cad_routes',null)||DEMO,
  cur:null,
  lastCur:load('cad_cur',null),

  sim:{on:!navigator.bluetooth,cad:80,hr:135,spd:28},

  wo:{route:null,running:false,dist:0,secs:0,mult:1,hrSum:0,hrN:0,hrMax:0,coins:0,xp:0,kmAw:0,evs:[],evCur:null,spdH:[],evOk:0,evTot:0,mode:'normal',hz:null,gh:null,trace:[],trLast:0},
  edit:null
};
if(!load('cad_routes',null))store('cad_routes',S.routes);
/* ---------- Intensidade de inclinação ---------- */
const INT={off:{n:'Off',k:0},suave:{n:'Suave',k:.5},real:{n:'Realista',k:1},duro:{n:'Difícil',k:1.6}};
S.inten=INT[load('cad_inten','real')]?load('cad_inten','real'):'real';
/* Fator aplicado à velocidade medida: subida reduz (≈0,5 a 8% no Realista), descida ajuda um pouco (máx. 1,5) */
function factor(g){const k=INT[S.inten].k;return (g>=0?Math.max(.2,1-.0625*g*k):Math.min(1.5,1-.03*g*k))*gearMult(g)}
function bestMode(){return S.bestFilter==='all'||INT[S.bestFilter]?S.bestFilter:S.inten}
function setBestFilter(v){if(v!=='all'&&!INT[v])return;S.bestFilter=v;render()}
function setInten(v){if(!INT[v]||S.wo.dist>0||S.wo.running)return;S.inten=v;store('cad_inten',v);const p=profile();if(p){p.inten=v;saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)})}render()}
function applyInten(){const pr=profile(),v=(pr&&pr.inten)||load('cad_inten','real');S.inten=INT[v]?v:'real'}
const profile=()=>S.profiles.find(p=>p.id===S.cur);
const route=()=>S.routes.find(r=>r.id===S.wo.route)||S.routes[0];
const saveProfiles=()=>store('cad_profiles',S.profiles);
const saveRoutes=()=>store('cad_routes',S.routes);

/* ---------- Economia: Moedas de Engrenagem, XP, níveis e equipamentos ----------
   Por km: moedas e XP crescem com a distância e com o ganho de altimetria do km (do GPX). Os níveis liberam itens da loja e modos. */
const ECO={coinKm:20,coinGain:.5,xpKm:40,xpGain:1,coinConc:200,xpConc:150,coinVel:5,coinEvt:150,xpEvt:100,hordaMul:1.25};
const FEAT={horda:2,ghostLider:3};                         /* nível mínimo para liberar o modo / o ghost do líder */
const HORDA={delay:30,v0:14,vInc:1,vMax:27,catchKm:.01};   /* s pedalando até o zumbi acordar · km/h inicial · +km/h por minuto · km/h máx. · distância de captura */
const RAR=[{n:'Comum',c:'#9dbddb'},{n:'Raro',c:'#6ac3ff'},{n:'Épico',c:'#c084fc'},{n:'Lendário',c:'#ffa13d'}];
const SLOTS=[['rodas','Rodas','circle-dot'],['quadros','Quadros','bike'],['capacetes','Capacetes','hard-hat'],['sapatilhas','Sapatilhas','footprints']];
/* b: flat = trechos planos (|inclinação| ≤ 2%) · climb = subidas (> 2%) · down = descidas (< -2%) · all = todo o percurso; valores somam entre as peças equipadas */
const ITEMS=[
 {id:'r0',slot:'rodas',n:'Rodas Padrão',r:0,price:0,lv:1,st:'spoke',b:{}},
 {id:'r1',slot:'rodas',n:'Rodas Alumínio Pro',r:0,price:300,lv:1,st:'spoke',b:{flat:.01}},
 {id:'r2',slot:'rodas',n:'Rodas Aerodinâmicas',r:1,price:900,lv:2,st:'aero',b:{flat:.02}},
 {id:'r3',slot:'rodas',n:'Rodas Carbono 60 mm',r:2,price:2400,lv:5,st:'carbon',b:{flat:.035}},
 {id:'r4',slot:'rodas',n:'Disco Lenticular',r:3,price:6000,lv:9,st:'disc',b:{flat:.05}},
 {id:'q0',slot:'quadros',n:'Quadro Urbano',r:0,price:0,lv:1,st:'urban',b:{}},
 {id:'q1',slot:'quadros',n:'Quadro Alumínio',r:0,price:400,lv:1,st:'alu',b:{climb:.01}},
 {id:'q2',slot:'quadros',n:'Quadro Leve',r:1,price:1100,lv:3,st:'light',b:{climb:.03}},
 {id:'q3',slot:'quadros',n:'Quadro Carbono Escalador',r:2,price:3000,lv:6,st:'carbon',b:{climb:.05}},
 {id:'q4',slot:'quadros',n:'Quadro Titânio Lendário',r:3,price:7500,lv:10,st:'titan',b:{climb:.07,flat:.01}},
 {id:'c0',slot:'capacetes',n:'Capacete Básico',r:0,price:0,lv:1,st:'basic',b:{}},
 {id:'c1',slot:'capacetes',n:'Capacete Ventilado',r:0,price:250,lv:1,st:'vent',b:{down:.01}},
 {id:'c2',slot:'capacetes',n:'Capacete Aero',r:1,price:800,lv:3,st:'aero',b:{down:.02}},
 {id:'c3',slot:'capacetes',n:'Capacete Crono',r:2,price:2000,lv:6,st:'crono',b:{down:.03,flat:.01}},
 {id:'c4',slot:'capacetes',n:'Capacete Dourado',r:3,price:5000,lv:9,st:'crono',b:{down:.04,flat:.015}},
 {id:'s0',slot:'sapatilhas',n:'Sapatilha Básica',r:0,price:0,lv:1,st:'basic',b:{}},
 {id:'s1',slot:'sapatilhas',n:'Sapatilha Rígida',r:0,price:250,lv:1,st:'strap',b:{all:.005}},
 {id:'s2',slot:'sapatilhas',n:'Sapatilha Carbono',r:1,price:900,lv:3,st:'race',b:{all:.01}},
 {id:'s3',slot:'sapatilhas',n:'Sapatilha Pro Tour',r:2,price:2200,lv:6,st:'race',b:{all:.015}},
 {id:'s4',slot:'sapatilhas',n:'Sapatilha Lendária',r:3,price:5500,lv:9,st:'race',b:{all:.02}}];
const ITEM={};ITEMS.forEach(i=>ITEM[i.id]=i);
const STARTERS=['r0','q0','c0','s0'],STARTER_EQ={rodas:'r0',quadros:'q0',capacetes:'c0',sapatilhas:'s0'};
/* Dados de jogo do perfil (moedas, XP, inventário, equipados). Perfis antigos começam com as moedas/XP do que já pedalaram. */
function G(p=profile()){if(!p)return null;
  if(!p.game||typeof p.game!=='object'){const hs=p.history||[];
    p.game={coins:hs.reduce((a,h)=>a+(+h.coins||+h.pts||0),0),xp:hs.reduce((a,h)=>a+(+h.xp||Math.round((+h.dist||0)*ECO.xpKm)),0),inv:STARTERS.slice(),eq:{...STARTER_EQ}}}
  const g=p.game;g.coins=+g.coins||0;g.xp=+g.xp||0;if(!Array.isArray(g.inv))g.inv=[];
  STARTERS.forEach(i=>{if(!g.inv.includes(i))g.inv.push(i)});g.eq=g.eq||{};
  SLOTS.forEach(([sl])=>{if(!g.eq[sl]||!g.inv.includes(g.eq[sl]))g.eq[sl]=STARTER_EQ[sl]});return g}
const lvCost=l=>Math.round(300*Math.pow(l,1.35));          /* XP para sair do nível l para o l+1 */
function lvInfo(xp){let l=1,r=xp;while(r>=lvCost(l)&&l<99){r-=lvCost(l);l++}return{l,cur:r,need:lvCost(l),pct:Math.min(1,r/lvCost(l))}}
function gearBonus(p=profile()){const g=p&&G(p),o={flat:0,climb:0,down:0,all:0};if(!g)return o;
  SLOTS.forEach(([sl])=>{const it=ITEM[g.eq[sl]];if(it)for(const k in it.b)o[k]+=it.b[k]});return o}
/* multiplicador da velocidade virtual pelo terreno (inclinação do GPX): plano ±2%, subida > 2%, descida < -2% */
function gearMult(gr){const b=gearBonus();return 1+b.all+(Math.abs(gr)<=2?b.flat:gr>2?b.climb:b.down)}

/* ---------- Supabase ----------
   Preencha com os dados de Project Settings › API. Se ficarem vazios, o app
   continua funcionando só com localStorage (neste aparelho). */
const SUPABASE_URL='https://nxerskmlvqxpgckpmvne.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_1bJgblIKv3S288IEM6P8pA_JJ4cJNe6';
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
S.sync=sb?'ok':'off';
const SYNC_UI={ok:['bg-emerald-300','Dados sincronizados com o Supabase'],err:['bg-ember','Sem conexão: alterações ficam pendentes e são enviadas depois'],off:['bg-zinc-600','Supabase não configurado: dados salvos só neste aparelho']};
const syncDot=()=>`<span id="sync" title="${SYNC_UI[S.sync][1]}" class="inline-block w-2.5 h-2.5 rounded-full shrink-0 ${SYNC_UI[S.sync][0]}"></span>`;
function setSync(st){S.sync=st;const e=$('#sync');if(e){e.className='inline-block w-2.5 h-2.5 rounded-full shrink-0 '+SYNC_UI[st][0];e.title=SYNC_UI[st][1]}}

/* Conversões objeto do app <-> linha do banco */
const pRow=p=>({id:p.id,name:p.name,weight:p.weight,height:p.height,photo:p.photo||'',inten:p.inten||S.inten,sex:p.sex||'',game:G(p)});
const wlRow=(pid,e)=>({id:e.id,profile_id:pid,date:e.date,weight:e.weight});
const fromWl=x=>({id:x.id,date:+x.date,weight:+x.weight});
const rRow=r=>({id:r.id,name:r.name,descr:r.desc||'',photo:r.photo||'',dist:r.dist,elev:r.elev,track:r.track||null,demo:!!r.demo,sim_elev:!!r.simElev});
const wRow=(pid,h)=>({id:h.id,profile_id:pid,route_id:h.routeId,route_name:h.routeName,date:h.date,dist:h.dist,time:h.time,avg_spd:h.avgSpd||0,avg_hr:h.avgHr||0,max_hr:h.maxHr||0,done:!!h.done,inten:h.inten||'off',coins:h.coins||0,xp:h.xp||0,trace:h.trace||null,mode:h.mode||'normal',ev_ok:h.evOk||0,ev_tot:h.evTot||0});
const fromP=(x,o)=>({id:x.id,name:x.name,weight:+x.weight,height:+x.height,photo:x.photo||'',inten:x.inten,sex:x.sex!==undefined?(x.sex||''):((o&&o.sex)||''),game:(x.game!=null&&typeof x.game==='object')?x.game:((o&&o.game)||undefined),history:[],wlog:(o&&o.wlog)||[]});
const fromR=x=>({id:x.id,name:x.name,desc:x.descr||'',photo:x.photo||'',dist:+x.dist,elev:x.elev,track:x.track||undefined,demo:x.demo,simElev:x.sim_elev});
const fromW=x=>({id:x.id,routeId:x.route_id,routeName:x.route_name,date:+x.date,dist:+x.dist,time:+x.time,avgSpd:+x.avg_spd,avgHr:+x.avg_hr,maxHr:+x.max_hr,done:x.done,inten:x.inten,coins:+x.coins||+x.pts||0,xp:+x.xp||0,trace:Array.isArray(x.trace)?x.trace:null,mode:x.mode||'normal',evOk:+x.ev_ok||0,evTot:+x.ev_tot||0});

/* Fila de gravações (outbox): persiste no localStorage e reenvia quando a conexão voltar */
let outbox=load('cad_outbox',[]),flushing=false;
const pkOf=o=>o.row?(o.row.id!=null?o.row.id:o.row.profile_id):null;
function q(op){if(!sb)return;
  if(op.t==='up')outbox=outbox.filter(x=>!(x.t==='up'&&x.tb===op.tb&&pkOf(x)===pkOf(op)));
  outbox.push(op);store('cad_outbox',outbox);flush()}
async function flush(){if(!sb||flushing||!outbox.length)return;flushing=true;
  try{while(outbox.length){const o=outbox[0];
      let r=o.t==='up'?await sb.from(o.tb).upsert(o.row):await sb.from(o.tb).delete().eq(o.col,o.val);
      /* banco ainda sem colunas novas (sex, game; pts/coins/xp/trace/mode/ev_*): regrava sem elas, uma por vez, conforme o erro aponta */
      if(r.error&&o.t==='up'&&(o.tb==='profiles'||o.tb==='workouts')){const row={...o.row},cols=o.tb==='profiles'?['sex','game']:['coins','xp','trace','mode','pts','ev_ok','ev_tot'];
        for(let i=0;i<8&&r.error;i++){const m=r.error.message||'';const c=cols.find(k=>k in row&&new RegExp('\\b'+k+'\\b','i').test(m));if(!c)break;delete row[c];r=await sb.from(o.tb).upsert(row)}}
      if(r.error){if(r.error.code){console.error(r.error);toast('O Supabase recusou uma gravação: '+r.error.message);outbox.shift();store('cad_outbox',outbox);continue}throw r.error}
      outbox.shift();store('cad_outbox',outbox)}
    setSync('ok')}
  catch(e){console.error(e);setSync('err')}
  flushing=false}
window.addEventListener('online',flush);
setInterval(flush,30000);

/* Lê todas as linhas de uma tabela (páginas de 1000) */
async function fetchAll(tb,col,asc=true){let out=[],from=0;
  for(;;){const r=await sb.from(tb).select('*').order(col,{ascending:asc}).range(from,from+999);
    if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)return out;from+=1000}}

/* Baixa tudo do Supabase para o estado local. Se o banco estiver vazio, envia os dados locais (migração). */
async function pull(){
  let L=null;try{L=await fetchAll('weight_log','date')}catch(e){console.warn('weight_log indisponível',e)}
  const [P,R,W,A]=await Promise.all([fetchAll('profiles','created_at'),fetchAll('routes','created_at',false),fetchAll('workouts','date',false),fetchAll('active_workouts','profile_id')]);
  if(!P.length&&!R.length){
    S.profiles.forEach(p=>{q({t:'up',tb:'profiles',row:pRow(p)});wlog(p).forEach(e=>q({t:'up',tb:'weight_log',row:wlRow(p.id,e)}));(p.history||[]).forEach(h=>q({t:'up',tb:'workouts',row:wRow(p.id,h)}))});
    S.routes.forEach(r=>q({t:'up',tb:'routes',row:rRow(r)}));
    return null}
  const old={};S.profiles.forEach(p=>old[p.id]=p);
  const by={};P.forEach(x=>by[x.id]=fromP(x,old[x.id]));
  W.forEach(x=>{if(by[x.profile_id])by[x.profile_id].history.push(fromW(x))});
  if(L){P.forEach(x=>by[x.id].wlog=[]);L.forEach(x=>{if(by[x.profile_id])by[x.profile_id].wlog.push(fromWl(x))});
    /* pesagens que só existem neste aparelho (ex.: tabela criada depois) sobem para o banco */

/* Perfis precisam existir no banco antes dos treinos (chave estrangeira): a fila mantém a ordem de inserção. */

/* ---------- IMC, peso e silhueta ---------- */
function wlog(p){if(!p.wlog)p.wlog=[];

const hhmm=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

/* Silhueta: masculina (ombros largos) ou feminina (cintura marcada, cabelo); largura cresce com o IMC e a cor indica a faixa */
function body(sex,bmi,c){const w=Math.min(1,Math.max(0,(bmi-16)/24)),s=.8+.6*w,f=sex==='f',

    pts=[[60,56],...R.map(p=>[60+p[0],p[1]]),[60,170],...R.slice().reverse().map(p=>[60-p[0],p[1]])],

  return `<svg viewBox="0 0 120 250" class="bodyin h-56 sm:h-64 mx-auto" role="img" aria-label="Silhueta ${f?'feminina':'masculina'}, IMC ${bmi.toFixed(1)}" style="filter:drop-shadow(0 0 10px ${c}66)">
   <g fill="${c}" stroke="${c}" stroke-linecap="round" style="transition:fill .4s,stroke .4s">
   ${f?'<g opacity=".55"><ellipse cx="60" cy="30" rx="18" ry="17" stroke="none"/><line x1="44" y1="32" x2="43" y2="64" stroke-width="8"/><line x1="76" y1="32" x2="77" y2="64" stroke-width="8"/></g>':''}
   <circle cx="60" cy="34" r="14" stroke="none"/>
   <g stroke-width="${(9+5*w).toFixed(1)}">${arm(-1)}${arm(1)}</g>
   <g stroke-width="${((f?12:13)+9*w).toFixed(1)}">${leg(-1)}${leg(1)}</g>
   <path d="${smooth(pts)}" stroke-width="2"/></g></svg>`}
function bmiBar(b){const pos=Math.min(100,Math.max(0,(b-15)/25*100));
  return `<div class="relative pt-3"><div class="flex h-2.5 rounded-full overflow-hidden"><i style="width:14%;background:#6ac3ff"></i><i style="width:26%;background:#34d399"></i><i style="width:20%;background:#facc15"></i><i style="width:40%;background:#ef4444"></i></div><div class="absolute top-0 w-0.5 h-6 bg-white rounded" style="left:${pos}%"></div></div>`}

function weightModal(auto){const p=profile();if(!p)return;

/* ---------- Avatar / capa / altimetria ---------- */
function avatar(p,size=48){const st=`width:${size}px;height:${size}px;font-size:${size*.45}px`;

function elevStats(e){let g=0;for(let i=1;i<e.length;i++)if(e[i]>e[i-1])g+=e[i]-e[i-1];return{gain:Math.round(g),max:Math.round(Math.max(...e)),min:Math.round(Math.min(...e))}}

/* ---------- Traçado do circuito ---------- */
function normTrack(pts){let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  pts.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])});

    if(p>0)done=`<path d="${d([...T.slice(0,i+1),pos])}" fill="none" stroke="#6ac3ff" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;

      ?`<defs><clipPath id="rc"><circle cx="${x}" cy="${y}" r="32"/></clipPath></defs><circle cx="${x}" cy="${y}" r="32" fill="#080f17"/><image href="${esc(ph)}" x="${x-32}" y="${y-32}" width="64" height="64" preserveAspectRatio="xMidYMid slice" clip-path="url(#rc)"/><circle cx="${x}" cy="${y}" r="32" fill="none" stroke="#ffa13d" stroke-width="5"/><circle cx="${x}" cy="${y}" r="36" fill="none" stroke="#fff" stroke-width="2"/>`

      ?`<defs><clipPath id="gc"><circle r="${R}"/></clipPath></defs><circle r="${R}" fill="#080f17"/><image href="${esc(gph)}" x="${-R}" y="${-R}" width="${2*R}" height="${2*R}" preserveAspectRatio="xMidYMid slice" clip-path="url(#gc)"/><circle r="${R}" fill="none" stroke="#ffa13d" stroke-width="5"/><circle r="${R+3}" fill="none" stroke="#fff" stroke-width="2"/>`
      :`<circle r="${R}" fill="#ffa13d" stroke="#fff" stroke-width="4"/><text dy=".35em" text-anchor="middle" font-size="30" font-weight="700" fill="#000000">${esc(((gp&&gp.name)||'🚴')[0].toUpperCase())}</text>`);
    const rd=d(rem),L=len.toFixed(1),ex=`d="${rd}" pathLength="${L}" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dashoffset="999" data-len="${L}"`,gap=(len+500).toFixed(0);
    /* cauda de camadas translúcidas (vidro) que somem para trás + avatar fantasma na frente.
       A cauda anda por stroke-dashoffset e o fantasma por getPointAtLength, ambos no waveLoop. Uma única onda, sem repetição no trecho. */
    const tl=(g,w,c,o)=>`<path class="ewp" data-g="${g}" ${ex} stroke="${c}" stroke-opacity="${o}" stroke-width="${w}" stroke-dasharray="${g} ${gap}"/>`,hh=sw/2+8;
    wave=`<g class="ew"><path class="ewr" d="${rd}" fill="none" stroke="none"/>${tl(240,sw+12,'#cfe9ff',.05)}${tl(170,sw+5,'#ffffff',.09)}${tl(100,sw*.55,'#ffffff',.2)}

  /* bandeira quadriculada no ponto onde a volta termina (em circuito fechado, é o mesmo ponto da largada) */
  let flag='';
  if(!mini){const fp=loop?s:e,fx=fp[0],fy=fp[1],H=88,FW=64,FH=44,up=fy-H-6>=-pad+2,dir=fx+FW+4<=w+pad?1:-1,y0=up?fy-H:fy+H-FH,cs=FW/8,rs=FH/4;
    let ck='';for(let ro=0;ro<4;ro++)for(let c=0;c<8;c++)ck+=`<rect x="${(dir>0?fx:fx-FW)+c*cs}" y="${y0+ro*rs}" width="${cs}" height="${rs}" fill="${(ro+c)%2?'#10161f':'#ffffff'}"/>`;
    flag=`<g aria-label="Chegada"><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${up?fy-H:fy+H}" stroke="#000" stroke-width="9" stroke-linecap="round"/><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${up?fy-H:fy+H}" stroke="#e8eef5" stroke-width="5" stroke-linecap="round"/>${ck}<rect x="${dir>0?fx:fx-FW}" y="${y0}" width="${FW}" height="${FH}" fill="none" stroke="#000" stroke-width="4"/></g>`}
  /* ghost (corredor fantasma) ou zumbi (Fuga da Horda), só com o treino iniciado */
  let hzline='',ghm='',hzm='';
  if(!mini&&p!=null&&(S.wo.running||S.wo.dist>0||S.wo.arming)){const wo=S.wo;
    if(wo.mode==='horda'&&wo.hz&&wo.hz.rel){const zp=trackPos(T,Math.min(1,Math.max(0,wo.hz.z/r.dist))),rp=trackPos(T,p);
      if(zp.i<=rp.i)hzline=`<path d="${d([zp.pos,...T.slice(zp.i+1,rp.i+1),rp.pos])}" fill="none" stroke="#ff4d4d" stroke-opacity=".85" stroke-width="${sw*.55}" stroke-linecap="round" stroke-dasharray="14 12"/>`;
      hzm=zombieG(zp.pos[0],zp.pos[1],30)}
    else if(wo.gh&&wo.mode!=='horda'){const gp=trackPos(T,Math.min(1,ghDist(wo.gh,wo.secs,r)/r.dist));ghm=ghostG(gp.pos[0],gp.pos[1],wo.gh)}}
  return `<svg viewBox="${-pad} ${-pad} ${w+2*pad} ${h+2*pad}" class="w-full h-full" role="img" aria-label="Mapa do circuito">${road}${done}${wave}${hzline}${marks}${flag}${ghm}${hzm}${rider}</svg>`}
function grade(r,p){const e=r.elev,n=e.length-1,i=Math.min(n-1,Math.floor(p*n)),seg=r.dist*1000/n,a=Math.max(0,i-1),b=Math.min(n,i+2);
  return Math.max(-15,Math.min(15,(e[b]-e[a])/(seg*(b-a))*100))}

    return{r,dn:hs.filter(h=>h.done).length,last:hs.length?Math.max(...hs.map(h=>h.date)):0}});
  info.sort((a,b)=>a.dn-b.dn||a.last-b.last||a.r.dist-b.r.dist);
  const x=info[0];x.why=x.dn===0?(x.last?'Você começou, mas ainda não concluiu':'Pista nova para você'):'É a que está há mais tempo sem pedalar';return x}

const recRing=off=>`<svg viewBox="0 0 40 40" class="w-9 h-9 -rotate-90" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(156,163,175,.45)" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="#fff" stroke-width="4" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:100;animation:recfill ${REC_MS}ms linear forwards;animation-delay:-${off}ms"/></svg>`;
function recSched(){clearTimeout(recT);const R=S.rec;if(!R||R.order.length<2||!$('#recTrack'))return;recT=setTimeout(()=>recGo(1),Math.max(50,REC_MS-(Date.now()-R.t0)))}
function recGo(d){const R=S.rec,t=$('#recTrack');if(!R||!t)return;const n=R.order.length;R.i=(R.i+d+n)%n;R.t0=Date.now();
  const r=S.routes.find(x=>x.id===R.order[R.i]),vp=t.parentElement,nw=document.createElement('div');

  const g=$('#recRingBox');if(g)g.innerHTML=recRing(0);recSched();if(window.lucide)lucide.createIcons()}  /* avançar/voltar (manual ou automático) zera o círculo */

/* ---------- Moedas, XP e eventos ---------- */
/* Por km: moedas e XP pela distância + ganho de altimetria do km; ao final: conclusão e velocidade média; por evento vencido (constantes em ECO) */
/* Eventos aleatórios: cada um tem 5 s de aviso (com contagem 3-2-1-GO) e depois um desafio de "dur" segundos */
const EVENTS=[
 {id:'fire',t:'On Fire!',d:'Explosão de 10 segundos! Acelere acima da velocidade de agora e segure o ritmo.',dur:10,
  ok:e=>e.s.filter(v=>v>e.base+2).length>=8},
 {id:'cad',t:'Cadência de Ferro',d:'Pedale com 90 rpm ou mais por 15 segundos.',dur:15,
  ok:e=>e.c.filter(v=>v>=90).length>=13},
 {id:'sprint',t:'Sprint de Pelotão',d:'Chegue a 35 km/h e sustente por 8 segundos.',dur:8,
  ok:e=>e.s.filter(v=>v>=35).length>=6},
 {id:'firme',t:'Ritmo Firme',d:'Mantenha a velocidade estável, com variação de no máximo 2 km/h, por 20 segundos.',dur:20,
  ok:e=>{const mx=Math.max(...e.s),mn=Math.min(...e.s);return mn>=8&&mx-mn<=2}}
];
/* Quantidade de eventos proporcional ao circuito (~1 a cada 3 km, entre 2 e 8), espaçados ao longo do percurso */
function planEvents(r){const n=Math.min(8,Math.max(2,Math.round(r.dist/3))),out=[];
  for(let t=0;out.length<n&&t<500;t++){const f=.1+Math.random()*.8;
    if(out.every(x=>Math.abs(x.f-f)>=.06))out.push({f,ev:EVENTS[Math.floor(Math.random()*EVENTS.length)].id,st:'todo'})}
  return out.sort((a,b)=>a.f-b.f)}
function ensureEvs(){const w=S.wo,r=route();if(r&&!w.evs.length)w.evs=planEvents(r)}
function evShow(h){const el=$('#evt');if(!el)return;el.innerHTML=h||'';el.style.display=h?'block':'none'}
const evBox=(t,body)=>`<div class="bodyin mx-auto rounded-2xl border border-neon/40 bg-panel/90 backdrop-blur-sm p-3 text-center shadow-[0_8px_30px_rgba(0,0,0,.6)]"><div class="text-[10px] uppercase tracking-widest text-neon">${t}</div>${body}</div>`;
/* soma moedas e XP do treino (no modo Horda valem ×ECO.hordaMul); o saldo do perfil só é creditado ao encerrar (finish) */
function addGain(c,x){const w=S.wo,m=w.mode==='horda'?ECO.hordaMul:1;c=Math.round(c*m);x=Math.round(x*m);if(c<=0&&x<=0)return;w.coins+=c;w.xp+=x;
  set('m-pts',w.coins.toLocaleString('pt-BR'));const f=$('#m-ptsfl');if(f){f.textContent='+'+c+(x?' · +'+x+' XP':'');f.style.opacity=1;clearTimeout(f._t);f._t=setTimeout(()=>f.style.opacity=0,1400)}}
/* ganho de altimetria (m) do km k da rota, a partir do perfil de elevação */
function gainKm(r,k){const e=r.elev,n=e.length-1;if(n<1)return 0;const i0=Math.round((k-1)/r.dist*n),i1=Math.min(n,Math.round(k/r.dist*n));let g=0;for(let i=i0+1;i<=i1;i++)if(e[i]>e[i-1])g+=e[i]-e[i-1];return g}
function kmSync(){const w=S.wo,r=route();while(w.kmAw<Math.floor(w.dist+1e-9)){w.kmAw++;const g=r?gainKm(r,w.kmAw):0;addGain(ECO.coinKm+g*ECO.coinGain,ECO.xpKm+g*ECO.xpGain)}}
/* Chamado a cada segundo com o treino em andamento */
function evTick(){const w=S.wo,r=route();if(!r||!w.running||w.arming)return;
  const L=live();w.spdH.push(L.spd);if(w.spdH.length>8)w.spdH.shift();
  kmSync();
  if(w.secs-(w.trLast||0)>=5){w.trace.push([Math.round(w.secs),+w.dist.toFixed(3)]);w.trLast=w.secs}   /* rastro (tempo, distância) para o ghost */
  if(w.mode==='horda')return;                                                                              /* sem eventos aleatórios na Fuga da Horda */
  if(!w.evCur){
    /* só dispara após 5 min, com o ciclista pedalando e no ponto sorteado */
    const nx=w.evs.find(x=>x.st==='todo');
    if(!nx||w.secs<300||w.dist/r.dist<nx.f||L.spd<10)return;
    const def=EVENTS.find(x=>x.id===nx.ev),h=w.spdH.slice(-5),base=h.reduce((a,b)=>a+b,0)/h.length;
    nx.st='on';w.evCur={id:nx.ev,idx:w.evs.indexOf(nx),k:0,base,s:[],c:[]};
    evShow(evBox('Evento · '+def.t,`<div class="text-sm text-zinc-200 mt-1">${def.d}</div><div class="text-xs text-zinc-500 mt-1">Prepare-se</div>`));
    return}
  const e=w.evCur,def=EVENTS.find(x=>x.id===e.id);e.k++;
  if(e.k===1)return;
  if(e.k<=4){evShow(evBox('Evento · '+def.t,`<div class="font-display text-7xl font-extrabold text-white leading-none my-2">${5-e.k}</div>`));return}
  if(e.k===5)evShow(evBox('Evento · '+def.t,`<div class="font-display text-6xl font-extrabold text-ember leading-none my-2">GO!</div>`));
  e.s.push(L.spd);e.c.push(L.cad);
  if(e.s.length>=def.dur){
    const won=def.ok(e);w.evs[e.idx].st=won?'won':'lost';w.evTot++;
    if(won){w.evOk++;addGain(ECO.coinEvt,ECO.xpEvt)}
    w.evCur=null;
    evShow(evBox('Evento · '+def.t,`<div class="font-display text-3xl font-extrabold ${won?'text-emerald-300':'text-zinc-300'} my-1">${won?'Conquistado! +'+ECO.coinEvt+' moedas':'Não dessa vez'}</div>`));
    setTimeout(()=>{if(!S.wo.evCur)evShow('')},2000);return}
  if(e.k>5)evShow(`<div class="mx-auto w-fit rounded-full bg-panel/80 border border-ember/50 px-3 py-1 text-xs font-semibold text-ember">${def.t} · ${def.dur-e.s.length}s</div>`)}

/* ---------- Sensores ---------- */
function live(){if(S.sim.on)return{spd:S.sim.spd,cad:S.sim.cad,hr:S.sim.hr};
  const s=S.sensor,now=Date.now(),okC=now-s.ts<4000,okH=now-s.th<5000;return{spd:okC?s.spd:0,cad:okC?s.cad:0,hr:okH?s.hr:0}}
function parseHR(v){const f=v.getUint8(0);S.sensor.hr=f&1?v.getUint16(1,true):v.getUint8(1);S.sensor.th=Date.now();fastUpd('hr')}
/* FTMS - Indoor Bike Data (0x2AD2): velocidade, cadência, potência e FC numa característica só */
function parseFTMS(v){
  const f=v.getUint16(0,true);let o=2;
  const u16=()=>{const x=v.getUint16(o,true);o+=2;return x},s16=()=>{const x=v.getInt16(o,true);o+=2;return x};
  if(!(f&1)){S.sensor.spd=u16()*0.01}        /* bit0=0: velocidade instantânea (0,01 km/h) */
  if(f&2)o+=2;                                /* velocidade média */
  if(f&4){S.sensor.cad=u16()*0.5}             /* cadência instantânea (0,5 rpm) */
  if(f&8)o+=2;                                /* cadência média */
  if(f&16)o+=3;                               /* distância total (uint24) */
  if(f&32)o+=2;                               /* nível de resistência */
  if(f&64){S.sensor.pw=s16()}                 /* potência instantânea (W) */
  if(f&128)o+=2;                              /* potência média */
  if(f&256)o+=5;                              /* energia gasta (2+2+1) */
  if(f&512){const hr=v.getUint8(o);o+=1;if(hr>0){S.sensor.hr=hr;S.sensor.th=Date.now()}}
  S.sensor.ts=Date.now();fastUpd('ftms')}
let prevCsc=null;
function parseCSC(v){const f=v.getUint8(0);let o=1,cur={};
  if(f&1){cur.wr=v.getUint32(o,true);cur.wt=v.getUint16(o+4,true);o+=6}
  if(f&2){cur.cr=v.getUint16(o,true);cur.ct=v.getUint16(o+2,true)}
  if(prevCsc){
    if(cur.wr!=null&&prevCsc.wr!=null){const dr=cur.wr-prevCsc.wr,dt=((cur.wt-prevCsc.wt+65536)%65536)/1024;
      if(dt>0)S.sensor.spd=dr*2.096/dt*3.6;else if(Date.now()-S.sensor.ts>2000)S.sensor.spd=0}
    if(cur.cr!=null&&prevCsc.cr!=null){const dr=(cur.cr-prevCsc.cr+65536)%65536,dt=((cur.ct-prevCsc.ct+65536)%65536)/1024;
      if(dt>0)S.sensor.cad=dr/dt*60}}
  prevCsc=cur;S.sensor.ts=Date.now();fastUpd('csc')}
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const BT_MSG=IOS?'No iPhone/iPad, Safari e Chrome não têm Bluetooth: abra este endereço no navegador Bluefy.':'Web Bluetooth não está disponível neste navegador (use Chrome/Edge em HTTPS ou localhost).';
const devs={},rec={},BT_CFG={hr:['heart_rate','heart_rate_measurement'],csc:['cycling_speed_and_cadence','csc_measurement'],ftms:[0x1826,0x2AD2]};
const BT_H={hr:e=>parseHR(e.target.value),csc:e=>parseCSC(e.target.value),ftms:e=>parseFTMS(e.target.value)}; /* referência fixa: evita ouvintes duplicados ao reconectar */
async function attach(kind,dev){const [svc,ch]=BT_CFG[kind];
  const srv=await dev.gatt.connect(),sv=await srv.getPrimaryService(svc),c=await sv.getCharacteristic(ch);
  c.addEventListener('characteristicvaluechanged',BT_H[kind]);await c.startNotifications();
  if(kind==='csc')prevCsc=null;S.bt[kind]=dev.name||'Sensor'}
async function reconnect(kind,n=0){const dev=devs[kind];
  if(!dev||S.bt[kind]){rec[kind]=false;return}
  if(n===0&&rec[kind])return;rec[kind]=true;
  try{await attach(kind,dev);rec[kind]=false;render();toast('Sensor reconectado: '+S.bt[kind])}
  catch(e){if(n>=7){rec[kind]=false;return}setTimeout(()=>reconnect(kind,n+1),Math.min(2000*(n+1),8000))}}
/* Tela ligada durante o treino (Wake Lock; no iOS exige 16.4+) */
let wake=null;
async function wakeOn(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}
function wakeOff(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener('visibilitychange',()=>{S.wo.last=Date.now();
  if(document.visibilityState==='visible'){if(S.wo.running)wakeOn();['hr','csc','ftms'].forEach(k=>{if(devs[k]&&!S.bt[k])reconnect(k)})}});
async function pair(kind,all){
  if(!navigator.bluetooth){toast(BT_MSG);return}
  if(!window.isSecureContext){toast('Bluetooth exige HTTPS ou localhost. Abra por um endereço https://');return}
  const svc=BT_CFG[kind][0];
  toast('Procurando sensores... selecione o dispositivo na janela');
  try{
    /* all=true: lista todos os dispositivos BLE (útil quando o sensor não anuncia o serviço) */
    const opts=all?{acceptAllDevices:true,optionalServices:[svc]}:{filters:[{services:[svc]}]};
    const dev=await navigator.bluetooth.requestDevice(opts);
    const old=devs[kind];devs[kind]=dev;if(old&&old!==dev){try{old.gatt.disconnect()}catch(_){}}
    dev.addEventListener('gattserverdisconnected',()=>{if(devs[kind]!==dev)return;S.bt[kind]=null;if(kind==='csc')prevCsc=null;render();setTimeout(()=>reconnect(kind),1500)});
    toast('Conectando a '+(dev.name||'sensor')+'...');
    await attach(kind,dev);
    S.sim.on=false;render();toast('Sensor conectado: '+S.bt[kind])}
  catch(e){
    if(e.name==='NotFoundError')toast('Nenhum sensor selecionado. Acorde o sensor (gire a pedivela / ponha a cinta) e tente de novo, ou use "Mostrar todos".');
    else if(e.name==='SecurityError')toast('Bluetooth bloqueado aqui (página dentro de iframe ou sem permissão). Abra a página direto no Chrome.');
    else toast('Falha ao conectar: '+(e.message||e.name))}}
function toggleSim(){S.sim.on=!S.sim.on;render()}
function setSim(k,v){S.sim[k]=+v;const el=$('#sv-'+k);if(el)el.textContent=v;updLive();updHome()}

/* ---------- Ghost Run ----------
   O ghost corre o melhor tempo prévio (seu ou do líder do ranking) na mesma pista e no mesmo modo de inclinação. Usa o rastro
   (tempo, distância) gravado no treino; treinos antigos, sem rastro, caem num ritmo constante com o tempo total. */
S.ghost=load('cad_ghost','me');
function bestRun(r,p,m=S.inten){const l=((p&&p.history)||[]).filter(h=>h.routeId===r.id&&h.done&&(h.mode||'normal')==='normal'&&(h.inten||'off')===m);return l.length?l.reduce((a,b)=>b.time<a.time?b:a):null}
function ghostFor(r){if(!r||S.ghost==='off')return null;let p=profile(),src='me';
  if(S.ghost==='leader'&&lvInfo(G().xp).l>=FEAT.ghostLider){const b=board(r)[0],lp=b&&S.profiles.find(x=>x.id===b.pid);if(lp){p=lp;src='leader'}}
  const run=bestRun(r,p);if(!run)return null;
  return{src,name:p.name,me:p.id===S.cur,total:run.time,tr:run.trace&&run.trace.length>1?run.trace:null}}
function setGhost(v){if(woBusy())return;if(v==='leader'&&lvInfo(G().xp).l<FEAT.ghostLider){toast('Ghost do líder desbloqueia no nível '+FEAT.ghostLider);render();return}S.ghost=v;store('cad_ghost',v);render()}
function ghDist(gh,t,r){if(!gh)return 0;if(t>=gh.total)return r.dist;const tr=gh.tr;if(!tr)return r.dist*t/gh.total;
  for(let i=1;i<tr.length;i++)if(t<=tr[i][0]){const a=tr[i-1],b=tr[i],f=b[0]>a[0]?(t-a[0])/(b[0]-a[0]):1;return a[1]+(b[1]-a[1])*f}return tr[tr.length-1][1]}
function ghTime(gh,d,r){if(!gh)return 0;const tr=gh.tr;if(!tr)return gh.total*Math.min(1,d/r.dist);
  for(let i=1;i<tr.length;i++)if(d<=tr[i][1]){const a=tr[i-1],b=tr[i],f=b[1]>a[1]?(d-a[1])/(b[1]-a[1]):1;return a[0]+(b[0]-a[0])*f}return gh.total}

/* ---------- Modo "Fuga da Horda" ----------
   Depois de HORDA.delay s pedalando, um zumbi sai da largada e avança linearmente pelo GPX, cada vez mais rápido. O ciclista precisa
   manter distância; se o zumbi o alcançar, o modo termina (o treino é salvo). Chegar ao fim da rota = escapou. */
function hordaCard(){const lv=lvInfo(G().xp).l,ok=lv>=FEAT.horda;
  return `<section class="rounded-2xl border p-3 flex items-center gap-3 shrink-0" style="border-color:#3d6b34;background:linear-gradient(135deg,#0e1d10,#080f17)"><svg viewBox="-46 -46 92 92" class="w-14 h-14 shrink-0" aria-hidden="true">${zombieG(0,0,32)}</svg>
   <div class="min-w-0 flex-1"><h3 class="font-display text-xl font-bold leading-none" style="color:#9be58a">Fuga da Horda</h3><p class="text-xs text-zinc-400 mt-1">Um zumbi vai atrás de você pela pista. Mantenha o ritmo e não deixe ele te alcançar. Moedas e XP ×${ECO.hordaMul}.</p></div>
   ${ok?`<button onclick="startHorda()" class="shrink-0 px-3 py-2 rounded-lg font-semibold text-sm flex items-center gap-1.5" style="background:#2f7a2a;color:#fff"><i data-lucide="skull" class="w-4 h-4"></i>Fugir</button>`:`<div class="shrink-0 text-xs text-zinc-500 flex items-center gap-1"><i data-lucide="lock" class="w-3.5 h-3.5"></i>Nível ${FEAT.horda}</div>`}</section>`}
function startHorda(){if(lvInfo(G().xp).l<FEAT.horda){toast('Fuga da Horda desbloqueia no nível '+FEAT.horda);return}
  const w=S.wo;if(w.dist>0||w.running||cdBusy){toast('Já há um treino em andamento');setTab('treino');return}
  const id=(S.rec&&S.rec.order[S.rec.i])||(S.routes[0]&&S.routes[0].id);if(!id)return;
  w.route=id;w.mode='horda';w.hz={mv:0,rel:false,z:0,t:0,sp:0};S.tab='treino';render();startCountdown()}
/* chamado pelo advance() a cada passo: acorda o zumbi, move e verifica a captura (devolve true se foi alcançado) */
function hordaStep(m,L,r){const w=S.wo,z=w.hz;if(!z)return false;
  if(!z.rel){if(L.spd>3)z.mv=(z.mv||0)+m;if(z.mv>=HORDA.delay){z.rel=true;z.z=0;z.t=0;toast('O zumbi acordou! Mantenha o ritmo')}return false}
  z.t+=m;z.sp=Math.min(HORDA.vMax,HORDA.v0+HORDA.vInc*z.t/60);z.z+=z.sp/3600*m;
  return z.z>=w.dist-HORDA.catchKm}
function hordaOver(){finish(false)}
function hordaModal(r){const lvl=r.lv1>r.lv0?`<div class="text-emerald-300 text-sm mb-3">Subiu para o nível ${r.lv1}!${unlocksAt(r.lv1).length?' Liberado: '+unlocksAt(r.lv1).map(esc).join(', ')+'.':''}</div>`:'';
  openModal(`<div class="text-center py-2"><svg viewBox="-46 -46 92 92" class="mx-auto w-24 h-24" aria-hidden="true">${zombieG(0,0,32)}</svg><h2 class="font-display text-4xl font-bold mt-2 ${r.done?'text-emerald-300':'text-ember'}">${r.done?'Você escapou!':'A horda te alcançou!'}</h2>
   <p class="text-zinc-300 text-sm mt-1">${r.done?'Você chegou ao fim da rota antes do zumbi.':'O zumbi alcançou você antes do fim da rota.'}</p>
   <div class="grid grid-cols-3 gap-2 my-4 text-center">${[['Distância',r.dist.toFixed(2)+' km'],['Tempo',fmt(r.time)],['Recompensa','+'+r.coins.toLocaleString('pt-BR')]].map(x=>`<div class="rounded-lg bg-ink border border-line p-2"><div class="text-[11px] text-zinc-400">${x[0]}</div><div class="font-display text-xl font-bold text-neon">${x[1]}</div></div>`).join('')}</div>
   <div class="text-xs text-zinc-400 mb-3">+${r.xp.toLocaleString('pt-BR')} XP · moedas de engrenagem</div>${lvl}<button onclick="closeModal()" class="w-full py-3 rounded-xl bg-brand text-white font-semibold">Continuar</button></div>`,'max-w-sm')}
/* chips de status do modo (ghost / horda): atualizados junto com os números */
function updMode(){const w=S.wo,r=route();if(!r)return;
  const gl=document.getElementById('m-gh');
  if(gl&&w.gh){const gap=w.secs-ghTime(w.gh,w.dist,r),ah=gap<=0;gl.textContent=(ah?'−':'+')+fmt(Math.abs(gap));gl.parentElement.className='flex items-center gap-1 text-[11px] font-semibold shrink-0 '+(ah?'text-emerald-300':'text-ember')}
  const hb=document.getElementById('m-hzbox'),hz=document.getElementById('m-hz'),ci=document.getElementById('circ');
  if(hb&&hz&&w.mode==='horda'&&w.hz){const z=w.hz;let txt,cls='text-zinc-300',al=false;
    if(!z.rel)txt=z.mv>0?Math.max(0,Math.ceil(HORDA.delay-z.mv))+' s':'--';
    else{const mt=Math.max(0,(w.dist-z.z)*1000);txt=Math.round(mt)+' m';cls=mt>150?'text-emerald-300':mt>60?'text-ember':'text-red-400';al=mt<=60}
    hz.textContent=txt;hb.className='flex items-center gap-1.5 w-fit font-display text-base font-bold tabular-nums '+cls;set('m-hzs',z.rel?'zumbi '+z.sp.toFixed(1)+' km/h':'zumbi dorme');if(ci)ci.classList.toggle('hz-alert',al)}}

/* ---------- Treino ---------- */
/* Home: leituras ao vivo; "-" enquanto a bike não está conectada */
function hmVal(k){if(!(S.sim.on||S.bt.ftms))return '-';const L=live();
  if(k==='spd')return L.spd.toFixed(1);if(k==='cad')return String(Math.round(L.cad));return L.hr?String(Math.round(L.hr)):'-'}
function updHome(){['spd','cad','hr'].forEach(k=>set('hm-'+k,hmVal(k)))}

/* Iniciar: contagem 3-2-1. Uma cortina escura faz fade-in durante o "3" (a troca de layout do mapa acontece com a tela coberta)

var cdBusy=false,cdCancel=false;
function startCountdown(){if(cdBusy)return;cdBusy=true;cdCancel=false;const w=S.wo;
  if(!document.getElementById('cd-style')){const st=document.createElement('style');st.id='cd-style';st.textContent='@keyframes cdpop{0%{opacity:0;transform:scale(1.7)}30%{opacity:1}100%{opacity:1;transform:scale(1)}}';document.head.appendChild(st)}
  const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;z-index:9998;background:#05090f;opacity:0;touch-action:none';
  const num=document.createElement('div');num.className='font-display';num.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;pointer-events:none;font-weight:800;font-size:10rem;line-height:1;color:#fff;text-shadow:0 4px 28px rgba(0,0,0,.65),0 0 40px rgba(106,195,255,.45)';
  document.body.append(ov,num);
  const show=n=>{num.textContent=n;num.style.animation='none';void num.offsetWidth;num.style.animation='cdpop .9s ease-out both'};

  /* tempos (ms): STEP = intervalo entre os números; tIn = fade-in; tFade = fade-out.

  const done=auto||w.dist>=r.dist*.99,prevBest=userBest(r),avg=w.dist/(w.secs/3600),horda=w.mode==='horda';

/* ---------- Importação GPX ---------- */
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);
  const q=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function parseGPX(txt,fallbackName){
  const d=new DOMParser().parseFromString(txt,'application/xml');
  if(d.querySelector('parsererror'))throw new Error('O arquivo não é um XML válido.');
  let pts=[...d.getElementsByTagName('trkpt')];if(pts.length<2)pts=[...d.getElementsByTagName('rtept')];
  if(pts.length<2)throw new Error('Nenhum ponto de trilha (trkpt) encontrado no arquivo.');
  let dist=0,prev=null;const cum=[],ele=[],xy=[];
  const lat0=+pts[0].getAttribute('lat'),lon0=+pts[0].getAttribute('lon'),kx=Math.cos(lat0*Math.PI/180)*111.32;
  pts.forEach(p=>{const c=[+p.getAttribute('lat'),+p.getAttribute('lon')];if(prev)dist+=hav(prev,c);prev=c;cum.push(dist);
    xy.push([(c[1]-lon0)*kx,-(c[0]-lat0)*110.57]);
    const e=p.getElementsByTagName('ele')[0];ele.push(e?parseFloat(e.textContent):NaN)});
  const rs=[];{let j=0;for(let i=0;i<240;i++){const tg=dist*i/239;while(j<cum.length-1&&cum[j]<tg)j++;
    const a=Math.max(j-1,0),sp=cum[j]-cum[a],t=sp>0?Math.min(1,Math.max(0,(tg-cum[a])/sp)):0;
    rs.push([xy[a][0]+(xy[j][0]-xy[a][0])*t,xy[a][1]+(xy[j][1]-xy[a][1])*t])}}
  const track=normTrack(rs);
  const valid=ele.filter(v=>!isNaN(v)).length;let elev,simElevated=false;
  if(valid>=pts.length*.5&&dist>0){elev=[];let j=0,last=ele.find(v=>!isNaN(v));
    for(let i=0;i<60;i++){const tg=dist*i/59;while(j<cum.length-1&&cum[j]<tg)j++;if(!isNaN(ele[j]))last=ele[j];elev.push(Math.round(last))}
    elev=elev.map((v,i,a)=>{const s=a.slice(Math.max(0,i-2),i+3);return Math.round(s.reduce((x,y)=>x+y,0)/s.length)})}
  else{elev=simElev(fallbackName+dist);simElevated=true}
  const nm=(d.querySelector('trk > name')||d.querySelector('metadata > name')||d.querySelector('name'));
  const ds=d.querySelector('trk > desc')||d.querySelector('metadata > desc');
  return{id:uid(),name:((nm&&nm.textContent)||fallbackName).trim(),desc:((ds&&ds.textContent)||'').trim(),photo:'',dist:+dist.toFixed(2),elev,track,simElev:simElevated,points:pts.length}}
$('#gpxFile').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{const r=parseGPX(await f.text(),f.name.replace(/\.gpx$/i,''));S.edit=r;editRoute(r.id,true);toast(r.points+' pontos lidos · '+r.dist+' km')}
  catch(e){toast('Erro ao importar: '+e.message)}});

function restoreWo(remote){let sv=load('cad_wo',null);
  if(remote&&(!sv||(remote.saved||0)>(sv.saved||0)))sv=remote; /* usa o mais recente entre este aparelho e o Supabase */
  if(sv&&sv.profile===S.cur&&profile()&&sv.dist>0&&S.routes.some(r=>r.id===sv.route)&&Date.now()-sv.saved<43200000){
    sv={...sv};delete sv.profile;delete sv.saved;if(sv.coins==null&&sv.pts!=null){sv.coins=sv.pts;sv.xp=Math.round(sv.pts*1.5)}delete sv.pts;if(!Array.isArray(sv.trace))sv.trace=[];
    const hadGh=!!(sv.gh&&sv.gh.re);if(hadGh)sv.gh=null;
    Object.assign(S.wo,sv,{running:false,last:Date.now()});if(hadGh){const rr=S.routes.find(x=>x.id===S.wo.route);S.wo.gh=rr?ghostFor(rr):null}S.wo.evCur=null;S.wo.evs.forEach(x=>{if(x.st==='on')x.st='lost'});S.tab='treino';
    setTimeout(()=>toast('Treino anterior restaurado. Reconecte os sensores e toque em Retomar'),400)}}
/* Ao abrir o app sempre vai para a seleção de perfil; o último perfil só é usado para carregar os dados */
let bootRemote;
async function boot(){
  if(!sb){bootRemote=null;applyInten();render();return}
  $('#app').innerHTML='<main class="min-h-screen grid place-items-center text-zinc-400">Carregando dados…</main>';
  S.cur=S.lastCur;let remote=null;
  try{await flush();if(outbox.length)throw new Error('pendente');remote=await pull();setSync('ok')}
  catch(e){console.error(e);setSync('err');toast('Sem conexão com o Supabase: usando os dados salvos neste aparelho')}
  S.cur=null;bootRemote=remote;applyInten();render()}
boot();
</script>
