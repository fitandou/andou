<style>
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;overscroll-behavior-x:none;overscroll-behavior-y:none;color-scheme:dark;background:#000}
body{background:#000;color:#e6f1fb;font-family:Figtree,system-ui,sans-serif;overscroll-behavior-y:none;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
button,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* iOS dá zoom ao focar campos com fonte < 16px */
@supports(-webkit-touch-callout:none){input:not([type=range]),select,textarea{font-size:16px!important}}
/* altura dinâmica (barra do Safari/Bluefy); ignorado onde dvh não existe */
.min-h-screen{min-height:100dvh!important}
.font-display{letter-spacing:0;font-stretch:78%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #6ac3ff;outline-offset:2px}
input[type=range]{accent-color:#0a78d2;width:100%}
#toast{transition:opacity .25s}
/* rolagem interna da Home/Treino sem barra visível (a barra ocupava largura e descentralizava o conteúdo) */
.hm-scroll{scrollbar-width:none;-ms-overflow-style:none}.hm-scroll::-webkit-scrollbar{display:none}
@supports not (scrollbar-gutter:stable){html{overflow-y:scroll}}
/* mobile vertical: colunas viram "contents" para reordenar os blocos da aba Treino numa única coluna */
@media(max-width:1023px){.tr-cols{display:contents!important}}
@media(max-width:639px){.tabbtn{flex:1 1 0;justify-content:center;padding-left:.25rem!important;padding-right:.25rem!important}.tabbtn:not(.on) .lbl{display:none}.tabbtn.on{flex:2.2 1 0}}
.hz-alert{box-shadow:0 0 0 2px #ff4d4d,0 0 20px rgba(255,77,77,.55)!important;animation:hzp .8s ease-in-out infinite alternate}@keyframes hzp{to{box-shadow:0 0 0 2px #ff4d4d,0 0 4px rgba(255,77,77,.2)}}
/* eventos: fundo escurecido, carimbo (CONCLUÍDO/FRACASSOU) e impacto do card */
@keyframes evfade{from{opacity:0}to{opacity:1}}.ev-dim{animation:evfade .3s ease-out}
.ev-stamp{position:absolute;left:50%;top:44%;white-space:nowrap;font-weight:800;font-size:2.7rem;line-height:1;letter-spacing:.06em;text-transform:uppercase;padding:.16em .45em;border:.2em solid currentColor;border-radius:.35em;background:rgba(0,0,0,.4);text-shadow:0 0 16px currentColor;box-shadow:0 0 26px currentColor,inset 0 0 10px rgba(255,255,255,.08);animation:evstamp .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes evstamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(3.2)}55%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(.88)}78%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
@keyframes evhit{0%,100%{transform:none}35%{transform:translateY(6px) scale(.985)}65%{transform:translateY(-2px)}}.ev-hit{animation:evhit .3s .28s ease-out}
@media(prefers-reduced-motion:reduce){.ev-stamp,.ev-hit,.ev-dim{animation-duration:.01s!important;animation-delay:0s!important}}
/* pop-up de vibração (Admin) */
.hap-pop{display:flex;gap:.6rem;align-items:center;background:#080f17;border:1px solid rgba(255,161,61,.6);border-radius:.9rem;padding:.55rem .75rem;box-shadow:0 8px 28px rgba(0,0,0,.6);transition:opacity .3s,transform .3s;animation:happin .25s ease-out}
.hap-ic{font-size:1.5rem;display:inline-block;animation:hapshake .45s ease-in-out 2}
@keyframes happin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes hapshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
@keyframes recfill{to{stroke-dashoffset:0}}
@keyframes recTxtR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes recTxtL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes bodyin{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}.bodyin{animation:bodyin .5s ease-out}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
main{touch-action:pan-y pinch-zoom}
/* molduras de perfil: .fr = aro (clipado em círculo) · .frb = camada de fundo · .fri = miolo com o avatar */
.fr{position:relative;display:inline-block;flex-shrink:0;border-radius:50%;overflow:hidden;isolation:isolate;vertical-align:middle}
.frb{position:absolute;inset:0;z-index:0}
.fri{position:absolute;z-index:1;border-radius:50%;overflow:hidden;background:#000}
.fr-madeira .frb{background:repeating-linear-gradient(95deg,rgba(0,0,0,.35) 0 2px,transparent 2px 7px),repeating-linear-gradient(88deg,rgba(255,170,120,.10) 0 1px,transparent 1px 11px),linear-gradient(135deg,#5a2418,#3b160f 40%,#6b2f1f 70%,#33120c)}
.fr-bronze .frb{background:linear-gradient(135deg,#6b3f17,#cd7f32 25%,#f0b070 42%,#a8642a 62%,#5e3512 82%,#cd7f32)}
.fr-prata .frb{background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(135deg,#8a9096,#6c7278 45%,#979da3 70%,#767c82)}
.fr-fibra .frb{background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%,rgba(255,255,255,.08) 70%,transparent),repeating-linear-gradient(45deg,#0c0c0c 0 2px,#2a2a2a 2px 4px),repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 2px,transparent 2px 4px);background-color:#111}
.fr-ouro .frb{background:linear-gradient(135deg,#7a5200,#ffd95a 25%,#fff3b0 40%,#d89b12 60%,#8a5a00 80%,#ffd95a)}
.fr-platina .frb{background:linear-gradient(135deg,#dfe8f0,#a9bccd 22%,#f8fbff 44%,#93a8bd 66%,#d3e0ec 86%,#f4f8fc)}
.fr-diamante{animation:frdiam 2.2s ease-in-out infinite alternate}
.fr-diamante .frb{background:conic-gradient(from 20deg,#3aa6ff,#8ccdff,#1f86f0,#8ccdff,#2f9bff,#a9d8ff,#1479e6,#8ccdff,#3aa6ff)}
.fr-diamante .frb::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 36%,rgba(170,220,255,.8) 50%,transparent 64%);background-size:260% 100%;animation:frshine 2.2s ease-in-out infinite}
.fr-led-rgb{--gc:rgba(255,255,255,.7)}
.fr-led-rgb .frb{inset:-50%;background:conic-gradient(#ff2a2a,#ffd02a,#2aff5c,#2af0ff,#2a5cff,#d02aff,#ff2a2a);animation:frspin 1.1s linear infinite}
.fr-led-chase{--gc:rgba(0,255,157,.9)}
.fr-led-chase .frb{inset:-50%;background:repeating-conic-gradient(#00ff9d 0 9deg,#04241a 9deg 30deg);animation:frspin 1.3s steps(48) infinite}
.fr-chamas{color:#ff6a00;animation:frflame 1.3s ease-in-out infinite alternate}
.fr-chamas .frb{inset:-50%;background:conic-gradient(#ff2d00,#ffb300,#ff5a00,#ffe066,#ff2d00,#ff8800,#ffe066,#ff2d00);animation:frspin .9s linear infinite,frflick .25s steps(2) infinite alternate}
@keyframes frdiam{from{box-shadow:0 0 4px rgba(50,150,255,.6)}to{box-shadow:0 0 8px rgba(70,165,255,.8),0 0 14px rgba(40,140,255,.45)}}
@keyframes frspin{to{transform:rotate(360deg)}}
@keyframes frshine{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes frflame{from{box-shadow:0 0 5px rgba(255,106,0,.55),0 -2px 10px rgba(255,61,0,.35)}to{box-shadow:0 0 9px rgba(255,160,0,.65),0 -5px 15px rgba(255,90,0,.4)}}
@keyframes frflick{from{filter:brightness(1) saturate(1)}to{filter:brightness(1.25) saturate(1.15)}}
/* glow fixo de base (aparece mesmo se o aparelho estiver com 'reduzir movimento'); a animação abaixo só o faz pulsar */
.fr{box-shadow:0 0 6px var(--gc,rgba(255,255,255,.45))}
.fr-diamante{box-shadow:0 0 6px rgba(50,150,255,.65)}
.fr-chamas{box-shadow:0 0 6px rgba(255,106,0,.55),0 -2px 11px rgba(255,61,0,.35)}
.mas:not(.mas-vazio){box-shadow:0 0 6px color-mix(in srgb,var(--rc) 50%,transparent)}
/* glow pulsante (cor própria de cada moldura em --gc) */
.fr-madeira,.fr-bronze,.fr-prata,.fr-fibra,.fr-ouro,.fr-platina,.fr-led-rgb,.fr-led-chase{animation:frpulse 2.2s ease-in-out infinite alternate}
@keyframes frpulse{from{box-shadow:0 0 5px var(--gc)}to{box-shadow:0 0 8px var(--gc),0 0 14px color-mix(in srgb,var(--gc) 45%,transparent)}}
/* brilho giratório que percorre o aro de TODAS as molduras (o miolo .fri fica por cima, então só o aro brilha) */
.fr::after{content:"";position:absolute;inset:-50%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 32%,var(--sc,rgba(255,255,255,1)) 78%,var(--sc,rgba(255,255,255,1)) 88%,transparent 96% 100%);animation:frspin var(--sd,3.4s) linear infinite}
.fr-madeira{--sc:rgba(255,200,140,.55);--sd:1.4s;--gc:rgba(130,55,30,.6)}.fr-bronze{--sc:rgba(255,235,190,.9);--sd:1.2s;--gc:rgba(240,150,70,.9)}.fr-prata{--sc:rgba(205,210,215,.5);--sd:1.1s;--gc:rgba(140,146,152,.45)}
.fr-fibra{--sc:rgba(255,255,255,.8);--sd:1.3s;--gc:rgba(190,200,210,.65)}.fr-ouro{--sc:rgba(255,252,210,1);--sd:1s;--gc:rgba(255,205,60,.95)}.fr-platina{--sc:rgba(255,255,255,1);--sd:1.05s;--gc:rgba(190,225,255,.95)}.fr-diamante{--sc:rgba(190,230,255,.9);--sd:.75s}
.fr-led-rgb::after,.fr-led-chase::after,.fr-chamas::after{display:none}
/* ciclista no mapa do treino: camada HTML fixa (não é recriada a cada segundo, então a moldura e o aro do mascote não reiniciam) */
.rdr{position:absolute;left:0;top:0;width:0;height:0;z-index:2;pointer-events:none;will-change:transform}
.rdr-in{position:absolute;left:0;top:0;width:40px;height:40px;transform:translate(-50%,-50%)}
.rdr-av{position:absolute;inset:0;border-radius:50%;background:#080f17;box-shadow:0 0 0 2px #fff,0 0 0 9px rgba(255,255,255,.25)}
.rdr-gh .rdr-in{width:34px;height:34px}.rdr-gh .rdr-av{box-shadow:0 0 0 2px #9fd9ff,0 0 0 7px rgba(159,217,255,.16)}
.rdr-pet{position:absolute;right:-24px;bottom:-22px;z-index:3;border-radius:50%;box-shadow:0 0 0 2px #06101a}
.rdr-pet .mas{box-shadow:none}
.mat{display:flex;align-items:center;gap:5px;font:600 12px/1.15 Archivo,sans-serif;color:#e8f6ff;white-space:nowrap}
.mat.off{opacity:.38}.mat.off .val{color:#9ca3af}.mat-lg{margin-top:4px;font:500 9px/1 Archivo,sans-serif;color:#9ca3af}
.mat .val{margin-left:auto;padding-left:8px;font-weight:800;color:#6ee7b7}
.mat-box{background:rgba(6,16,26,.88);border:1px solid rgba(52,211,153,.65);border-radius:10px;padding:5px 8px 6px;box-shadow:0 0 12px rgba(52,211,153,.28);max-width:min(54%,210px)}
.mat-h{font:700 10px/1 Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6ee7b7;margin-bottom:4px;display:flex;align-items:center;gap:4px}

/* mascote (subperfil): avatar redondo com aro da cor da raridade; o emoji ocupa quase todo o círculo, sem cortar o animal */
.mas{position:relative;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1d3d5e,#06101a);line-height:1;flex-shrink:0;user-select:none}
.mas .mem{display:block;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mas-vazio{border:2px dashed #2d4e73;color:#4a6d92;background:transparent}
.mas .mem-img{display:block;pointer-events:none;-webkit-user-drag:none;object-fit:contain}
/* aro do mascote: faixa de brilho que gira ao redor da borda (cor da raridade; mais raro = mais rápido) */
.mas:not(.mas-vazio)::after{content:"";position:absolute;inset:-2px;border-radius:50%;padding:2px;pointer-events:none;z-index:1;background:conic-gradient(transparent 0 48%,var(--rc,#6ac3ff) 74%,#fff 90%,transparent 97% 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:frspin var(--sd,3.6s) linear infinite}
.mas-comum{--sd:2.2s}.mas-incomum{--sd:1.9s}.mas-raro{--sd:1.6s}.mas-epico{--sd:1.3s}.mas-lendario{--sd:1.05s}.mas-mitico{--sd:.8s}
.mas-comum,.mas-incomum,.mas-raro,.mas-epico{animation:maspulse 2.4s ease-in-out infinite alternate}
@keyframes maspulse{from{box-shadow:0 0 5px color-mix(in srgb,var(--rc) 50%,transparent)}to{box-shadow:0 0 8px color-mix(in srgb,var(--rc) 70%,transparent),0 0 13px color-mix(in srgb,var(--rc) 35%,transparent)}}
.pet-card{cursor:pointer;position:relative;transition:transform .15s,border-color .15s}.pet-card:hover{transform:translateY(-2px)}.pet-card:focus-visible{outline:2px solid #6ac3ff}
@keyframes petpop{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}.pet-pop{animation:petpop .22s ease-out}
.mas-lv{z-index:2;position:absolute;left:-3px;bottom:-3px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:#0b1a2a;border:1.5px solid;font:700 11px/16px Archivo,sans-serif;text-align:center;color:#fff}
.mas-lendario{animation:masglow 2.2s ease-in-out infinite alternate}
.mas-mitico{animation:masmit 2s ease-in-out infinite alternate}
@keyframes masglow{from{box-shadow:0 0 5px rgba(255,176,32,.55)}to{box-shadow:0 0 9px rgba(255,176,32,.75),0 0 15px rgba(255,176,32,.35)}}
@keyframes masmit{from{box-shadow:0 0 5px rgba(255,77,141,.55)}to{box-shadow:0 0 10px rgba(255,77,141,.75),0 0 16px rgba(255,77,141,.35)}}

/* medalhas (conquistas) */
.medal{border-radius:50%;display:grid;place-items:center;color:#0b1a2a;flex-shrink:0;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.8),rgba(255,255,255,0) 42%),linear-gradient(145deg,var(--m1),var(--m2));box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 0 10px var(--m2)}
.medal-off{filter:grayscale(1) brightness(.42);box-shadow:none;opacity:.75}
</style>

<script>
/* SQL para rodar UMA vez no Supabase (SQL Editor) — IMC / peso:
   alter table profiles add column if not exists sex text default '';
   create table if not exists weight_log(id text primary key, profile_id text not null references profiles(id) on delete cascade, date bigint not null, weight numeric not null);
   alter table weight_log enable row level security;
   create policy "weight_log_all" on weight_log for all using (true) with check (true);   -- mesma política aberta das demais tabelas
   -- PONTUAÇÃO (rodar uma vez; sem isso o app grava os treinos sem pontos no banco):
   alter table workouts add column if not exists pts int default 0, add column if not exists ev_ok int default 0, add column if not exists ev_tot int default 0;
   -- ECONOMIA, GHOST E FUGA DA HORDA (rodar uma vez; sem isso o app funciona, mas moedas/XP e o ghost ficam só neste aparelho):
   alter table profiles add column if not exists game jsonb;   -- {coins, xp, del}
   alter table workouts add column if not exists coins int default 0, add column if not exists xp int default 0, add column if not exists trace jsonb, add column if not exists mode text default 'normal';
   -- LOJA DE PERSONALIZAÇÃO (molduras de perfil; rodar uma vez; sem isso molduras compradas/equipadas ficam só neste aparelho):
   alter table profiles add column if not exists profile_frame_id text default '', add column if not exists owned_items jsonb default '[]'::jsonb;
   -- profile_frame_id: moldura equipada ('' = nenhuma) · owned_items: ids dos cosméticos comprados, ex.: ["frame:ouro","frame:chamas"]
   -- MASCOTES (subperfil; rodar uma vez): profile_mascot_id = mascote equipado ('' = nenhum, estado inicial). Mascotes comprados vão em owned_items como "mascot:<id>".
   alter table profiles add column if not exists profile_mascot_id text default '';

/* Lê todas as linhas de uma tabela (páginas de 1000) */
async function fetchAll(tb,col,asc=true){let out=[],from=0;
  for(;;){const r=await sb.from(tb).select('*').order(col,{ascending:asc}).range(from,from+999);
    if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)return out;from+=1000}}

    S.routes.forEach(r=>q({t:'up',tb:'routes',row:rRow(r)}));

  const old={};S.profiles.forEach(p=>old[p.id]=p);

    /* pesagens que só existem neste aparelho (ex.: tabela criada depois) sobem para o banco */

function avatarRaw(p,size=48){const st=`width:${size}px;height:${size}px;font-size:${size*.45}px`;

function elevStats(e){let g=0;for(let i=1;i<e.length;i++)if(e[i]>e[i-1])g+=e[i]-e[i-1];return{gain:Math.round(g),max:Math.round(Math.max(...e)),min:Math.round(Math.min(...e))}}

  const pts=e.map((v,i)=>[i/(e.length-1)*W,H-8-(v-mn)/rg*(H-24)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  let m='';if(p!=null){const x=p*W,i=Math.min(e.length-1,Math.round(p*(e.length-1))),y=pts[i][1];
    m=`<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="#ffa13d" stroke-width="2" stroke-dasharray="4 3"/><circle cx="${x}" cy="${y}" r="6" fill="#ffa13d" stroke="#000000" stroke-width="2"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-24" preserveAspectRatio="none"><path d="${line} L${W} ${H} L0 ${H}Z" fill="#6ac3ff" fill-opacity=".14"/><path d="${line}" fill="none" stroke="#6ac3ff" stroke-width="2.5" stroke-linejoin="round"/>${m}</svg>`;}
/* ---------- Traçado do circuito ---------- */
function normTrack(pts){let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  pts.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])});
  const s=1000/Math.max(x1-x0,y1-y0,1e-9);

  const pad=mini?50:46,sw=mini?11:16,d=a=>a.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(' '),full=d(T);

    if(p>0)done=`<path d="${d([...T.slice(0,i+1),pos])}" fill="none" stroke="#ffffff" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
    const pp=profile(),x=pos[0],y=pos[1],ph=pp&&pp.photo;
    rider=`<circle cx="${x}" cy="${y}" r="44" fill="#ffffff" fill-opacity=".25"/>`+(ph
      ?`<defs><clipPath id="rc"><circle cx="${x}" cy="${y}" r="32"/></clipPath></defs><circle cx="${x}" cy="${y}" r="32" fill="#080f17"/><image href="${esc(ph)}" x="${x-32}" y="${y-32}" width="64" height="64" preserveAspectRatio="xMidYMid slice" clip-path="url(#rc)"/><circle cx="${x}" cy="${y}" r="32" fill="none" stroke="#ffffff" stroke-width="5"/><circle cx="${x}" cy="${y}" r="36" fill="none" stroke="#fff" stroke-width="2"/>`
      :`<circle cx="${x}" cy="${y}" r="32" fill="#ffa13d" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y}" dy=".35em" text-anchor="middle" font-size="34" font-weight="700" fill="#000000">${esc(((pp&&pp.name)||'🚴')[0].toUpperCase())}</text>`)}
  const road=mini?`<path d="${full}" fill="none" stroke="#6ac3ff" stroke-opacity=".75" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`
   :`<path d="${full}" fill="none" stroke="#000000" stroke-width="${sw+10}" stroke-linecap="round" stroke-linejoin="round"/><path d="${full}" fill="none" stroke="#2f6396" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const s=T[0],e=T[T.length-1],mk=(q,c)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${sw*.95}" fill="${c}" stroke="#000000" stroke-width="4"/>`;

  /* onda de energia: segue o sentido do percurso (ordem dos pontos). O SVG é redesenhado a cada tick,
     então a fase da animação vem do relógio (delay negativo) para a onda não reiniciar a cada redesenho. */
  /* só o trecho À FRENTE do ciclista (da posição atual até a chegada); a fase vem de um laço requestAnimationFrame
     (waveLoop) que mexe no stroke-dashoffset dos .ewp, então redesenhar o SVG a cada tick não reinicia a onda */

     <g class="ewh" opacity="0">${ghost}</g></g>`}

  if(!mini){const fp=loop?s:e,fx=fp[0],fy=fp[1],H=88,FW=64,FH=44,up=fy-H-6>=-pad+2,dir=fx+FW+4<=w+pad?1:-1,y0=up?fy-H:fy+H-FH,cs=FW/8,rs=FH/4;
    let ck='';for(let ro=0;ro<4;ro++)for(let c=0;c<8;c++)ck+=`<rect x="${(dir>0?fx:fx-FW)+c*cs}" y="${y0+ro*rs}" width="${cs}" height="${rs}" fill="${(ro+c)%2?'#10161f':'#ffffff'}"/>`;
    flag=`<g aria-label="Chegada"><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${up?fy-H:fy+H}" stroke="#000" stroke-width="9" stroke-linecap="round"/><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${up?fy-H:fy+H}" stroke="#e8eef5" stroke-width="5" stroke-linecap="round"/>${ck}<rect x="${dir>0?fx:fx-FW}" y="${y0}" width="${FW}" height="${FH}" fill="none" stroke="#000" stroke-width="4"/></g>`}
  /* ghost (corredor fantasma) ou zumbi (Fuga da Horda), só com o treino iniciado */
  let hzline='',ghm='',hzm='';

    if(wo.mode==='horda'&&wo.hz&&wo.hz.rel){const zp=trackPos(T,Math.min(1,Math.max(0,wo.hz.z/r.dist))),rp=trackPos(T,p);
      if(zp.i<=rp.i)hzline=`<path d="${d([zp.pos,...T.slice(zp.i+1,rp.i+1),rp.pos])}" fill="none" stroke="#ff4d4d" stroke-opacity=".85" stroke-width="${sw*.55}" stroke-linecap="round" stroke-dasharray="14 12"/>`;

  return `<svg viewBox="${-pad} ${-pad} ${w+2*pad} ${h+2*pad}" class="w-full h-full" role="img" aria-label="Mapa do circuito">${road}${done}${wave}${hzline}${marks}${flag}${ghm}${hzm}${rider}</svg>`}
function grade(r,p){const e=r.elev,n=e.length-1,i=Math.min(n-1,Math.floor(p*n)),seg=r.dist*1000/n,a=Math.max(0,i-1),b=Math.min(n,i+2);

function closeModal(force){if(modalLock&&force!==true)return;modalLock=false;$('#modal').innerHTML=''}

/* ---------- Histórico: detalhes em box centralizado + exclusão ----------
   Excluir um treino NÃO tira XP, engrenagens, km, tempo total nem a contagem de treinos: os valores do treino vão para G().del
   (salvo junto do perfil, inclusive no Supabase) e as estatísticas somam histórico + excluídos. */
function openCenter(html,w='max-w-md'){modalLock=false;$('#modal').innerHTML=`<div class="fixed inset-0 z-50 bg-ink/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()"><div role="dialog" aria-modal="true" class="bg-panel border border-line rounded-2xl w-full ${w} overflow-y-auto p-5" style="max-height:88vh;max-height:88dvh">${html}</div></div>`;lucide.createIcons()}
function histDetail(id){const p=profile(),x=p&&p.history.find(h=>h.id===id);if(!x)return;
  const row=(l,v)=>`<div class="flex justify-between gap-3 py-2 border-b border-line last:border-0 text-sm"><span class="text-zinc-400">${l}</span><span class="font-semibold text-right tabular-nums">${v}</span></div>`;
  const st=x.mode==='horda'?(x.done?'Escapou da horda':'Alcançado pela horda'):x.done?'Concluída':'Parcial',gain=(x.coins||x.pts||0);
  const ini=x.date-(x.time||0)*1000;
  openCenter(`<div class="flex items-start justify-between gap-3 mb-1"><div class="min-w-0"><h2 class="font-display text-3xl font-bold leading-tight break-words">${esc(x.routeName)}</h2><div class="text-sm ${x.done?'text-neon':'text-zinc-400'} font-semibold">${st}</div></div><button onclick="closeModal()" aria-label="Fechar" class="shrink-0 w-9 h-9 grid place-items-center rounded-lg border border-line text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button></div>
   <div class="mt-2">${row('Data',new Date(x.date).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}))}${row('Horário',hhmm(ini)+' – '+hhmm(x.date))}${row('Distância',x.dist.toFixed(2)+' km')}${row('Tempo',fmt(x.time))}${row('Velocidade média',x.avgSpd.toFixed(1)+' km/h')}${x.avgHr?row('Freq. cardíaca média',x.avgHr+' bpm'):''}${x.maxHr?row('Freq. cardíaca máxima',x.maxHr+' bpm'):''}${row('Inclinação',INT[x.inten||'off'].n)}${row('Modo',x.mode==='horda'?'Fuga da Horda':'Normal')}${gain?row('Engrenagens ganhas','<span class="text-white">'+gain.toLocaleString('pt-BR')+'</span>'):''}${x.xp?row('XP do corredor',x.xp.toLocaleString('pt-BR')+' XP'):''}${x.petXp&&MASCOTS[x.petId]?row('XP do mascote ('+esc(MASCOTS[x.petId].name)+')',x.petXp.toLocaleString('pt-BR')+' XP'):''}${x.evTot?row('Eventos concluídos',(x.evOk||0)+' de '+x.evTot):''}</div>
   <p class="text-[11px] text-zinc-500 mt-3">Ao excluir, o treino sai da lista, mas seu XP, engrenagens, quilometragem, tempo total e nº de treinos continuam contabilizados.</p>
   <div class="flex gap-2 mt-4"><button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line text-zinc-300 font-semibold">Fechar</button><button onclick="histDel('${x.id}')" class="flex-1 py-2.5 rounded-lg bg-red-600 text-white font-semibold flex items-center justify-center gap-2"><i data-lucide="trash-2" class="w-4 h-4"></i>Excluir treino</button></div>`)}
function histDel(id){const p=profile(),i=p?p.history.findIndex(h=>h.id===id):-1;if(i<0)return;
  if(!confirm('Excluir este treino do histórico?\n\nSeu XP, engrenagens, quilometragem, tempo total e número de treinos continuam preservados.'))return;
  const x=p.history[i],g=G(p),d=g.del,now=Date.now();
  d.n+=1;d.km+=+x.dist||0;d.t+=+x.time||0;d.wk.push([x.date,+x.dist||0]);d.wk=d.wk.filter(a=>a[0]>=now-6048e5);
  p.history.splice(i,1);
  saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)});q({t:'del',tb:'workouts',col:'id',val:id});
  closeModal();toast('Treino excluído');render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

const photoField=()=>`<div class="text-sm space-y-2"><div>Foto (opcional)</div>
  <div class="flex items-center gap-3"><div id="pv" class="w-14 h-14 rounded-full bg-ink border border-line bg-cover bg-center shrink-0"></div>
  <label class="flex-1 py-2 px-3 rounded-lg border border-line text-center cursor-pointer hover:border-neon">Escolher da galeria<input type="file" accept="image/*" class="hidden" onchange="pickPhoto(this)"></label></div>
  <input type="hidden" name="pd"><input name="pp" type="url" placeholder="ou cole o link direto da imagem (https://i.ibb.co/…/foto.jpg)" class="${IN}" oninput="prevPhoto(this.value)">
  <p class="text-xs text-zinc-500">Links como ibb.co/xxxx são páginas, não a imagem. Prefira escolher da galeria, ou use o "Link direto" do site de hospedagem.</p></div>`;
function prevPhoto(u){const e=$('#pv');if(e)e.style.backgroundImage=u?`url('${cssUrl(u)}')`:''}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const img=new Image(),fr=new FileReader();
  fr.onload=()=>{img.onload=()=>{const N=160,c=document.createElement('canvas');c.width=c.height=N;const m=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,N,N);
      const d=c.toDataURL('image/jpeg',.82),form=inp.closest('form');form.elements.pd.value=d;form.elements.pp.value='';prevPhoto(d)};
    img.onerror=()=>toast('Não foi possível ler essa imagem');img.src=fr.result};
  fr.readAsDataURL(f)}
const photoOf=f=>f.pd.value||f.pp.value.trim();
function profileModal(){openModal(`<h2 class="font-display text-3xl font-bold mb-4">Novo perfil</h2>
  <form onsubmit="saveProfile(event)" class="space-y-3">
  <label class="block text-sm">Nome<input name="pn" required maxlength="30" class="${IN} mt-1"></label>
  <div class="grid grid-cols-2 gap-3"><label class="block text-sm">Peso (kg)<input name="pw" type="number" min="20" max="250" step="0.1" required class="${IN} mt-1"></label>
  <label class="block text-sm">Altura (cm)<input name="ph" type="number" min="100" max="250" required class="${IN} mt-1"></label></div>

  <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line">Cancelar</button><button class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">Salvar perfil</button></div></form>`)}
function saveProfile(e){e.preventDefault();const f=e.target.elements;
  const p={id:uid(),name:f.pn.value.trim(),weight:+f.pw.value,height:+f.ph.value,photo:photoOf(f),inten:S.inten,sex:f.sx.value,history:[],wlog:[]};
  S.profiles.push(p);q({t:'up',tb:'profiles',row:pRow(p)});wlog(p);saveProfiles();closeModal();selectProfile(p.id)}
function photoModal(){openModal(`<h2 class="font-display text-3xl font-bold mb-4">Alterar foto</h2>
  <form onsubmit="savePhoto(event)" class="space-y-3">${photoField()}
  <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line">Cancelar</button><button class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">Salvar foto</button></div></form>`)}
function savePhoto(e){e.preventDefault();const p=profile();p.photo=photoOf(e.target.elements);saveProfiles();q({t:'up',tb:'profiles',row:pRow(p)});closeModal();render()}
function selectProfile(id){S.cur=id;store('cad_cur',id);applyInten();S.tab='home';
  /* retoma um treino interrompido só para o perfil que estava treinando (na primeira seleção após abrir o app) */
  if(bootRemote!==undefined){const rm=bootRemote;bootRemote=undefined;restoreWo(rm)}
  profInit(profile());render();setTimeout(weightPrompt,300)}
function switchProfile(){if(S.wo.running||S.wo.dist>0){if(!confirm('Há um treino em andamento. Sair e descartá-lo?'))return;resetWo()}const adm=isAdmin();S.cur=null;if(adm)ADMIN=null;else store('cad_cur',null);render()}
function deleteProfile(){if(!confirm('Excluir este perfil e todo o histórico?'))return;resetWo();q({t:'del',tb:'profiles',col:'id',val:S.cur});S.profiles=S.profiles.filter(p=>p.id!==S.cur);saveProfiles();switchProfile()}

/* ---------- Perfil Admin (oculto): entrada, painel de testes e pop-up de vibração ---------- */
const ADM={coins:1000,xp:500};   /* quantidade que cada botão concede */
let admBuf='',admT=0;
document.addEventListener('keydown',e=>{      /* na tela de escolha de perfil, digitar "admin" (sem campo de texto focado) abre o perfil oculto */
  if(S.cur||!e.key||e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  if($('#modal').innerHTML)return;
  const n=Date.now();if(n-admT>2000)admBuf='';admT=n;
  admBuf=(admBuf+e.key.toLowerCase()).slice(-5);
  if(admBuf==='admin'){admBuf='';enterAdmin()}});
function enterAdmin(){
  ADMIN={id:ADMIN_ID,name:'Admin',weight:70,height:175,photo:'',sex:'m',history:[],wlog:[{id:'w0_'+ADMIN_ID,date:Date.now(),weight:70}],
    game:{coins:0,xp:0}};
  S.cur=ADMIN_ID;applyInten();S.tab='home';render();toast('Perfil Admin (oculto): nada é salvo')}
/* painel flutuante: só existe no perfil Admin */
function admPanel(){const e=document.getElementById('admin');if(!e)return;e.style.display=isAdmin()?'block':'none';
  const b=document.getElementById('adm-ev');if(b){const w=S.wo,ok=w.running&&!w.arming&&!w.evCur&&w.mode!=='horda';b.style.opacity=ok?'1':'.45'}}
function admRefresh(){if(!(S.tab==='treino'&&woBusy()))render()}   /* moedas/XP aparecem fora da aba Treino; evita redesenhar o treino em andamento */
function adminCoins(){if(!isAdmin())return;G().coins+=ADM.coins;toast('+'+ADM.coins.toLocaleString('pt-BR')+' engrenagens (admin)');admRefresh()}
function adminXp(){if(!isAdmin())return;const g=G(),l0=lvInfo(g.xp).l;g.xp+=ADM.xp;const l1=lvInfo(g.xp).l;
  toast('+'+ADM.xp.toLocaleString('pt-BR')+' XP (admin)');admRefresh();achRun(profile());if(l1>l0)setTimeout(()=>levelModal(l1),350)}
function shopTotal(){return FRAME_LIST.reduce((t,f)=>t+f.price,0)+MASCOT_LIST.reduce((t,m)=>t+m.price,0)}
function adminLevel(){if(!isAdmin())return;const g=G();let t=0;for(let l=1;l<MAXLV;l++)t+=lvCost(l);
  const need=shopTotal(),gift=Math.max(0,need-g.coins);if(gift)g.coins+=gift;   /* engrenagens suficientes para comprar tudo da loja (molduras + mascotes) */
  if(g.xp>=t){toast(gift?'Já está no nível '+MAXLV+' · +'+gift.toLocaleString('pt-BR')+' engrenagens (admin)':'Já está no nível '+MAXLV);admRefresh();return}
  g.xp=t;toast('Nível '+MAXLV+' + '+gift.toLocaleString('pt-BR')+' engrenagens (admin)');admRefresh();achRun(profile());setTimeout(()=>levelModal(MAXLV),350)}
function adminEvent(){if(!isAdmin())return;const w=S.wo,r=route();
  if(!r||!w.running||w.arming||w.mode==='horda'){toast('Inicie um treino (rodando) para ativar um evento');return}
  if(w.evCur){toast('Já há um evento em andamento');return}
  const def=EVENTS[Math.floor(Math.random()*EVENTS.length)];
  w.evs.push({f:w.dist/r.dist,ev:def.id,st:'todo'});evBegin(w.evs[w.evs.length-1]);admPanel()}
/* Pop-up de "comando de vibração" (o PC não vibra): aparece no Admin sempre que o sistema chama haptic() */
const HAP_LBL={count:'Contagem 3-2-1',go:'Largada / GO!',coin:'Ganho de engrenagens/XP',event:'Evento iniciado',evwin:'Evento conquistado',evlost:'Evento perdido',win:'Treino concluído',end:'Treino encerrado',pause:'Pausa',resume:'Retomada',level:'Subida de nível'};
function hapPopup(name,pat){let box=document.getElementById('haptoast');
  if(!box){box=document.createElement('div');box.id='haptoast';box.style.cssText='position:fixed;top:.75rem;right:.75rem;z-index:70;display:flex;flex-direction:column;gap:.5rem;pointer-events:none;width:min(86vw,300px)';document.body.appendChild(box)}
  const n=document.createElement('div');n.className='hap-pop';
  n.innerHTML=`<span class="hap-ic">📳</span><div style="min-width:0"><div style="font-weight:700;font-size:.85rem;color:#fff">Comando de vibração</div><div style="font-size:.8rem;color:#ffa13d">${HAP_LBL[name]||name}</div><div style="font-size:.7rem;color:#9dbddb;margin-top:.15rem">Padrão: ${pat.join(' – ')} ms</div></div>`;
  box.appendChild(n);while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>{n.style.opacity='0';n.style.transform='translateX(20px)';setTimeout(()=>n.remove(),300)},2600)}

 'Cada pedalada de hoje é um passo à frente do você de ontem.',
 'Constância vence talento: apareça, pedale, repita.',
 'Respire fundo, solte os ombros e encontre o seu ritmo.',

S.msgI=0;
const weekKm=p=>p.history.filter(h=>h.date>=Date.now()-6048e5).reduce((a,h)=>a+h.dist,0)+G(p).del.wk.filter(a=>a[0]>=Date.now()-6048e5).reduce((a,x)=>a+x[1],0);
function motivMsg(p){if(!p.history.length&&!G(p).del.n&&!S.msgI)return 'Sua primeira pedalada começa com um clique. Escolha uma pista e vamos nessa!';
  return MOTIV[(Math.floor(Date.now()/864e5)+hash(p.id)+S.msgI)%MOTIV.length]}
function nextMsg(){S.msgI++;render()}
/* Recomenda a pista menos concluída; empate: a que está há mais tempo sem treino; depois a mais curta */
function recommend(){const p=profile();if(!p||!S.routes.length)return null;
  const info=S.routes.map(r=>{const hs=p.history.filter(h=>h.routeId===r.id);
    return{r,dn:hs.filter(h=>h.done).length,last:hs.length?Math.max(...hs.map(h=>h.date)):0}});
  info.sort((a,b)=>a.dn-b.dn||a.last-b.last||a.r.dist-b.r.dist);
  const x=info[0];x.why=x.dn===0?(x.last?'Você começou, mas ainda não concluiu':'Pista nova para você'):'É a que está há mais tempo sem pedalar';return x}
/* ---------- Carrossel "Pistas Recomendadas" ---------- */
const REC_MS=7000;let recT;
const recShuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function recInit(){const ids=S.routes.map(r=>r.id);
  if(!S.rec||S.rec.order.length!==ids.length||!ids.every(id=>S.rec.order.includes(id)))S.rec={order:recShuffle(ids),i:0,t0:Date.now()}}
function recWhy(r){const hs=profile().history.filter(h=>h.routeId===r.id),dn=hs.filter(h=>h.done).length;
  return dn?'Concluída '+dn+'x · tente melhorar seu tempo':(hs.length?'Você começou, mas ainda não concluiu':'Pista nova para você')}
const recTxt=r=>`<div class="font-display text-2xl font-bold truncate">${esc(r.name)}</div><div class="text-xs text-zinc-400 truncate">${r.dist.toFixed(1)} km · +${elevStats(r.elev).gain} m · ${userBest(r)?'Seu recorde '+fmt(userBest(r)):'Sem recorde'}</div><div class="text-xs text-zinc-500 truncate">${recWhy(r)}</div>`;
const recRing=off=>`<svg viewBox="0 0 40 40" class="w-5 h-5 sm:w-9 sm:h-9 -rotate-90" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(156,163,175,.45)" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="#fff" stroke-width="4" pathLength="100" stroke-dasharray="100" style="stroke-dashoffset:100;animation:recfill ${REC_MS}ms linear forwards;animation-delay:-${off}ms"/></svg>`;
function recSched(){clearTimeout(recT);const R=S.rec;if(!R||R.order.length<2||!$('#recTrack'))return;recT=setTimeout(()=>recGo(1),Math.max(50,REC_MS-(Date.now()-R.t0)))}
function recGo(d){const R=S.rec,t=$('#recTrack');if(!R||!t)return;const n=R.order.length;R.i=(R.i+d+n)%n;R.t0=Date.now();
  const r=S.routes.find(x=>x.id===R.order[R.i]),vp=t.parentElement,nw=document.createElement('div');
  /* slide lateral: a pista nova entra pelo lado da navegação e a atual sai pelo lado oposto (também no fim → início) */
  nw.className='absolute inset-0';nw.innerHTML=`<div class="h-full">${cover(r,'h-full')}</div>`;nw.style.transform=`translateX(${d*100}%)`;
  t.removeAttribute('id');nw.id='recTrack';vp.appendChild(nw);void nw.offsetWidth;
  const tr='transform .55s cubic-bezier(.4,0,.2,1)';t.style.transition=nw.style.transition=tr;
  t.style.transform=`translateX(${-d*100}%)`;nw.style.transform='translateX(0)';setTimeout(()=>t.remove(),600);
  const tx=$('#recTxt');tx.innerHTML=recTxt(r);tx.style.animation='none';void tx.offsetWidth;tx.style.animation=`${d>0?'recTxtR':'recTxtL'} .55s cubic-bezier(.4,0,.2,1)`;
  const g=$('#recRingBox');if(g)g.innerHTML=recRing(0);recSched();if(window.lucide)lucide.createIcons()}  /* avançar/voltar (manual ou automático) zera o círculo */
function startNow(id){const w=S.wo;
  if(w.dist>0||w.running){toast('Já há um treino em andamento');setTab('treino');return}
  w.route=id;w.running=true;w.last=Date.now();ensureEvs();wakeOn();S.tab='treino';render()}
function homeTab(){
  recInit();const p=profile(),h=p.history,km=h.reduce((a,x)=>a+x.dist,0)+G(p).del.km,bmi=p.weight/Math.pow(p.height/100,2),
    nb=S.routes.filter(r=>userBest(r)).length,rec=recommend(),last=h[0];
  const st=(l,v,u)=>`<div class="rounded-xl bg-panel border border-line px-3 py-2 lg:py-3 min-w-0"><div class="text-[11px] lg:text-xs text-zinc-400 truncate">${l}</div><div class="font-display text-2xl lg:text-4xl font-bold text-neon leading-tight truncate">${v}<span class="text-xs lg:text-sm text-zinc-500 ml-1">${u}</span></div></div>`;
  const recHtml=rec?`<section class="rounded-2xl bg-panel border border-line p-3 lg:p-4 flex flex-col gap-2 lg:flex-1 lg:min-h-0">
    <h3 class="font-display text-xl lg:text-2xl font-bold flex items-center gap-2"><i data-lucide="route" class="w-5 h-5 text-neon"></i>Pistas Recomendadas</h3>
    <div class="relative rounded-xl overflow-hidden h-28 lg:h-auto lg:flex-1 lg:min-h-0 bg-ink"><div class="absolute inset-0 overflow-hidden"><div id="recTrack" class="absolute inset-0"><div class="h-full">${cover(S.routes.find(x=>x.id===S.rec.order[S.rec.i]),'h-full')}</div></div></div>

const mainHtml=t=>t==='home'?`<main class="max-w-6xl mx-auto p-4" style="height:calc(100dvh - var(--hh,110px) - env(safe-area-inset-bottom))">${homeTab()}</main>`:t==='treino'?`<main class="max-w-6xl mx-auto p-4" style="height:calc(100dvh - var(--hh,110px) - env(safe-area-inset-bottom))">${treino()}</main>`:`<main class="max-w-6xl mx-auto p-4 pb-16">${t==='perfil'?perfil():t==='loja'?loja():t==='conquistas'?conquistas():rotas()}</main>`;

function setHH(){const e=document.querySelector('header');if(e)document.documentElement.style.setProperty('--hh',e.offsetHeight+'px')}
window.addEventListener('resize',setHH);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setHH);

/* ===== Deslizar o dedo para trocar de aba (só toque/mobile) =====
   A aba vizinha acompanha o dedo. Proteções contra troca involuntária:
   - só começa dentro do conteúdo (não na barra de abas), fora das bordas da tela (gesto de voltar do sistema),
     fora de campos, gráficos e áreas com rolagem horizontal, e nunca com janela aberta;
   - só "trava" como deslize se o movimento for claramente horizontal (diagonal/vertical = rolagem normal);
   - só troca se arrastar mais de 1/3 da tela ou fizer um gesto rápido; senão volta ao lugar;
   - segundo dedo, cancelamento do sistema ou re-render cancelam e voltam. */
const TAB_ORDER=['home','treino','rotas','loja','conquistas','perfil'];
let SW=null;
function navCenter(){const n=document.querySelector('header nav'),b=n&&n.querySelector('.tabbtn.on');if(n&&b)n.scrollLeft+=b.getBoundingClientRect().left-n.getBoundingClientRect().left-(n.clientWidth-b.offsetWidth)/2}
function swAbort(){const s=SW;SW=null;if(!s)return;clearTimeout(s.tm);Object.values(s.pv||{}).forEach(p=>p.remove());
  if(s.cur){s.cur.style.transform=s.cur.style.transition=s.cur.style.willChange=''}document.documentElement.style.overflowX=''}
function swBlocked(el){
  if(!el||!el.closest||!el.closest('main'))return true;
  if(el.closest('input,textarea,select,canvas,[contenteditable],[data-noswipe]'))return true;
  const m=$('#modal');if(m&&m.childElementCount)return true;
  for(let n=el;n&&n.tagName!=='MAIN';n=n.parentElement){const o=getComputedStyle(n).overflowX;
    if((o==='auto'||o==='scroll')&&n.scrollWidth>n.clientWidth+(AND?6:1))return true}
  return false}
function swMake(t){const k=S.tab,hd=document.querySelector('header');let h='';
  S.tab=t;try{h=mainHtml(t)}finally{S.tab=k}
  const p=document.createElement('div');p.setAttribute('inert','');p.setAttribute('aria-hidden','true');
  p.style.cssText=`position:fixed;left:0;right:0;top:${hd.getBoundingClientRect().bottom}px;bottom:0;overflow:hidden;background:#000;z-index:20;pointer-events:none;will-change:transform;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)`;
  p.innerHTML=h.replace(/\sid="/g,' data-i="');   /* sem ids duplicados */
  document.body.appendChild(p);lucide.createIcons();return p}
function swMove(dx){const s=SW,W=innerWidth,dir=dx<0?1:-1,t=TAB_ORDER[s.idx+dir];
  dx=Math.max(-W,Math.min(W,dx));s.dx=dx;Object.values(s.pv).forEach(p=>p.style.display='none');
  if(!t){s.cur.style.transform=`translate3d(${dx*.28}px,0,0)`;return}   /* primeira/última aba: resistência */
  const p=s.pv[dir]||(s.pv[dir]=swMake(t));p.style.display='';
  s.cur.style.transform=`translate3d(${dx}px,0,0)`;p.style.transform=`translate3d(${dir*W+dx}px,0,0)`}
function swFinish(s,go){s.done=true;const W=innerWidth,tr='transform .26s cubic-bezier(.2,.8,.2,1)',pv=s.pv[s.dir];
  s.cur.style.transition=tr;s.cur.style.transform=`translate3d(${go?-s.dir*W:0}px,0,0)`;
  if(pv){pv.style.transition=tr;pv.style.transform=`translate3d(${go?0:s.dir*W}px,0,0)`}
  let fin=false;const end=()=>{if(fin)return;fin=true;swAbort();if(go){window.scrollTo(0,0);setTab(s.next)}};
  s.cur.addEventListener('transitionend',end,{once:true});s.tm=setTimeout(end,400)}
/* Android (Chrome/WebView): o navegador assume a rolagem e dispara pointercancel quando o dedo tem um pouco de movimento vertical, então o
   deslize morria no meio. No Android o gesto usa eventos de toque (touchmove não passivo, cancelável desde o início), com limiar de
   início menor, tolerância maior para o movimento diagonal e folga no teste de rolagem horizontal. No iOS nada muda (pointer events). */
const AND=/Android/i.test(navigator.userAgent);
const SWK=AND?{slop:8,ratio:1.15}:{slop:12,ratio:1.8};
function swDown(e){
  if(SW){if(!SW.done)swAbort();return}   /* segundo dedo cancela */
  if(!S.cur||!profile()||!document.querySelector('header')||e.clientX<18||e.clientX>innerWidth-18||swBlocked(e.target))return;
  const idx=TAB_ORDER.indexOf(S.tab);if(idx<0)return;
  SW={id:e.pointerId,x0:e.clientX,y0:e.clientY,idx,mode:0,dx:0,dir:1,pv:{},hist:[[performance.now(),e.clientX]]}}
function swMv(e){
  const s=SW;if(!s||s.done||e.pointerId!==s.id)return;
  const dx=e.clientX-s.x0,dy=e.clientY-s.y0;
  if(s.mode===0){
    if(Math.abs(dx)<SWK.slop&&Math.abs(dy)<SWK.slop)return;
    if(Math.abs(dx)<=Math.abs(dy)*SWK.ratio){SW=null;return}   /* não é claramente horizontal: rolagem normal */
    s.cur=document.querySelector('main');if(!s.cur){SW=null;return}
    s.mode=1;s.cur.style.willChange='transform';document.documentElement.style.overflowX='hidden'}
  s.hist.push([performance.now(),e.clientX]);if(s.hist.length>6)s.hist.shift();
  s.dir=dx<0?1:-1;swMove(dx)}
/* iOS / desktop com toque */
document.addEventListener('pointerdown',e=>{if(AND||e.pointerType!=='touch')return;swDown(e)},{passive:true});
document.addEventListener('pointermove',e=>{if(AND)return;swMv(e)},{passive:true});
/* Android */
const swT=(e,t)=>({pointerId:t.identifier,clientX:t.clientX,clientY:t.clientY,target:e.target});
document.addEventListener('touchstart',e=>{if(AND&&e.changedTouches.length)swDown(swT(e,e.changedTouches[0]))},{passive:true});
document.addEventListener('touchmove',e=>{
  if(AND){const s=SW;if(s&&!s.done)for(const t of e.changedTouches)if(t.identifier===s.id){swMv(swT(e,t));break}}
  if(SW&&SW.mode===1&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('touchend',e=>{if(AND)for(const t of e.changedTouches)swEnd({pointerId:t.identifier},false)},{passive:true});
document.addEventListener('touchcancel',e=>{if(AND)for(const t of e.changedTouches)swEnd({pointerId:t.identifier},true)},{passive:true});
function swEnd(e,cancel){
  const s=SW;if(!s||s.done||e.pointerId!==s.id)return;
  if(s.mode!==1){SW=null;return}
  const W=innerWidth,dx=s.dx,dir=dx<0?1:-1,t=TAB_ORDER[s.idx+dir],a=s.hist[0],b=s.hist[s.hist.length-1],v=(b[1]-a[1])/Math.max(1,b[0]-a[0]);
  s.dir=dir;s.next=t;
  swFinish(s,!cancel&&!!t&&(Math.abs(dx)>W*.33||(Math.abs(v)>.45&&Math.abs(dx)>50&&Math.sign(v)===Math.sign(dx))))}
document.addEventListener('pointerup',e=>{if(!AND)swEnd(e,false)},{passive:true});
document.addEventListener('pointercancel',e=>{if(!AND)swEnd(e,true)},{passive:true});
function render(){hrWarnUpd();admPanel();swAbort();$('#app').innerHTML=S.cur&&profile()?shell():home();lucide.createIcons();setHH();requestAnimationFrame(setHH);navCenter();if(S.cur&&S.tab==='treino')updLive();syncAnims();if(S.cur&&S.tab==='home')recSched()}

/* ---------- Moedas, XP e eventos ---------- */
/* Por km: moedas e XP pela distância + ganho de altimetria do km; ao final: conclusão e velocidade média; por evento vencido (constantes em ECO) */
/* =====================================================================================================================
   REGRAS DOS EVENTOS — LEIA ANTES DE ALTERAR OU CRIAR EVENTOS
   (definidas pelo dono do app; valem para pessoas e para qualquer IA que não tenha o histórico da conversa)
   1. OBJETIVO DO On Fire!: "Nos próximos 10 segundos, fique acima da velocidade média atual". Média atual = média da velocidade nos EV_BASE_N (5) s
      anteriores (e.base): acompanha a média durante o "Prepare-se"/3-2-1 e fica CONGELADA no GO, valendo pelos 10 s do desafio. Vence quem ficou ACIMA de e.base em pelo menos 6 dos 10 segundos
      (tolerância para variações do sensor; sem margem extra de +2 km/h). O texto do subtexto (def.goal) não deve ser alterado.
   2. TODO EVENTO TEM UM CARD NO CENTRO DA TELA, como elemento principal: #evt é uma camada de tela cheia (z-55) com fundo escurecido
      levemente (rgba(0,0,0,.5)) durante todo o evento. O card aparece no disparo e fica até 2,6 s depois do resultado. Ao pausar o treino o
      card some e, ao retomar, é recriado (evTick) no mesmo ponto. A camada não bloqueia toques (pointer-events:none).
   3. CONTEÚDO OBRIGATÓRIO DO CARD (evCardHtml), nesta ordem: rótulo "Evento" · NOME do evento · SUBTEXTO com o objetivo (def.goal), sempre logo
      abaixo do nome — todo evento novo precisa de "goal" · área de contagem (Prepare-se → 3 → 2 → 1 → GO! → segundos restantes) ·
      MÉTRICA PRINCIPAL do evento (def.met: rótulo, unidade, valor ao vivo, referência e good() que pinta verde/laranja; no On Fire! é a
      VELOCIDADE; fica VERDE quando acima da base e VERMELHA quando não atende) · BARRA DE PROGRESSO do tempo do evento (def.dur) com "x / dur s" · linha de recompensa.
   PALETA do card: AZUL (neon/brand do app) e BRANCO. Verde/vermelho só para o carimbo de resultado e para a cor da velocidade; não use laranja.
   4. RESULTADO: animação de CARIMBO sobre o card (evStamp): "CONCLUÍDO" em VERDE (#34d399) se venceu, "FRACASSOU" em VERMELHO (#ff4d4d) se
      perdeu. Vitória = +ECO.coinEvt moedas e +ECO.xpEvt XP (addGain), som/vibração 'evwin'; derrota = sem prêmio, vibração 'evlost'.
   5. LINHA DO TEMPO (evTick roda 1x por segundo; k = segundos desde o disparo): k=0 disparo (sfx/haptic 'event') · k=1 "Prepare-se" ·
      k=2..4 contagem 3-2-1 (haptic 'count') · k=5 "GO!" (haptic 'go') · k>=6 uma amostra por segundo em e.s (velocidade) e e.c (cadência);
      ao juntar def.dur amostras, avalia com def.ok(e). A barra anda de 0 a 100% ao longo das def.dur amostras.
   6. QUANDO DISPARA: treino rodando (não pausado), pelo menos 5 min de treino, no ponto da rota sorteado, velocidade >= 10 km/h e sem outro
      evento ativo. Quantidade: ~1 a cada 3 km (mín. 2, máx. 8), posições espaçadas (planEvents). Nunca na Fuga da Horda.
   7. CRIAR UM NOVO EVENTO = acrescentar um objeto em EVENTS: {id, t (nome), dur (s), goal (objetivo, texto curto), met:{l,u,dec,val(L),ref(e),good(v,e)},
      ok(e)}. e.s = velocidades, e.c = cadências, e.base = média de velocidade inicial. A métrica principal deve refletir o objetivo (ex.: evento de
      cadência → val:L=>L.cad, u:'rpm'). Use SEMPRE este mesmo card; não crie outro layout. Atualize esta lista se as regras mudarem.
   8. O aviso do sensor cardíaco (#hrwarn, centro da tela) desce para o rodapé enquanto o card do evento está visível (hrWarnUpd).
   9. Para testar, o perfil oculto Admin (digite "admin" na escolha de perfil) tem o botão "Ativar evento" (adminEvent → evBegin), que força um evento durante um treino rodando.
   ===================================================================================================================== */
const EV_BASE_N=5;   /* On Fire!: a base é a média da velocidade dos EV_BASE_N segundos anteriores; acompanha a média até o GO e fica fixa a partir dele */
const EVENTS=[
 {id:'fire',t:'On Fire!',dur:10,goal:'Nos próximos 10 segundos, fique acima da velocidade média atual',
  met:{l:'Velocidade',u:'km/h',dec:1,val:L=>L.spd,ref:e=>({l:'Média atual a superar',v:e.base.toFixed(1)+' km/h'}),good:(v,e)=>v>e.base},
  ok:e=>e.s.filter(v=>v>e.base).length>=6}
];
const evDef=id=>EVENTS.find(x=>x.id===id)||EVENTS[0];   /* id desconhecido (treino salvo antigo) = On Fire! */
/* Quantidade de eventos proporcional ao circuito (~1 a cada 3 km, entre 2 e 8), espaçados ao longo do percurso */
function planEvents(r){const n=Math.min(8,Math.max(2,Math.round(r.dist/3))),out=[];
  for(let t=0;out.length<n&&t<500;t++){const f=.1+Math.random()*.8;
    if(out.every(x=>Math.abs(x.f-f)>=.06))out.push({f,ev:EVENTS[Math.floor(Math.random()*EVENTS.length)].id,st:'todo'})}
  return out.sort((a,b)=>a.f-b.f)}
function ensureEvs(){const w=S.wo,r=route();if(r&&!w.evs.length)w.evs=planEvents(r)}
function evShow(h){const el=$('#evt');if(!el)return;el.innerHTML=h||'';el.style.display=h?'flex':'none';hrWarnUpd()}
/* dispara o evento nx (de w.evs): base = média dos últimos 5 s de velocidade (ou a velocidade atual se ainda não há histórico) */
function evBegin(nx){const w=S.wo,def=evDef(nx.ev),h=w.spdH.slice(-EV_BASE_N),base=h.length?h.reduce((a,b)=>a+b,0)/h.length:live().spd;
  nx.st='on';w.evCur={id:def.id,idx:w.evs.indexOf(nx),k:0,base,s:[],c:[]};sfx('event');
  evShow(evCardHtml(def,w.evCur));evSync()}
/* progresso da barra: 0 até o GO; depois sobe 1/dur a cada segundo (já "antecipando" o próximo segundo, para chegar a 100% junto com o resultado) */
const evPct=(e,def)=>e.k<5?0:Math.round(Math.min(e.s.length+1,def.dur)/def.dur*100);
function evCardHtml(def,e){const m=def.met;
  return `<div id="ev-card" class="bodyin relative w-[min(92vw,420px)] rounded-3xl border-2 border-neon/60 bg-panel p-5 text-center shadow-[0_20px_70px_rgba(0,0,0,.75),0_0_40px_rgba(106,195,255,.28)]">
   <div id="ev-in" style="transition:opacity .25s">
    <div class="text-[11px] uppercase tracking-[.3em] text-neon">Evento</div>
    <div class="font-display text-5xl font-extrabold text-white leading-none mt-1">${def.t}</div>
    <div class="text-sm text-zinc-300 mt-2">${def.goal}</div>
    <div id="ev-cd" class="min-h-[5.5rem] flex items-center justify-center"></div>
    <div class="rounded-2xl bg-ink border border-line px-3 py-2">
     <div class="text-[11px] uppercase tracking-wide text-zinc-400">${m.l}</div>
     <div class="font-display text-6xl font-extrabold tabular-nums leading-none"><span id="ev-m">--</span><span class="text-base font-sans font-normal text-zinc-500 ml-1">${m.u}</span></div>
     <div id="ev-ref" class="text-xs text-zinc-400 mt-1"></div>
    </div>
    <div class="mt-4"><div class="flex justify-between text-[11px] text-zinc-400 mb-1"><span>Tempo do evento</span><span id="ev-t" class="tabular-nums"></span></div>
     <div class="h-3 rounded-full bg-line overflow-hidden"><div id="ev-bar" class="h-full rounded-full bg-gradient-to-r from-brand to-neon" style="width:${evPct(e,def)}%;transition:width 1s linear"></div></div></div>
   </div>
   <div id="ev-rw" class="mt-3 min-h-[1.25rem] text-sm font-semibold"></div>
  </div>`}
/* valor ao vivo da métrica principal (chamado a cada segundo e a cada leitura do sensor) */
function evMetric(){const e=S.wo.evCur;if(!e)return;const el=document.getElementById('ev-m');if(!el)return;

/* soma moedas e XP do treino (no modo Horda valem ×ECO.hordaMul); o saldo do perfil só é creditado ao encerrar (finish) */
let sfxHold=false;   /* ao finalizar, o som de fim substitui os sons de moeda */
function addGain(c,x,kind){const w=S.wo,p=profile(),fx=petFx(p),m=w.mode==='horda'?ECO.hordaMul:1;
  /* bônus do mascote equipado: % geral (xp/coin) + o específico do tipo de ganho (km, evento, conclusão, velocidade) */
  let cm=1+(fx.coin||0)/100,xm=1+(fx.xp||0)/100;
  if(kind==='km'){c+=fx.kmcoin||0;x+=fx.kmxp||0}
  else if(kind==='evt'&&fx.evento){cm+=fx.evento/100;xm+=fx.evento/100}
  else if(kind==='conc'&&fx.conc){cm+=fx.conc/100;xm+=fx.conc/100}
  else if(kind==='vel'&&fx.vel)cm+=fx.vel/100;
  c=Math.round(c*m*cm);x=Math.round(x*m*xm);if(c<=0&&x<=0)return;w.coins+=c;w.xp+=x;
  /* o mascote equipado recebe o mesmo XP do corredor (mais o bônus "Aprendiz rápido") */
  let px=0;if(p&&MASCOTS[p.mascot]){px=Math.round(x*(1+(fx.pxp||0)/100));w.pet=p.mascot;w.pxp=(+w.pxp||0)+px}
  if(c>0&&!sfxHold)sfx('coin');else if(!sfxHold)haptic('coin');
  set('m-pts',w.coins.toLocaleString('pt-BR'));const f=$('#m-ptsfl');if(f){f.textContent='+'+c+(x?' · +'+x+' XP'+(px?' · '+MASCOTS[p.mascot].icon+' +'+px+' XP':''):'');f.style.opacity=1;clearTimeout(f._t);f._t=setTimeout(()=>f.style.opacity=0,1400)}}
/* ganho de altimetria (m) do km k da rota, a partir do perfil de elevação */
function gainKm(r,k){const e=r.elev,n=e.length-1;if(n<1)return 0;const i0=Math.round((k-1)/r.dist*n),i1=Math.min(n,Math.round(k/r.dist*n));let g=0;for(let i=i0+1;i<=i1;i++)if(e[i]>e[i-1])g+=e[i]-e[i-1];return g}

/* Chamado a cada segundo com o treino em andamento */
function evTick(){const w=S.wo,r=route();if(!r||!w.running||w.arming)return;
  const L=live();w.spdH.push(L.spd);if(w.spdH.length>8)w.spdH.shift();
  kmSync();
  if(w.secs-(w.trLast||0)>=5){w.trace.push([Math.round(w.secs),+w.dist.toFixed(3)]);w.trLast=w.secs}   /* rastro (tempo, distância) para o ghost */
  if(w.mode==='horda')return;                                                                              /* sem eventos aleatórios na Fuga da Horda */
  if(!w.evCur){
    /* só dispara após 5 min, com o ciclista pedalando e no ponto sorteado */
    const nx=w.evs.find(x=>x.st==='todo');
    if(!nx||w.secs<300||w.dist/r.dist<nx.f||L.spd<10)return;
    evBegin(nx);return}
  const e=w.evCur,def=evDef(e.id);e.k++;
  if(e.k<=5){const h=w.spdH.slice(-EV_BASE_N);if(h.length)e.base=h.reduce((a,b)=>a+b,0)/h.length}   /* média móvel dos segundos anteriores até o GO; depois fica congelada */
  if(!document.getElementById('ev-card'))evShow(evCardHtml(def,e));   /* recria o card depois de uma pausa */
  if(e.k>=2&&e.k<=4)haptic('count');else if(e.k===5)haptic('go');
  if(e.k>=6){e.s.push(def.met.val(L));e.c.push(L.cad);                /* uma amostra por segundo depois do GO */
    if(e.s.length>=def.dur){
      const won=def.ok(e);w.evs[e.idx].st=won?'won':'lost';w.evTot++;
      if(won){w.evOk++;addGain(ECO.coinEvt,ECO.xpEvt,'evt')}
      w.evCur=null;haptic(won?'evwin':'evlost');
      evStamp(won);setTimeout(()=>{if(!S.wo.evCur)evShow('')},2600);return}}
  evSync()}

function live(){if(S.sim.on)return{spd:S.sim.spd,cad:S.sim.cad,hr:S.sim.hr};
  const s=S.sensor,now=Date.now(),okC=now-s.ts<4000,okH=now-s.th<5000;return{spd:okC?s.spd:0,cad:okC?s.cad:0,hr:okH?s.hr:0}}
function parseHR(v){const f=v.getUint8(0);S.sensor.hr=f&1?v.getUint16(1,true):v.getUint8(1);S.sensor.th=Date.now();fastUpd('hr')}
/* FTMS - Indoor Bike Data (0x2AD2): velocidade, cadência, potência e FC numa característica só */
function parseFTMS(v){
  const f=v.getUint16(0,true);let o=2;
  const u16=()=>{const x=v.getUint16(o,true);o+=2;return x},s16=()=>{const x=v.getInt16(o,true);o+=2;return x};
  if(!(f&1)){S.sensor.spd=u16()*0.01}        /* bit0=0: velocidade instantânea (0,01 km/h) */
  if(f&2)o+=2;                                /* velocidade média */
  if(f&4){S.sensor.cad=u16()*0.5}             /* cadência instantânea (0,5 rpm) */
  if(f&8)o+=2;                                /* cadência média */
  if(f&16)o+=3;                               /* distância total (uint24) */
  if(f&32)o+=2;                               /* nível de resistência */
  if(f&64){S.sensor.pw=s16()}                 /* potência instantânea (W) */
  if(f&128)o+=2;                              /* potência média */
  if(f&256)o+=5;                              /* energia gasta (2+2+1) */
  if(f&512){const hr=v.getUint8(o);o+=1;if(hr>0){S.sensor.hr=hr;S.sensor.th=Date.now()}}
  S.sensor.ts=Date.now();fastUpd('ftms')}
let prevCsc=null;
function parseCSC(v){const f=v.getUint8(0);let o=1,cur={};
  if(f&1){cur.wr=v.getUint32(o,true);cur.wt=v.getUint16(o+4,true);o+=6}
  if(f&2){cur.cr=v.getUint16(o,true);cur.ct=v.getUint16(o+2,true)}

    if(cur.wr!=null&&prevCsc.wr!=null){const dr=cur.wr-prevCsc.wr,dt=((cur.wt-prevCsc.wt+65536)%65536)/1024;
      if(dt>0)S.sensor.spd=dr*2.096/dt*3.6;else if(Date.now()-S.sensor.ts>2000)S.sensor.spd=0}
    if(cur.cr!=null&&prevCsc.cr!=null){const dr=(cur.cr-prevCsc.cr+65536)%65536,dt=((cur.ct-prevCsc.ct+65536)%65536)/1024;
      if(dt>0)S.sensor.cad=dr/dt*60}}
  prevCsc=cur;S.sensor.ts=Date.now();fastUpd('csc')}

  count:[[523,0,.2,'triangle',0,.3]],                                                    /* 3, 2, 1 */
  go:[[659,0,.12,'triangle',0,.3],[880,.12,.12,'triangle',0,.3],[1319,.24,.5,'triangle',0,.32]],   /* largada */
  coin:[[988,0,.07,'square',0,.1],[1319,.07,.38,'square',0,.1]],                         /* moeda: "cling" */
  event:[[659,0,.14,'triangle',0,.28],[880,.17,.14,'triangle',0,.28],[659,.34,.14,'triangle',0,.28],[880,.51,.34,'triangle',0,.3]],   /* evento aleatório */

async function pair(kind,all){

    const opts=all?{acceptAllDevices:true,optionalServices:[svc]}:{filters:[{services:[svc]}]};
    const dev=await navigator.bluetooth.requestDevice(opts);
    const old=devs[kind];devs[kind]=dev;if(old&&old!==dev){try{old.gatt.disconnect()}catch(_){}}
    dev.addEventListener('gattserverdisconnected',()=>{if(devs[kind]!==dev)return;S.bt[kind]=null;if(kind==='csc')prevCsc=null;render();setTimeout(()=>reconnect(kind),1500)});
    toast('Conectando a '+(dev.name||'sensor')+'...');
    await attach(kind,dev);
    S.sim.on=false;render();toast('Sensor conectado: '+S.bt[kind])}
  catch(e){
    if(e.name==='NotFoundError')toast('Nenhum sensor selecionado. Acorde o sensor (gire a pedivela / ponha a cinta) e tente de novo, ou use "Mostrar todos".');
    else if(e.name==='SecurityError')toast('Bluetooth bloqueado aqui (página dentro de iframe ou sem permissão). Abra a página direto no Chrome.');

function toggleSim(){S.sim.on=!S.sim.on;render()}

/* ---------- Ghost Run ----------
   O ghost corre o melhor tempo prévio (seu ou do líder do ranking) na mesma pista e no mesmo modo de inclinação. Usa o rastro
   (tempo, distância) gravado no treino; treinos antigos, sem rastro, caem num ritmo constante com o tempo total. */
S.ghost=load('cad_ghost','me');
function bestRun(r,p,m=S.inten){const l=((p&&p.history)||[]).filter(h=>h.routeId===r.id&&h.done&&(h.mode||'normal')==='normal'&&(h.inten||'off')===m);return l.length?l.reduce((a,b)=>b.time<a.time?b:a):null}
function ghostFor(r){if(!r||S.ghost==='off')return null;let p=profile(),src='me';
  if(S.ghost==='leader'&&lvInfo(G().xp).l>=FEAT.ghostLider){const b=board(r)[0],lp=b&&S.profiles.find(x=>x.id===b.pid);if(lp){p=lp;src='leader'}}
  const run=bestRun(r,p);if(!run)return null;
  return{src,name:p.name,me:p.id===S.cur,total:run.time,tr:run.trace&&run.trace.length>1?run.trace:null}}
function setGhost(v){if(woBusy())return;if(v==='leader'&&lvInfo(G().xp).l<FEAT.ghostLider){toast('Ghost do líder desbloqueia no nível '+FEAT.ghostLider);render();return}S.ghost=v;if(!isAdmin())store('cad_ghost',v);render()}
function ghDist(gh,t,r){if(!gh)return 0;if(t>=gh.total)return r.dist;const tr=gh.tr;if(!tr)return r.dist*t/gh.total;
  for(let i=1;i<tr.length;i++)if(t<=tr[i][0]){const a=tr[i-1],b=tr[i],f=b[0]>a[0]?(t-a[0])/(b[0]-a[0]):1;return a[1]+(b[1]-a[1])*f}return tr[tr.length-1][1]}
function ghTime(gh,d,r){if(!gh)return 0;const tr=gh.tr;if(!tr)return gh.total*Math.min(1,d/r.dist);
  for(let i=1;i<tr.length;i++)if(d<=tr[i][1]){const a=tr[i-1],b=tr[i],f=b[1]>a[1]?(d-a[1])/(b[1]-a[1]):1;return a[0]+(b[0]-a[0])*f}return gh.total}

/* ---------- Modo "Fuga da Horda" ----------
   Depois de HORDA.delay s pedalando, um zumbi sai da largada e avança linearmente pelo GPX, cada vez mais rápido. O ciclista precisa
   manter distância; se o zumbi o alcançar, o modo termina (o treino é salvo). Chegar ao fim da rota = escapou. */

   <div class="min-w-0 flex-1"><h3 class="font-display text-xl font-bold leading-none" style="color:#9be58a">Fuga da Horda</h3><p class="text-xs text-zinc-400 mt-1">Um zumbi vai atrás de você pela pista. Mantenha o ritmo e não deixe ele te alcançar. Engrenagens e XP ×${ECO.hordaMul}.</p></div>
   ${ok?`<button onclick="startHorda()" class="shrink-0 px-3 py-2 rounded-lg font-semibold text-sm flex items-center gap-1.5" style="background:#2f7a2a;color:#fff"><i data-lucide="skull" class="w-4 h-4"></i>Fugir</button>`:`<div class="shrink-0 text-xs text-zinc-500 flex items-center gap-1"><i data-lucide="lock" class="w-3.5 h-3.5"></i>Nível ${FEAT.horda}</div>`}</section>`}
function startHorda(){if(lvInfo(G().xp).l<FEAT.horda){toast('Fuga da Horda desbloqueia no nível '+FEAT.horda);return}
  const w=S.wo;if(w.dist>0||w.running||cdBusy){toast('Já há um treino em andamento');setTab('treino');return}
  const id=(S.rec&&S.rec.order[S.rec.i])||(S.routes[0]&&S.routes[0].id);if(!id)return;
  w.route=id;w.mode='horda';w.hz={mv:0,rel:false,z:0,t:0,sp:0};S.tab='treino';render();startCountdown()}
/* chamado pelo advance() a cada passo: acorda o zumbi, move e verifica a captura (devolve true se foi alcançado) */
function hordaStep(m,L,r){const w=S.wo,z=w.hz;if(!z)return false;
  if(!z.rel){if(L.spd>3)z.mv=(z.mv||0)+m;if(z.mv>=HORDA.delay){z.rel=true;z.z=0;z.t=0;toast('O zumbi acordou! Mantenha o ritmo')}return false}
  z.t+=m;z.sp=Math.min(HORDA.vMax,HORDA.v0+HORDA.vInc*z.t/60)*(1-(petFx().horda||0)/100);z.z+=z.sp/3600*m;
  return z.z>=w.dist-HORDA.catchKm}

const NEON_COLORS=['#00e5ff','#39ff14','#ff2bd6','#ffe600','#ff7a00','#ff2a2a','#3d7bff','#b44dff','#ffffff'];

function cosmMigrate(p){if(!p)return{ch:false,ref:0};let ch=false,ref=0;if(!Array.isArray(p.owned))p.owned=[];
  const swap=(old,nw,col)=>{const k='frame:'+old,i=p.owned.indexOf(k);

  swap('aco','prata');swap('neon-ciano','neon','#00e5ff');swap('neon-magenta','neon','#ff2bd6');
  [['titanio',700],['ouro-brilho',6000],['neon',62000],['papel',100]].forEach(([old,pr])=>{if(p.owned.includes('frame:'+old)){G(p).coins+=pr;ref+=pr}swap(old,'')});

const MASCOTS=Object.fromEntries(MASCOT_LIST.map(m=>[m.id,m]));
/* atributos: valor no nível 1 do mascote (lo) e no nível máximo (hi), multiplicado pela raridade (RARITY.m).

/* nível do mascote: sobe com o XP dos treinos feitos com ele equipado */
const PET_MAX=20,petCost=l=>Math.round(260*Math.pow(l,1.3));

const PD=p=>(p.pets&&typeof p.pets==='object'&&!Array.isArray(p.pets))?p.pets:(p.pets={});

/* bônus ativos do mascote equipado ({id: valor}); em cache porque factor() roda várias vezes por segundo */
const NOFX=Object.freeze({});let _pf={k:'',v:NOFX};
function petFx(p=profile()){const m=p&&MASCOTS[p.mascot];if(!m||!m.fx.length)return NOFX;const xp=petXpOf(p,m.id),k=m.id+':'+xp;
  if(_pf.k===k)return _pf.v;const l=petInfo(xp).l,v={};m.fx.forEach(id=>v[id]=petVal(id,m.rar,l));_pf={k,v};return v}
/* avatar do mascote: o emoji ocupa quase todo o círculo; sem mascote equipado mostra o espaço vazio (pata tracejada). go=true: clicar leva à Loja.
   Se p.pets existir, mostra o nível do mascote num selo no canto. */
/* centraliza o emoji de verdade: desenha em canvas, recorta a caixa visível (sem o espaço em branco que cada fonte deixa) e usa como imagem quadrada */
const _emc={};
function emojiImg(ch){if(ch in _emc)return _emc[ch];let r=null;
  try{const N=400,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});
    x.font='200px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textBaseline='alphabetic';x.fillText(ch,60,270);
    const d=x.getImageData(0,0,N,N).data;let x0=N,y0=N,x1=-1,y1=-1;

  return _emc[ch]=r}
function mascotSlot(p,size=34,go=false){const m=p&&MASCOTS[p.mascot],oc=go?` onclick="setTab('loja')" onkeydown="if(event.key==='Enter')setTab('loja')" role="button" tabindex="0"`:'',cur=go?' cursor-pointer':'';
  if(!m)return `<div class="mas mas-vazio${cur}" style="width:${size}px;height:${size}px"${oc} title="Sem mascote · adote um na Loja" aria-label="Sem mascote"><i data-lucide="paw-print" style="width:${size*.46}px;height:${size*.46}px"></i></div>`;

function trainOn(id){if(S.wo.dist>0||S.wo.running){toast('Finalize o treino atual antes de trocar de rota');S.tab='treino';render();return}S.wo.route=id;closeModal();setTab('treino')}
function routeDetail(id){const r=S.routes.find(x=>x.id===id);if(!r)return;const es=elevStats(r.elev),b=userBest(r);
  openModal(`<div class="-m-5 mb-4">${cover(r,'h-48')}</div><div class="flex justify-between items-start gap-3"><h2 class="font-display text-4xl font-bold leading-tight">${esc(r.name)}</h2><button onclick="closeModal()" class="text-zinc-400 hover:text-white"><i data-lucide="x"></i></button></div>
   <p class="text-sm text-zinc-300 my-2">${esc(r.desc)||'Sem descrição.'}</p>
   <div class="grid grid-cols-4 gap-2 text-center my-3">${[['Distância',r.dist.toFixed(1)+' km'],['Ganho','+'+es.gain+' m'],['Altitude máx.',es.max+' m'],['Seu recorde',b?fmt(b):'--']].map(x=>`<div class="rounded-lg bg-ink border border-line p-2"><div class="text-[11px] text-zinc-400">${x[0]}</div><div class="font-display text-xl font-bold text-neon">${x[1]}</div></div>`).join('')}</div>
   <div class="text-xs text-zinc-400 mb-1">Circuito${r.track?'':' (traçado simulado)'}</div><div class="h-64 rounded-xl bg-ink border border-line p-2 mb-3">${trackSvg(r,0)}</div>
   <div class="text-xs text-zinc-400">Altimetria${r.demo||r.simElev?' (simulada)':''}</div>${elevSvg(r)}
   <h3 class="font-display text-2xl font-bold mt-3">Ranking completo</h3><ol class="text-sm divide-y divide-line">${rankHtml(board(r),20)}</ol>
   <div class="flex gap-2 mt-4"><button onclick="editRoute('${r.id}')" class="flex-1 py-2.5 rounded-lg border border-line flex items-center justify-center gap-2"><i data-lucide="pencil" class="w-4 h-4"></i>Editar</button><button onclick="delRoute('${r.id}')" class="py-2.5 px-4 rounded-lg border border-line text-zinc-400 hover:text-ember hover:border-ember"><i data-lucide="trash-2" class="w-4 h-4"></i></button><button onclick="trainOn('${r.id}')" class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">Treinar</button></div>`,'max-w-2xl')}
function delRoute(id){if(!confirm('Excluir esta rota da biblioteca?'))return;S.routes=S.routes.filter(r=>r.id!==id);if(S.wo.route===id)S.wo.route=null;saveRoutes();q({t:'del',tb:'routes',col:'id',val:id});closeModal();render()}
function editRoute(id,isNew=false){const r=isNew?S.edit:S.routes.find(x=>x.id===id);S.edit={...r,isNew};
  openModal(`<h2 class="font-display text-3xl font-bold mb-4">${isNew?'Salvar rota importada':'Editar rota'}</h2><form onsubmit="saveRoute(event)" class="space-y-3">
   <label class="block text-sm">Nome da rota<input name="rn" required maxlength="60" value="${esc(r.name)}" class="${IN} mt-1"></label>
   <label class="block text-sm">Descrição<textarea name="rd" rows="3" maxlength="300" class="${IN} mt-1">${esc(r.desc)}</textarea></label>
   <label class="block text-sm">URL da foto de capa<input name="rp" type="url" value="${esc(r.photo)}" placeholder="https://..." class="${IN} mt-1"></label>
   <label class="block text-sm">Distância total (km)<input name="rk" type="number" step="0.01" min="0.1" required value="${(+r.dist).toFixed(2)}" class="${IN} mt-1"></label>
   <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-lg border border-line">Cancelar</button><button class="flex-1 py-2.5 rounded-lg bg-brand text-white font-semibold">${isNew?'Adicionar à biblioteca':'Salvar alterações'}</button></div></form>`)}
function saveRoute(e){e.preventDefault();const f=e.target.elements,r={...S.edit};
  r.name=f.rn.value.trim();r.desc=f.rd.value.trim();r.photo=f.rp.value.trim();r.dist=+f.rk.value;
  const isNew=r.isNew;delete r.isNew;
  if(isNew)S.routes.unshift(r);else S.routes=S.routes.map(x=>x.id===r.id?r:x);
  S.edit=null;saveRoutes();q({t:'up',tb:'routes',row:rRow(r)});closeModal();toast(isNew?'Rota adicionada':'Rota atualizada');render()}

/* ---------- Importação GPX ---------- */
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);
  const q=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function parseGPX(txt,fallbackName){
  const d=new DOMParser().parseFromString(txt,'application/xml');
  if(d.querySelector('parsererror'))throw new Error('O arquivo não é um XML válido.');
  let pts=[...d.getElementsByTagName('trkpt')];if(pts.length<2)pts=[...d.getElementsByTagName('rtept')];
  if(pts.length<2)throw new Error('Nenhum ponto de trilha (trkpt) encontrado no arquivo.');
  let dist=0,prev=null;const cum=[],ele=[],xy=[];
  const lat0=+pts[0].getAttribute('lat'),lon0=+pts[0].getAttribute('lon'),kx=Math.cos(lat0*Math.PI/180)*111.32;
  pts.forEach(p=>{const c=[+p.getAttribute('lat'),+p.getAttribute('lon')];if(prev)dist+=hav(prev,c);prev=c;cum.push(dist);
    xy.push([(c[1]-lon0)*kx,-(c[0]-lat0)*110.57]);
    const e=p.getElementsByTagName('ele')[0];ele.push(e?parseFloat(e.textContent):NaN)});
  const rs=[];{let j=0;for(let i=0;i<240;i++){const tg=dist*i/239;while(j<cum.length-1&&cum[j]<tg)j++;
    const a=Math.max(j-1,0),sp=cum[j]-cum[a],t=sp>0?Math.min(1,Math.max(0,(tg-cum[a])/sp)):0;
    rs.push([xy[a][0]+(xy[j][0]-xy[a][0])*t,xy[a][1]+(xy[j][1]-xy[a][1])*t])}}
  const track=normTrack(rs);
  const valid=ele.filter(v=>!isNaN(v)).length;let elev,simElevated=false;
  if(valid>=pts.length*.5&&dist>0){elev=[];let j=0,last=ele.find(v=>!isNaN(v));
    for(let i=0;i<60;i++){const tg=dist*i/59;while(j<cum.length-1&&cum[j]<tg)j++;if(!isNaN(ele[j]))last=ele[j];elev.push(Math.round(last))}
    elev=elev.map((v,i,a)=>{const s=a.slice(Math.max(0,i-2),i+3);return Math.round(s.reduce((x,y)=>x+y,0)/s.length)})}
  else{elev=simElev(fallbackName+dist);simElevated=true}
  const nm=(d.querySelector('trk > name')||d.querySelector('metadata > name')||d.querySelector('name'));
  const ds=d.querySelector('trk > desc')||d.querySelector('metadata > desc');
  return{id:uid(),name:((nm&&nm.textContent)||fallbackName).trim(),desc:((ds&&ds.textContent)||'').trim(),photo:'',dist:+dist.toFixed(2),elev,track,simElev:simElevated,points:pts.length}}
$('#gpxFile').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{const r=parseGPX(await f.text(),f.name.replace(/\.gpx$/i,''));S.edit=r;editRoute(r.id,true);toast(r.points+' pontos lidos · '+r.dist+' km')}
  catch(e){toast('Erro ao importar: '+e.message)}});

function restoreWo(remote){let sv=load('cad_wo',null);
  if(remote&&(!sv||(remote.saved||0)>(sv.saved||0)))sv=remote; /* usa o mais recente entre este aparelho e o Supabase */
  if(sv&&sv.profile===S.cur&&profile()&&sv.dist>0&&S.routes.some(r=>r.id===sv.route)&&Date.now()-sv.saved<43200000){
    sv={...sv};delete sv.profile;delete sv.saved;if(sv.coins==null&&sv.pts!=null){sv.coins=sv.pts;sv.xp=Math.round(sv.pts*1.5)}delete sv.pts;if(!Array.isArray(sv.trace))sv.trace=[];
    const hadGh=!!(sv.gh&&sv.gh.re);if(hadGh)sv.gh=null;
    Object.assign(S.wo,sv,{running:false,last:Date.now(),armed:false,auto:false});if(hadGh){const rr=S.routes.find(x=>x.id===S.wo.route);S.wo.gh=rr?ghostFor(rr):null}S.wo.evCur=null;S.wo.evs.forEach(x=>{if(x.st==='on')x.st='lost'});S.tab='treino';
    setTimeout(()=>toast('Treino anterior restaurado. Reconecte os sensores e toque em Retomar'),400)}}
/* Ao abrir o app sempre vai para a seleção de perfil; o último perfil só é usado para carregar os dados */
let bootRemote;
async function boot(){
  if(!sb){bootRemote=null;applyInten();render();return}
  $('#app').innerHTML='<main class="min-h-screen grid place-items-center text-zinc-400">Carregando dados…</main>';
  S.cur=S.lastCur;let remote=null;
  try{await flush();if(outbox.length)throw new Error('pendente');remote=await pull();setSync('ok')}
  catch(e){console.error(e);setSync('err');toast('Sem conexão com o Supabase: usando os dados salvos neste aparelho')}
  S.cur=null;bootRemote=remote;applyInten();render()}
boot();
/* PWA: registra o service worker (exige https ou localhost) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e)));
